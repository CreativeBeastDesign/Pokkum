name: Update Base Image Lockfile

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Check & Update Base Image Digests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Update Base Image Lockfile (Distroless & Chainguard)
        run: |
          go run ./cmd/pokkum base update --preset distroless
          go run ./cmd/pokkum base update --preset chainguard

      - name: Run Test Suite
        run: go test ./...

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(deps): update pokkum.lock base image digests'
          title: 'chore(deps): update pokkum.lock base image digests'
          body: |
            Automated base image digest update.
            
            Runs `pokkum base update` to fetch the latest upstream SHA256 digests for `distroless` and `chainguard` presets, maintaining bit-for-bit reproducibility.
          branch: 'automation/update-base-lock'
          delete-branch: true
          labels: |
            dependencies
            automated-pr
