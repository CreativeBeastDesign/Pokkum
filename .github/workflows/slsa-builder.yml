name: SLSA L3 Trusted Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build Pokkum Executables
        run: |
          # Resolve release metadata for -X ldflags (parity with Makefile build
          # target and .goreleaser.yaml). VERSION comes from the nearest tag;
          # BUILD_DATE derives from SOURCE_DATE_EPOCH (last commit) so the
          # binary is reproducible and matches the layer/config timestamps.
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct 2>/dev/null || date +%s)"
          BUILD_DATE="$(date -u -d @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r ${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"
          mkdir -p build/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o build/pokkum-linux-amd64 ./cmd/pokkum
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o build/pokkum-linux-arm64 ./cmd/pokkum
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o build/pokkum-darwin-amd64 ./cmd/pokkum
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o build/pokkum-darwin-arm64 ./cmd/pokkum

      - name: Generate Binary Hashes
        id: hash
        run: |
          cd build/
          sha256sum pokkum-* > checksums.txt
          echo "hashes=$(sha256sum checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: build/
          if-no-files-found: error

  provenance:
    needs: [build]
    name: Generate SLSA L3 Provenance
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
