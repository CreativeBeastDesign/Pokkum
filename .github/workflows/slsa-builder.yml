name: SLSA L3 Trusted Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Pokkum Executables
        run: |
          mkdir -p build/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/pokkum-linux-amd64 ./cmd/pokkum
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/pokkum-linux-arm64 ./cmd/pokkum
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/pokkum-darwin-amd64 ./cmd/pokkum
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/pokkum-darwin-arm64 ./cmd/pokkum

      - name: Generate Binary Hashes
        id: hash
        run: |
          cd build/
          sha256sum pokkum-* > checksums.txt
          echo "hashes=$(sha256sum checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: build/
          if-no-files-found: error

  provenance:
    needs: [build]
    name: Generate SLSA L3 Provenance
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
