name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from go.mod rather than pinning a floating minor.
          # setup-go v6+ sets GOTOOLCHAIN=local, so Go will NOT fetch a newer
          # toolchain to satisfy go.mod — it fails instead. `go-version: '1.26'`
          # resolved to 1.26.5 on the macOS runner against a go.mod requiring
          # >= 1.26.6 and broke the build; the resolved patch is per-platform, so
          # reasoning about what a floating minor "should" give is unreliable.
          # go-version-file keeps this correct automatically on every Go bump.
          go-version-file: 'go.mod'
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image: the
        # provider errors at runtime when it looks for the missing blob. Every
        # job that builds or exercises the CLI needs them.
        run: make supervisor static-server

      - name: Check Code Formatting
        if: ${{ !cancelled() }}
        run: test -z "$(gofmt -s -l .)"

      # Release-flag regression guard (Roadmap #132): asserts -trimpath,
      # -ldflags="-s -w", and -X main.version/commit/buildDate stay present
      # across Makefile, .goreleaser.yaml, and slsa-builder.yml. This is step
      # 0 of `make verify` but wasn't previously enforced on PRs because CI
      # runs its own steps rather than `make verify`.
      - name: Compiler Build Flags Regression Guard
        if: ${{ !cancelled() }}
        run: bash scripts/check-build-flags.sh

      # docs/roadmap/*.yaml is the single machine-readable source of truth
      # for "what's done / what's next" (see scripts/gen-docs's doc
      # comment). This regenerates docs/Roadmap.md/Shipped.md/Features.md/
      # items/*.md from it and fails the build if that changes anything —
      # same "make verify" step as check-docs-freshness, run here too since
      # CI runs its own steps rather than `make verify` (same rationale as
      # the compiler build flags guard above).
      - name: Roadmap Docs Freshness Guard
        if: ${{ !cancelled() }}
        run: bash scripts/check-docs-freshness.sh

      # Run FROM SOURCE via `go run`, not via golangci-lint-action's prebuilt
      # binary. A prebuilt binary carries the Go version it was compiled with,
      # and golangci-lint refuses to load a config whose target Go version is
      # newer than its own: the previous v1.62.2 pin (built with go1.23) exited 3
      # with "can't load config" against go.mod's 1.26.6, so it linted nothing —
      # and because that failed at the step level, GitHub skipped every
      # verification step behind it. `go run` uses this job's toolchain, making
      # the linter's Go version equal the module's by construction, so no future
      # Go bump can reintroduce that. Keep this version identical to the
      # Makefile's GOLANGCI_LINT and release.yml's; cmd/pokkum/lintversion_test.go
      # fails if they drift.
      - name: Run golangci-lint
        if: ${{ !cancelled() }}
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Run govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Check Hexagonal Architecture Purity
        if: ${{ !cancelled() }}
        run: go test -v ./internal/architecture_test.go

      # Scoped race detector: internal/adapters/registry/mount_test.go's
      # mountStats concurrency test documents itself as existing specifically
      # to be run under -race. Scoped to the packages with real concurrency
      # (registry mount observer, core pipeline orchestration, layer
      # packager, supervisor PID-1 binaries) rather than the full module,
      # since -race roughly doubles-to-triples test time for little payoff
      # elsewhere. See Makefile's RACE_PACKAGES for the exact set.
      - name: Run Race Detector (scoped)
        if: ${{ !cancelled() }}
        run: make test-race

      # Full suite + coverage profile in one pass (short mode: no network /
      # Bun dependency here — the real-build Bun e2e tests run in the
      # separate `e2e-real-build` job below so this gate stays fast and
      # hermetic). -coverpkg=./... so the profile reflects true whole-module
      # statement coverage, not just same-package self-coverage.
      - name: Run Full Test Suite (with coverage)
        if: ${{ !cancelled() }}
        run: go test -short -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      # Coverage floor: a "must not regress much below today" ratchet, not
      # an aspirational number. Floor was set from the real measured
      # baseline (75.5% short-mode total statements, measured 2026-08-18)
      # minus ~2.5 points of slack — see scripts/check-coverage.sh for the
      # full rationale and how to move the floor as coverage improves.
      - name: Enforce Coverage Floor
        if: ${{ !cancelled() }}
        run: bash scripts/check-coverage.sh coverage.out

      - name: Upload Coverage Profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

      - name: Verify CLI Build
        if: ${{ !cancelled() }}
        run: go build -o ./pokkum-test ./cmd/pokkum && rm -f ./pokkum-test

  # Real-build e2e tests: tests/integration/reproducibility_e2e_test.go,
  # tests/integration/layered_prerendered_e2e_test.go, and the analogous
  # real-Bun tests in internal/adapters/bunexec and
  # internal/adapters/sveltekitutils all gate on `testing.Short()` +
  # `exec.LookPath("bun")`. Without Bun on PATH they silently skip, so CI's
  # "e2e" coverage was previously 100% mock-compiler. This job installs Bun
  # and Bun-installs the two fixture directories' dependencies (gitignored,
  # so they aren't present from checkout) so those tests actually execute.
  #
  # tests/integration/runtime_smoke_test.go's
  # TestRuntimeSmoke_LayeredStrategy_BootsAndServes additionally needs a
  # reachable container runtime and network access to pull a real base
  # image — ubuntu-latest ships Docker pre-installed and running by default,
  # so no extra setup step is added here for it; the test's own
  # exec.LookPath("docker")+daemon-reachability gate skips cleanly (not a
  # failure) if that ever stops being true. It is the only test in this repo
  # that actually boots a produced image and polls its probe endpoints
  # rather than only asserting layer structure/digests — see
  # mem:self_review_checklist row 17 and Lessons.md's missing-entrypoint
  # incident for why that gap mattered enough to close.
  #
  # Kept as its own job rather than folded into the main one: these do real
  # network installs, multiple full SvelteKit builds, and (as of the runtime
  # smoke test) a real container boot, so they're slower and less
  # deterministic than the rest of CI, and isolating them keeps the
  # fast/hermetic main job fast and hermetic. An explicit timeout is set
  # because the real builds + `bun install` network calls + the runtime
  # smoke test's base-image pull and container startup can exceed `go
  # test`'s default 10m per-package timeout.
  e2e-real-build:
    name: Real Bun Build E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # see the note on the first setup-go step
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image: the
        # provider errors at runtime when it looks for the missing blob. Every
        # job that builds or exercises the CLI needs them.
        run: make supervisor static-server

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Fixture Dependencies
        run: |
          set -eu
          for dir in testdata/fixtures/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "== bun install in ${dir} =="
              (cd "$dir" && bun install --frozen-lockfile)
            fi
          done

      # --hermetic-mount-isolation's end-to-end test cannot run as a normal
      # runner user: applyHermeticMountIsolation bind-mounts a mask over
      # hermetic-sensitive paths, and on this runner that returns EPERM inside
      # the unprivileged user namespace. Relaxing
      # kernel.apparmor_restrict_unprivileged_userns was tried first and did NOT
      # help (the sysctl applied cleanly and the mount still returned "operation
      # not permitted"), so the cause is the runner's mount privileges rather
      # than AppArmor's userns restriction specifically.
      #
      # The test itself is sound: it passes in a privileged Linux container. So
      # rather than let a build-sandbox security control go untested everywhere
      # (these tests are Linux-only, and this is the only Linux job that runs
      # them), run exactly those tests in a privileged container. Without this
      # step they skip cleanly via hermeticEnvironmentUnavailable and the control
      # has no executing test at all.
      # -buildvcs=false is load-bearing, not tidiness: the tests build a real
      # pokkum binary, and git inside the container rejects the bind-mounted
      # workspace as dubiously-owned (different UID), so `go build` fails with
      # "error obtaining VCS status: exit status 128". That failure surfaces as a
      # t.Skipf, so without this flag the step passes green while testing nothing
      # — the same shape of silent hole this whole CI repair is about.
      - name: Hermetic Sandbox Tests (privileged container)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --privileged \
            -v "$PWD":/src -w /src \
            -e GOFLAGS="-mod=mod -buildvcs=false" \
            golang:1.26 \
            go test -count=1 -run 'Hermetic' -v ./internal/adapters/bunexec/

      # The runtime smoke tests get their own step, ahead of the rest of the
      # e2e suite, for one reason: they are the only tests in this repo that
      # boot a produced image, and every one of their preconditions (bun, the
      # fixture deps, a reachable Docker daemon, a network path to gcr.io) is
      # GUARANTEED in this job — installed by the steps above, or shipped by
      # ubuntu-latest. A SKIP here therefore does not mean "not applicable", it
      # means this repo's only boot coverage silently stopped running while the
      # step still printed ok. That is exactly the hole that let commit b439e6b's
      # bug ship: every layered image exited 125 with "startup attestation
      # mismatch" while `go test ./...` reported 49/49 packages ok.
      #
      # Two independent floors, because a green `go test` is a claim about what
      # RAN (mem:self_review_checklist row 47):
      #   - POKKUM_REQUIRE_RUNTIME_SMOKE=1 turns every environmental t.Skip
      #     inside the smoke tests into a hard failure naming the precondition
      #     that was not met (see tests/integration/runtime_smoke_gate_test.go,
      #     which tests that predicate in both directions).
      #   - the output is then scanned anyway: any SKIP line fails the step, and
      #     fewer than the expected number of PASSes fails it too — that catches
      #     the skips no env var can reach (a `-run` pattern matching nothing, a
      #     test renamed or deleted, `-short` creeping into the command line).
      - name: Runtime Smoke Tests (boot a produced image; must not skip)
        if: ${{ !cancelled() }}
        env:
          POKKUM_REQUIRE_RUNTIME_SMOKE: '1'
        run: |
          set -euo pipefail
          go test -timeout=20m -count=1 -v -run 'TestRuntimeSmoke' ./tests/integration 2>&1 | tee runtime-smoke.log
          if grep -q -- '--- SKIP' runtime-smoke.log; then
            echo "::error::a runtime smoke test SKIPPED where every precondition is guaranteed: that is the loss of all boot coverage, not a clean pass"
            exit 1
          fi
          passed="$(grep -c -- '--- PASS: TestRuntimeSmoke' runtime-smoke.log || true)"
          # Layered (bun), static, and --runtime=node. Raise this floor when a
          # smoke test is added; never lower it to make a red run green.
          if [ "$passed" -lt 3 ]; then
            echo "::error::only $passed runtime smoke tests passed, expected at least 3"
            exit 1
          fi
          echo "runtime smoke tests passed: $passed"

      # -skip keeps the smoke tests from running a second time here; the step
      # above is their home, and it is the one with the no-skip floor.
      - name: Run Real-Build E2E Tests
        if: ${{ !cancelled() }}
        run: |
          go test -timeout=20m -v -skip 'TestRuntimeSmoke' \
            ./tests/integration/... \
            ./internal/adapters/bunexec/... \
            ./internal/adapters/sveltekitutils/...

      # NOT HERE: the secret guard's false-positive measurement.
      #
      # It runs over REAL minified bundles at testdata/fixtures/*/build and
      # .svelte-kit/output. Those are gitignored build output, and — crucially —
      # the real-build tests above never create them: copyFixtureProject copies
      # each fixture into t.TempDir() and builds THERE, deliberately, because
      # a fixture directory shared across packages must never be written to by
      # a test (Lessons.md, 2026-08-19). So the corpus does not exist on a CI
      # runner at any point, and cannot be made to without either breaking that
      # rule or teaching the test to accept a corpus root outside the repo.
      #
      # A step was added here setting POKKUM_REQUIRE_MINIFIED_CORPUS=1 on the
      # assumption the e2e tests populated those directories. They do not, and
      # the gate correctly failed rather than passing on a corpus of nothing.
      # The measurement therefore runs on developer machines that have built
      # the fixtures, and is a hard failure there when the env var is set — it
      # is not, today, a CI-enforced guarantee. Recorded rather than papered
      # over, so the next reader does not re-add this step on the same wrong
      # premise.

  # Scoped macOS platform job: the release ships darwin amd64/arm64 binaries
  # (see .goreleaser.yaml / slsa-builder.yml) and internal/adapters/bunexec/
  # hermetic_other_test.go exists specifically to cover the non-Linux code
  # path, but CI otherwise only ever runs on ubuntu-latest. Running the FULL
  # suite on macOS runners is expensive and most packages have no
  # platform-dependent behavior, so this is scoped to only the packages that
  # actually contain a `//go:build` OS switch or `runtime.GOOS` check:
  # cmd/pokkum, internal/core, internal/adapters/provenance,
  # internal/adapters/bunexec, and supervisor/cmd/pokkum-init.
  macos-platform-tests:
    name: macOS Platform-Specific Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # see the note on the first setup-go step
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image: the
        # provider errors at runtime when it looks for the missing blob. Every
        # job that builds or exercises the CLI needs them.
        run: make supervisor static-server

      - name: Verify CLI Builds Natively on macOS
        if: ${{ !cancelled() }}
        run: go build -o ./pokkum-test ./cmd/pokkum && rm -f ./pokkum-test

      - name: Run Platform-Sensitive Package Tests (-short)
        if: ${{ !cancelled() }}
        run: |
          go test -short -v \
            ./cmd/pokkum/... \
            ./internal/core/... \
            ./internal/adapters/provenance/... \
            ./internal/adapters/bunexec/... \
            ./supervisor/cmd/pokkum-init/...

  # ---------------------------------------------------------------------------
  # The two composite actions this repository publishes had never been executed
  # by anything. `uses: ./` appeared in no workflow, and cmd/pokkum's
  # actionyml_test.go only ever checked that the flag NAMES action.yml emits
  # exist on `pokkum build` — a static string comparison, not a run.
  #
  # Three real defects were sitting behind that gap, all in the same handful of
  # lines, and all of them shipped in the released v1.0.6 action:
  #
  #   1. `--log-format json` was passed in the separated form, which the CLI's
  #      pre-parser (cmd/pokkum/main.go's flag()) did not recognise, so logs
  #      stayed in text format and BOTH outputs came back empty on every run.
  #   2. `ref` was parsed as the first "ref" key in the log — which is the
  #      resolved BASE image. A deploy step consuming this action's ref output
  #      would have deployed gcr.io/distroless/cc-debian12.
  #   3. `digest` was parsed as the first "digest" key — the startup-attestation
  #      digest, a bare 64-hex string with no sha256: prefix.
  #
  # Defect 1 masked 2 and 3: with text logs nothing matched, so both outputs
  # were merely empty rather than wrong. Fixing the flag alone would have turned
  # empty into confidently-wrong. See Lessons.md, 2026-08-23.
  #
  # This job builds a real image through the real action and asserts on what
  # comes back out, because that is the only thing that would have caught any of
  # the three.
  github-action-selftest:
    name: GitHub Action Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # see the note on the first setup-go step
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image.
        run: make supervisor static-server

      # The action installs a RELEASED CLI when it does not find one on PATH.
      # That is the right behaviour for a consumer and the wrong one for this
      # job: a PR that changes `pokkum build` would be validated against the
      # last release rather than against itself, and a flag this PR renames
      # would go on passing until the next release broke every user at once.
      # Putting this tree's binary on PATH first takes the action's
      # already-installed branch, so the argument assembly below runs against
      # the CLI in the diff. The install path itself is covered by the
      # setup-pokkum job that follows.
      - name: Build This Tree's CLI onto PATH
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/pokkum" ./cmd/pokkum
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Built out of a copy, never in testdata/. A build writes .svelte-kit/ and
      # build/ into its project directory, and a fixture directory shared across
      # packages must not be mutated by anything (Lessons.md, 2026-08-19).
      - name: Stage a Fixture Project
        run: |
          set -euo pipefail
          cp -R testdata/fixtures/sveltekit-adapter-node "$RUNNER_TEMP/app"
          (cd "$RUNNER_TEMP/app" && bun install --frozen-lockfile)

      # output: tarball is what makes this runnable on a PR at all — it
      # exercises the whole pipeline (resolve base, build, package, index, SBOM,
      # publish) and produces a real digest, with no registry and no
      # credentials. `push` would need a secret no fork PR can have; `dry-run`
      # publishes nothing and so cannot check the outputs, which is where every
      # one of the three defects lived.
      - name: Run the Action (tarball output)
        id: action
        uses: ./
        with:
          project-dir: ${{ runner.temp }}/app
          repo: ghcr.io/creativebeastdesign/pokkum-action-selftest
          tags: latest,selftest
          platforms: linux/amd64
          output: tarball
          tarball-path: ${{ runner.temp }}/image.tar

      - name: Assert the Action's Outputs
        if: ${{ !cancelled() }}
        env:
          REF: ${{ steps.action.outputs.ref }}
          DIGEST: ${{ steps.action.outputs.digest }}
          REPO_INPUT: ghcr.io/creativebeastdesign/pokkum-action-selftest
        run: |
          set -euo pipefail

          fail=0
          note() { echo "::error::action self-test: $1"; fail=1; }

          echo "ref=$REF"
          echo "digest=$DIGEST"

          # Defect 1: both outputs were empty on every real run.
          [ -n "$REF" ]    || note "the 'ref' output is empty; the build published an image, so it must carry one"
          [ -n "$DIGEST" ] || note "the 'digest' output is empty; the build published an image, so it must carry one"

          # Defect 3: the attestation digest is a bare 64-hex string. Requiring
          # the algorithm prefix is what distinguishes the two.
          case "$DIGEST" in
            sha256:*) ;;
            *) note "the 'digest' output '$DIGEST' is not a sha256:-prefixed digest — this is the shape the startup-attestation digest has, i.e. the wrong value was picked out" ;;
          esac
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || note "the 'digest' output '$DIGEST' is not a well-formed sha256 digest"

          # Defect 2: `ref` used to be the resolved base image. Asserting it
          # merely "looks like a ref" would have passed on distroless, so this
          # asserts the repository is the one that was ASKED for.
          echo "$REF" | grep -Eq "^${REPO_INPUT}@sha256:[0-9a-f]{64}$" \
            || note "the 'ref' output '$REF' is not '${REPO_INPUT}@sha256:...' — if it names a base image (gcr.io/distroless/...), the output is being read off the wrong log line"

          # The two outputs describe one image and must agree.
          [ "${REF#*@}" = "$DIGEST" ] \
            || note "'ref' and 'digest' disagree: ref carries '${REF#*@}' but digest is '$DIGEST'"

          # And an artifact actually exists, so none of the above can be
          # satisfied by a build that reported success and wrote nothing.
          if [ ! -s "${RUNNER_TEMP}/image.tar" ]; then
            note "no tarball at ${RUNNER_TEMP}/image.tar, or it is empty — the action reported success without producing an image"
          else
            echo "tarball: $(stat -c%s "${RUNNER_TEMP}/image.tar") bytes"
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "action outputs verified: $REF"

  # Deliberately a separate job from the one above, on a runner with no Go
  # toolchain and no pokkum on PATH. That is the point: the job above puts this
  # tree's binary on PATH, which takes the action's already-installed
  # short-circuit and leaves the entire install path — the OS guard, the version
  # resolution, install.sh's download and SHA-256 verification — unexecuted.
  #
  # Passing no `version` input is also deliberate. It exercises the resolution
  # branch that replaced the old hardcoded 'v1.0.6' default: with `uses: ./`
  # there is no action ref to match, so it must fall through to `latest` rather
  # than installing nothing or failing. mem:self_review_checklist row 27(a) — a
  # new branch has to be observed executing, not merely read.
  #
  # dry-run keeps this cheap (~20s, no compile, no base image layers) and gives
  # the complementary output assertion: in a mode that publishes nothing, `ref`
  # and `digest` must be EMPTY rather than stale or fabricated. That is what
  # stops a future "fix" from defaulting them to the base image the way the
  # original log-scraping parser did.
  github-action-install-selftest:
    name: GitHub Action Install-Path Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Confirm the Runner Has No Pokkum
        # Without this the job could silently degrade into a re-run of the
        # already-installed path if some future step (or a cached tool) put a
        # pokkum on PATH first, and the install coverage would vanish with the
        # job still green.
        run: |
          set -euo pipefail
          if command -v pokkum >/dev/null 2>&1; then
            echo "::error::this job must start with no pokkum on PATH, but found $(command -v pokkum) — it is the only coverage of the install path"
            exit 1
          fi
          echo "no pokkum on PATH, as required"

      - name: Run the Action With No Version Input (installs, then dry-runs)
        id: dryrun
        uses: ./
        with:
          project-dir: testdata/fixtures/sveltekit-adapter-node
          repo: ghcr.io/creativebeastdesign/pokkum-action-selftest
          platforms: linux/amd64
          dry-run: 'true'

      - name: Assert the CLI Was Installed and Nothing Was Published
        if: ${{ !cancelled() }}
        env:
          REF: ${{ steps.dryrun.outputs.ref }}
          DIGEST: ${{ steps.dryrun.outputs.digest }}
        run: |
          set -euo pipefail

          # `command -v` rather than trusting the step's exit status: the
          # sibling setup-pokkum action once reported a successful install
          # while downloading nothing at all.
          command -v pokkum >/dev/null 2>&1 \
            || { echo "::error::the action completed but pokkum is not on PATH — nothing was installed"; exit 1; }
          echo "installed: $(pokkum --version 2>&1 | head -n 1)"

          if [ -n "$REF" ] || [ -n "$DIGEST" ]; then
            echo "::error::dry-run published nothing but reported ref='$REF' digest='$DIGEST'; these outputs must be empty when no image is published"
            exit 1
          fi
          echo "dry-run correctly reported no image"

  # Separate job, and deliberately on a clean runner with no pokkum on PATH:
  # this is the only coverage of the DOWNLOAD path — install.sh resolving a
  # release, verifying its SHA-256 against checksums.txt, and putting a working
  # binary on PATH. That step once created an empty directory, added it to PATH
  # and printed "installed successfully" without downloading anything, so every
  # workflow following the README got a green install step and then failed at
  # `pokkum: command not found`.
  setup-action-selftest:
    name: setup-pokkum Action Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install a Released CLI via the Action
        id: setup
        uses: ./.github/actions/setup-pokkum
        with:
          # Pinned rather than 'latest' on purpose. What is under test here is
          # the download-verify-install mechanism, not release resolution, and
          # 'latest' would make this job depend on an unauthenticated
          # api.github.com call that shares a rate limit with every other
          # runner. Old releases do not disappear, so a fixed point cannot rot.
          version: v1.0.6

      - name: Assert the CLI Is Really on PATH
        if: ${{ !cancelled() }}
        env:
          REPORTED: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail

          # `command -v` rather than trusting the step's own success: the
          # original bug was a step that succeeded while installing nothing.
          command -v pokkum >/dev/null 2>&1 \
            || { echo "::error::setup-pokkum reported success but pokkum is not on PATH"; exit 1; }

          installed="$(pokkum --version 2>&1 | head -n 1)"
          echo "installed: $installed"
          echo "reported:  $REPORTED"

          [ -n "$REPORTED" ] \
            || { echo "::error::setup-pokkum's 'version' output is empty"; exit 1; }

          # The binary must actually run, not merely exist and be executable.
          pokkum --help >/dev/null 2>&1 \
            || { echo "::error::pokkum is on PATH but 'pokkum --help' failed"; exit 1; }

          case "$installed" in
            *1.0.6*) ;;
            *) echo "::error::asked for v1.0.6 but the installed binary reports '$installed' — the version input is not reaching install.sh"; exit 1 ;;
          esac
