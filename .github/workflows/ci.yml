name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check Code Formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Check Hexagonal Architecture Purity
        run: go test -v ./internal/architecture_test.go

      - name: Run Full Test Suite
        run: go test ./...

      - name: Verify CLI Build
        run: go build -o ./pokkum-test ./cmd/pokkum && rm -f ./pokkum-test
