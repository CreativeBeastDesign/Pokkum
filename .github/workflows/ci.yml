name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from go.mod rather than pinning a floating minor.
          # setup-go v6+ sets GOTOOLCHAIN=local, so Go will NOT fetch a newer
          # toolchain to satisfy go.mod — it fails instead. `go-version: '1.26'`
          # resolved to 1.26.5 on the macOS runner against a go.mod requiring
          # >= 1.26.6 and broke the build; the resolved patch is per-platform, so
          # reasoning about what a floating minor "should" give is unreliable.
          # go-version-file keeps this correct automatically on every Go bump.
          go-version-file: 'go.mod'
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image: the
        # provider errors at runtime when it looks for the missing blob. Every
        # job that builds or exercises the CLI needs them.
        run: make supervisor static-server

      - name: Check Code Formatting
        run: test -z "$(gofmt -s -l .)"

      # Release-flag regression guard (Roadmap #132): asserts -trimpath,
      # -ldflags="-s -w", and -X main.version/commit/buildDate stay present
      # across Makefile, .goreleaser.yaml, and slsa-builder.yml. This is step
      # 0 of `make verify` but wasn't previously enforced on PRs because CI
      # runs its own steps rather than `make verify`.
      - name: Compiler Build Flags Regression Guard
        run: bash scripts/check-build-flags.sh

      # docs/roadmap/*.yaml is the single machine-readable source of truth
      # for "what's done / what's next" (see scripts/gen-docs's doc
      # comment). This regenerates docs/Roadmap.md/Shipped.md/Features.md/
      # items/*.md from it and fails the build if that changes anything —
      # same "make verify" step as check-docs-freshness, run here too since
      # CI runs its own steps rather than `make verify` (same rationale as
      # the compiler build flags guard above).
      - name: Roadmap Docs Freshness Guard
        run: bash scripts/check-docs-freshness.sh

      # Run FROM SOURCE via `go run`, not via golangci-lint-action's prebuilt
      # binary. A prebuilt binary carries the Go version it was compiled with,
      # and golangci-lint refuses to load a config whose target Go version is
      # newer than its own: the previous v1.62.2 pin (built with go1.23) exited 3
      # with "can't load config" against go.mod's 1.26.6, so it linted nothing —
      # and because that failed at the step level, GitHub skipped every
      # verification step behind it. `go run` uses this job's toolchain, making
      # the linter's Go version equal the module's by construction, so no future
      # Go bump can reintroduce that. Keep this version identical to the
      # Makefile's GOLANGCI_LINT and release.yml's; cmd/pokkum/lintversion_test.go
      # fails if they drift.
      - name: Run golangci-lint
        if: ${{ !cancelled() }}
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Run govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Check Hexagonal Architecture Purity
        if: ${{ !cancelled() }}
        run: go test -v ./internal/architecture_test.go

      # Scoped race detector: internal/adapters/registry/mount_test.go's
      # mountStats concurrency test documents itself as existing specifically
      # to be run under -race. Scoped to the packages with real concurrency
      # (registry mount observer, core pipeline orchestration, layer
      # packager, supervisor PID-1 binaries) rather than the full module,
      # since -race roughly doubles-to-triples test time for little payoff
      # elsewhere. See Makefile's RACE_PACKAGES for the exact set.
      - name: Run Race Detector (scoped)
        if: ${{ !cancelled() }}
        run: make test-race

      # Full suite + coverage profile in one pass (short mode: no network /
      # Bun dependency here — the real-build Bun e2e tests run in the
      # separate `e2e-real-build` job below so this gate stays fast and
      # hermetic). -coverpkg=./... so the profile reflects true whole-module
      # statement coverage, not just same-package self-coverage.
      - name: Run Full Test Suite (with coverage)
        if: ${{ !cancelled() }}
        run: go test -short -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      # Coverage floor: a "must not regress much below today" ratchet, not
      # an aspirational number. Floor was set from the real measured
      # baseline (75.5% short-mode total statements, measured 2026-08-18)
      # minus ~2.5 points of slack — see scripts/check-coverage.sh for the
      # full rationale and how to move the floor as coverage improves.
      - name: Enforce Coverage Floor
        if: ${{ !cancelled() }}
        run: bash scripts/check-coverage.sh coverage.out

      - name: Upload Coverage Profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

      - name: Verify CLI Build
        if: ${{ !cancelled() }}
        run: go build -o ./pokkum-test ./cmd/pokkum && rm -f ./pokkum-test

  # Real-build e2e tests: tests/integration/reproducibility_e2e_test.go,
  # tests/integration/layered_prerendered_e2e_test.go, and the analogous
  # real-Bun tests in internal/adapters/bunexec and
  # internal/adapters/sveltekitutils all gate on `testing.Short()` +
  # `exec.LookPath("bun")`. Without Bun on PATH they silently skip, so CI's
  # "e2e" coverage was previously 100% mock-compiler. This job installs Bun
  # and Bun-installs the two fixture directories' dependencies (gitignored,
  # so they aren't present from checkout) so those tests actually execute.
  #
  # tests/integration/runtime_smoke_test.go's
  # TestRuntimeSmoke_LayeredStrategy_BootsAndServes additionally needs a
  # reachable container runtime and network access to pull a real base
  # image — ubuntu-latest ships Docker pre-installed and running by default,
  # so no extra setup step is added here for it; the test's own
  # exec.LookPath("docker")+daemon-reachability gate skips cleanly (not a
  # failure) if that ever stops being true. It is the only test in this repo
  # that actually boots a produced image and polls its probe endpoints
  # rather than only asserting layer structure/digests — see
  # mem:self_review_checklist row 17 and Lessons.md's missing-entrypoint
  # incident for why that gap mattered enough to close.
  #
  # Kept as its own job rather than folded into the main one: these do real
  # network installs, multiple full SvelteKit builds, and (as of the runtime
  # smoke test) a real container boot, so they're slower and less
  # deterministic than the rest of CI, and isolating them keeps the
  # fast/hermetic main job fast and hermetic. An explicit timeout is set
  # because the real builds + `bun install` network calls + the runtime
  # smoke test's base-image pull and container startup can exceed `go
  # test`'s default 10m per-package timeout.
  e2e-real-build:
    name: Real Bun Build E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # see the note on the first setup-go step
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image: the
        # provider errors at runtime when it looks for the missing blob. Every
        # job that builds or exercises the CLI needs them.
        run: make supervisor static-server

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Fixture Dependencies
        run: |
          set -eu
          for dir in testdata/fixtures/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "== bun install in ${dir} =="
              (cd "$dir" && bun install --frozen-lockfile)
            fi
          done

      # --hermetic-mount-isolation's end-to-end test cannot run as a normal
      # runner user: applyHermeticMountIsolation bind-mounts a mask over
      # hermetic-sensitive paths, and on this runner that returns EPERM inside
      # the unprivileged user namespace. Relaxing
      # kernel.apparmor_restrict_unprivileged_userns was tried first and did NOT
      # help (the sysctl applied cleanly and the mount still returned "operation
      # not permitted"), so the cause is the runner's mount privileges rather
      # than AppArmor's userns restriction specifically.
      #
      # The test itself is sound: it passes in a privileged Linux container. So
      # rather than let a build-sandbox security control go untested everywhere
      # (these tests are Linux-only, and this is the only Linux job that runs
      # them), run exactly those tests in a privileged container. Without this
      # step they skip cleanly via hermeticEnvironmentUnavailable and the control
      # has no executing test at all.
      # -buildvcs=false is load-bearing, not tidiness: the tests build a real
      # pokkum binary, and git inside the container rejects the bind-mounted
      # workspace as dubiously-owned (different UID), so `go build` fails with
      # "error obtaining VCS status: exit status 128". That failure surfaces as a
      # t.Skipf, so without this flag the step passes green while testing nothing
      # — the same shape of silent hole this whole CI repair is about.
      - name: Hermetic Sandbox Tests (privileged container)
        run: |
          docker run --rm --privileged \
            -v "$PWD":/src -w /src \
            -e GOFLAGS="-mod=mod -buildvcs=false" \
            golang:1.26 \
            go test -count=1 -run 'Hermetic' -v ./internal/adapters/bunexec/

      - name: Run Real-Build E2E Tests
        run: |
          go test -timeout=20m -v \
            ./tests/integration/... \
            ./internal/adapters/bunexec/... \
            ./internal/adapters/sveltekitutils/...

  # Scoped macOS platform job: the release ships darwin amd64/arm64 binaries
  # (see .goreleaser.yaml / slsa-builder.yml) and internal/adapters/bunexec/
  # hermetic_other_test.go exists specifically to cover the non-Linux code
  # path, but CI otherwise only ever runs on ubuntu-latest. Running the FULL
  # suite on macOS runners is expensive and most packages have no
  # platform-dependent behavior, so this is scoped to only the packages that
  # actually contain a `//go:build` OS switch or `runtime.GOOS` check:
  # cmd/pokkum, internal/core, internal/adapters/provenance,
  # internal/adapters/bunexec, and supervisor/cmd/pokkum-init.
  macos-platform-tests:
    name: macOS Platform-Specific Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # see the note on the first setup-go step
          cache: true

      - name: Build Embedded PID-1 Binaries
        # pokkum-init and pokkum-static are gitignored, locally-built artifacts
        # consumed via go:embed. A fresh checkout has only .gitkeep, so without
        # this step the CLI builds fine but cannot produce a working image: the
        # provider errors at runtime when it looks for the missing blob. Every
        # job that builds or exercises the CLI needs them.
        run: make supervisor static-server

      - name: Verify CLI Builds Natively on macOS
        run: go build -o ./pokkum-test ./cmd/pokkum && rm -f ./pokkum-test

      - name: Run Platform-Sensitive Package Tests (-short)
        run: |
          go test -short -v \
            ./cmd/pokkum/... \
            ./internal/core/... \
            ./internal/adapters/provenance/... \
            ./internal/adapters/bunexec/... \
            ./supervisor/cmd/pokkum-init/...
