name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required for npm provenance / trusted publishing. Harmless while unused:
  # it grants the job the ability to mint an OIDC token, nothing more.
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from go.mod rather than pinning a floating minor.
          # setup-go v6+ sets GOTOOLCHAIN=local, so Go will NOT fetch a newer
          # toolchain to satisfy go.mod — it fails instead. `go-version: '1.26'`
          # resolved to 1.26.5 on the macOS runner against a go.mod requiring
          # >= 1.26.6 and broke the build; the resolved patch is per-platform, so
          # reasoning about what a floating minor "should" give is unreliable.
          # go-version-file keeps this correct automatically on every Go bump.
          go-version-file: 'go.mod'
          cache: true

      # Source-built and version-locked with ci.yml and the Makefile — see the
      # long comment in ci.yml for why a prebuilt binary broke here too (this
      # workflow carried the identical dead v1.62.2 pin).
      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      # -short, to mirror ci.yml's gate exactly. This job previously ran the
      # full suite while CI ran -short, so CI going green never implied the
      # release would pass — and it didn't: v1.0.2 and v1.0.3 both died here, in
      # a test CI had never executed, after the tag was already pushed and could
      # not be reused.
      #
      # Running MORE here is not a stronger gate, it is a differently-configured
      # one: this job has no Bun, no Docker and no fixture install, so the extra
      # tests it picks up are exactly those most likely to fail for environmental
      # reasons. By tag time the commit has already passed ci.yml's full matrix —
      # the -short gate, the real-Bun e2e job, the privileged hermetic container
      # and the macOS job. That is the coverage; this step is the last check that
      # the tagged tree still builds and passes it.
      - name: Run Unit & Integration Tests
        run: go test -short ./...

  release:
    name: GoReleaser & NPM Publish
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      # Base64 of dist/checksums.txt, consumed by the provenance job below as
      # SLSA subjects. Set only if GoReleaser got far enough to write it.
      hashes: ${{ steps.slsa-subjects.outputs.hashes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # see the note on the first setup-go step
          cache: true

      - name: Set up Node.js (for NPM Publisher)
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x. npm >= 11.5.1 is what trusted publishing
          # (OIDC) requires, so this is also the prerequisite for retiring
          # NPM_TOKEN later — see the note on the publish step.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Pin the cosign version: the action's default is a value it chooses, not
      # one this repo controls. cosign-installer defaults to v3.0.6, which has no
      # --use-signing-config flag, so scripts/cosign-sign-blob.sh — written and
      # tested against v3.1.3 — died with "unknown flag" partway through releasing
      # v1.0.4, after the binaries were already built.
      #
      # The installer must be v4 for that pin to work, which is not a cosmetic
      # bump. cosign-installer@v3 verifies a CUSTOM version by fetching a detached
      # cosign-linux-amd64.sig, and no cosign v3.x release publishes one — so
      # pinning any version under @v3 fails with curl exit 22 while leaving the
      # unpinned default working, because the default path skips that fetch. That
      # is how releasing v1.0.5 died. @v4 verifies v3.0.1+ through
      # .sigstore.json bundles instead, which v3.1.3 does publish (both the plain
      # and -kms bundles, checked). Same cosign-release input name.
      #
      # Pinned to a full version, not @v4: this action publishes a moving `v3`
      # tag but no `v4` — checked, refs/tags/v4 is 404 while v4.1.2 resolves — so
      # `@v4` would fail to resolve exactly like the README's old setup-pokkum@v1.
      # A moving major tag is a convention, not a guarantee.
      #
      # See mem:self_review_checklist row 48.
      - name: Set up Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      # SLSA subjects for the provenance job. dist/checksums.txt is GoReleaser's
      # own checksum listing, in `<sha256>  <filename>` form, covering exactly
      # the archives it just published — so the attestation names the files
      # people actually download.
      #
      # The previous slsa-builder.yml workflow did none of this. It compiled its
      # OWN copy of the binaries on every tag (raw `pokkum-linux-amd64` files,
      # stamped `main.version=v1.0.1` from git describe, against GoReleaser's
      # `1.0.1` from {{ .Version }}), so it attested bytes that were never
      # released — and its subject was `sha256sum checksums.txt`, making the
      # single subject its own unpublished checksums file, a chain that
      # dead-ends. It also ran on tag push independently of this workflow, which
      # is why four failed releases still left empty "Latest" releases behind and
      # repeatedly broke install.sh.
      - name: Compute SLSA Subjects From Published Artifacts
        id: slsa-subjects
        run: |
          test -s dist/checksums.txt || { echo "::error::dist/checksums.txt missing; GoReleaser did not publish"; exit 1; }
          echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

      # The npm side publishes FIVE packages, not one: goreleaser-npm-publisher
      # emits the optionalDependencies layout that esbuild and swc use — a tiny
      # launcher package whose index.js resolves a per-platform package, plus one
      # package per platform carrying the actual binary (~28MB packed each).
      #
      # This previously ran `--name @pokkum/cli --bin pokkum`. Neither flag
      # exists: `build --help` offers only --project/--builder/--clear/--prefix/
      # --description/--files/--keywords/--license/--verbose. The package name is
      # always prefix + binary name, so the published name could never have been
      # @pokkum/cli, and the release step failed on both v1.0.0 and v1.0.1.
      - name: Build NPM Packages
        run: |
          npx -y goreleaser-npm-publisher build --clear --prefix @pokkum --license Apache-2.0

          # The generated launcher is named @pokkum/pokkum (prefix + binary).
          # README.md documents @pokkum/cli and there is no flag for it, so patch
          # the manifest. Verified safe: index.js resolves the platform packages
          # by their own names and never refers to its own.
          npm pkg set name=@pokkum/cli --prefix dist/npm/pokkum

          # repository is required for `npm publish --provenance` and makes the
          # npm page link back here. Set on every package, launcher included.
          for d in dist/npm/*/; do
            npm pkg set repository.type=git \
              repository.url=git+https://github.com/${{ github.repository }}.git \
              --prefix "$d"
          done

      # Fail before publishing rather than after: publishing is irreversible
      # (npm forbids reusing a version), so a wrong name or a version that does
      # not match the tag must stop here. This is the check that would have made
      # the phantom-flag bug obvious on the first failed release instead of the
      # third.
      - name: Verify NPM Packages Before Publishing
        run: |
          tag='${{ github.ref_name }}'
          want_version="${tag#v}"
          name=$(npm pkg get name --prefix dist/npm/pokkum | tr -d '"')
          version=$(npm pkg get version --prefix dist/npm/pokkum | tr -d '"')

          [ "$name" = "@pokkum/cli" ] || { echo "::error::launcher package is named '$name', expected @pokkum/cli"; exit 1; }
          [ "$version" = "$want_version" ] || { echo "::error::launcher version '$version' does not match tag '$tag'"; exit 1; }

          count=$(find dist/npm -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          [ "$count" -eq 5 ] || { echo "::error::expected 5 packages (1 launcher + 4 platforms), found $count"; exit 1; }

          echo "publishing $name@$version plus $((count - 1)) platform packages"

      # Platform packages first: the launcher lists them in optionalDependencies,
      # so publishing the launcher first leaves a window where `npm i @pokkum/cli`
      # resolves nothing runnable.
      #
      # --access public is required on every one of them. A scoped package's first
      # publish defaults to restricted, and a free org cannot host restricted
      # packages, so omitting it fails.
      #
      # To retire NPM_TOKEN later: configure a trusted publisher for each package
      # (npmjs.com -> package -> Settings -> Trusted publishing), then add
      # `--provenance` below and delete the NODE_AUTH_TOKEN env. Everything else
      # it needs — npm 11.x, id-token: write, the repository field — is already
      # in place above.
      - name: Publish NPM Packages
        run: |
          # npm refuses to publish a prerelease version without an explicit
          # --tag, so a tag like v1.1.0-rc1 would fail here — after the binaries
          # were already released. Found by dry-running a publish with a
          # prerelease-shaped version. `latest` is npm's default and passing it
          # explicitly changes nothing for normal releases.
          version=$(npm pkg get version --prefix dist/npm/pokkum | tr -d '"')
          npm_tag=latest
          case "$version" in *-*) npm_tag=next ;; esac
          echo "publishing $version under npm dist-tag '$npm_tag'"

          for d in dist/npm/pokkum-*/; do
            echo "publishing $d"
            npm publish "$d" --access public --tag "$npm_tag"
          done
          npm publish dist/npm/pokkum --access public --tag "$npm_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Attaches SLSA L3 provenance to the release GoReleaser just published.
  #
  # `always() && hashes != ''` deliberately, rather than a plain needs-success:
  # the binaries are public the moment GoReleaser uploads them, so they deserve
  # provenance even if a later step in that job (the npm publish) failed. If
  # GoReleaser itself never got to writing checksums.txt, hashes is empty and
  # this is skipped — which is what stops a failed release from creating an empty
  # GitHub release, the behaviour that broke install.sh four times.
  provenance:
    name: Generate SLSA L3 Provenance
    needs: [release]
    if: ${{ always() && needs.release.outputs.hashes != '' }}
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true

  # Moves the floating major tag (v1) to the commit just released, so
  # `uses: CreativeBeastDesign/pokkum@v1` resolves.
  #
  # Until now only full versions existed — refs/tags/v1 was a 404 — and
  # README.md carried a note telling readers to pin a full version because
  # "@v1 cannot resolve". That is the opposite of what a Marketplace listing
  # leads people to type: virtually every published action documents @v<major>,
  # and the overwhelmingly common consumer mistake would have been a workflow
  # that fails to resolve the action at all.
  #
  # `needs: [release]` without `always()` on purpose, unlike the provenance job
  # below it. Provenance describes binaries that are already public and is
  # worth attaching even after a later step fails; a major tag is a
  # recommendation to users, and pointing it at a commit whose release did not
  # complete would send everyone typing @v1 to a version that was never
  # published. This repo has produced four such empty releases already.
  major-tag:
    name: Move Major Version Tag
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the Major Tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A prerelease must never move the major tag: v1.1.0-rc1 is exactly
          # what @v1 users must NOT be given. The npm publish step above makes
          # the same distinction, routing prereleases to the 'next' dist-tag.
          case "$RELEASE_TAG" in
            *-*)
              echo "$RELEASE_TAG is a prerelease; leaving the major tag where it is"
              exit 0
              ;;
          esac

          # Derive the major from the tag rather than hardcoding "v1", so this
          # step does not need editing at the v2 boundary — the release that
          # would be least well served by a stale assumption.
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::release tag '$RELEASE_TAG' is not vMAJOR.MINOR.PATCH; refusing to guess a major tag from it"
              exit 1
              ;;
          esac
          major="${RELEASE_TAG%%.*}"

          echo "moving $major to $RELEASE_TAG ($RELEASE_SHA)"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f -a "$major" -m "Release channel $major — currently $RELEASE_TAG" "$RELEASE_SHA"
          git push --force origin "refs/tags/$major"

          # Read it back from the remote rather than trusting the push's exit
          # status: the tag existing at the right commit is the actual
          # deliverable, and this job's whole purpose is that `uses: ...@v1`
          # resolves.
          remote_sha="$(git ls-remote origin "refs/tags/$major^{}" | cut -f1)"
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "::error::$major on origin points at '${remote_sha:-nothing}', expected $RELEASE_SHA"
            exit 1
          fi
          echo "$major now points at $RELEASE_TAG"
