name: 'Setup Pokkum'
description: 'Download, verify, and place the Pokkum CLI on PATH in GitHub Actions workflows'
author: 'CreativeBeastDesign'

inputs:
  version:
    description: 'Version of Pokkum CLI to install (e.g. v1.0.0 or latest)'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token for downloading Pokkum release artifacts'
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: 'Installed Pokkum CLI version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Download and Install Pokkum
      id: install
      shell: bash
      # Inputs arrive as environment variables and are read as quoted shell
      # variables. A `${{ }}` expression inside the script below would be
      # substituted into the script TEXT before bash parsed it, so a version
      # string carrying `$(...)` would execute on the runner — see the same
      # note in the root action.yml, and the shared Go guard
      # TestActionYMLNoExpressionInjection in cmd/pokkum/actionyml_test.go.
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Delegate to the repository's own install.sh rather than
        # reimplementing the download here. That script detects OS/arch and —
        # the part that matters — verifies the archive's SHA-256 against the
        # release's checksums.txt before installing, refusing on a mismatch.
        # This step previously created an empty directory, put it on PATH and
        # printed "installed successfully" without downloading anything, so
        # every workflow following the README got a CI job that reported
        # success and then failed at `pokkum: command not found`.
        INSTALL_DIR="${HOME}/.pokkum/bin"
        mkdir -p "$INSTALL_DIR"

        # install.sh resolves the newest release itself when POKKUM_VERSION is
        # unset, so "latest" means "do not pin" rather than a hardcoded tag.
        if [ "${INPUT_VERSION:-latest}" = "latest" ]; then
          POKKUM_INSTALL_DIR="$INSTALL_DIR" sh "${GITHUB_ACTION_PATH}/../../../install.sh"
        else
          POKKUM_VERSION="$INPUT_VERSION" POKKUM_INSTALL_DIR="$INSTALL_DIR" \
            sh "${GITHUB_ACTION_PATH}/../../../install.sh"
        fi

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

        # Report the version actually installed, read back from the binary, so
        # the output cannot claim a version that was never put on disk.
        installed="$("$INSTALL_DIR/pokkum" --version 2>/dev/null | head -n 1 || true)"
        [ -n "$installed" ] || { echo "::error::pokkum was not installed"; exit 1; }
        echo "version=${installed}" >> "$GITHUB_OUTPUT"
        echo "Installed: ${installed}"
