version: 2

project_name: pokkum

before:
  hooks:
    - go mod tidy
    - make supervisor

builds:
  - id: pokkum
    main: ./cmd/pokkum
    binary: pokkum
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

brews:
  - repository:
      owner: CreativeBeastDesign
      name: homebrew-pokkum
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/CreativeBeastDesign/pokkum"
    description: "Zero-dependency OCI container image compiler for SvelteKit applications"
    license: "Apache-2.0"
    install: |
      bin.install "pokkum"

checksum:
  name_template: "checksums.txt"

signs:
  - id: cosign
    signature: "${artifact}.sig"
    cmd: cosign
    # Key-based signing, not keyless: pokkum upgrade verifies against a
    # fixed embedded public key (DefaultReleasePublicKeyPEM in
    # cmd/pokkum/upgrade.go), which has no way to validate a Fulcio
    # short-lived cert chain or do a Rekor transparency-log lookup. The
    # corresponding private key must be set as the COSIGN_PRIVATE_KEY
    # secret in this repo's Actions settings (see .github/workflows/release.yml);
    # its public half must match DefaultReleasePublicKeyPEM exactly, or every
    # `pokkum upgrade` will report verified=false against real releases.
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:

  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
