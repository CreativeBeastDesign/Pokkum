version: 2

project_name: pokkum

before:
  hooks:
    - go mod tidy
    - make supervisor
    - make static-server

builds:
  - id: pokkum
    main: ./cmd/pokkum
    binary: pokkum
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      # .CommitDate, not .Date. .Date is the wall clock at build time, so it
      # made Pokkum's own release binaries unreproducible: two builds of the
      # same tag, seconds apart, produce different bytes. Verified rather than
      # inferred — two local builds 18 seconds apart differed.
      #
      # For a tool whose entire premise is bit-for-bit reproducible images,
      # that was the wrong default to inherit, and it had a concrete cost. When
      # the v1.1.0 npm publish failed and the release job was re-run, GoReleaser
      # rebuilt the binaries, could not re-upload them (422 already_exists), and
      # could not safely be allowed to either: the new bytes would not have
      # matched the sha256 values already baked into the Homebrew formula, nor
      # the digests the SLSA provenance attests. An unreproducible release is a
      # release whose pipeline cannot be resumed after a partial failure.
      #
      # .CommitDate is fixed by the tag being built, so a rerun now produces
      # byte-identical artifacts and the upload becomes idempotent in effect.
      - -X main.buildDate={{.CommitDate}}
    # Pin the binary's mtime to the commit as well, so the archives wrapping
    # them are reproducible too — otherwise the tarball bytes still move even
    # when the binary inside them does not.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Without this the tarball is still unreproducible even though the binary
    # inside it is: git does not preserve mtimes, so LICENSE and README.md
    # carry the CI runner's checkout time and land in the tar headers. Pinned
    # to the commit for the same reason builds[].mod_timestamp is.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - LICENSE
      - README.md

brews:
  - repository:
      owner: CreativeBeastDesign
      name: homebrew-pokkum
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    # Never point the tap at a prerelease. Without this, any hyphenated tag — a
    # release-candidate, or a throwaway tag pushed to exercise the pipeline —
    # rewrites the formula, and `brew install pokkum` starts serving it to
    # everyone. Set explicitly rather than trusting a default.
    skip_upload: auto
    homepage: "https://github.com/CreativeBeastDesign/pokkum"
    description: "Zero-dependency OCI container image compiler for SvelteKit applications"
    license: "Apache-2.0"
    install: |
      bin.install "pokkum"

# Hyphenated tags (v1.1.0-rc1, or a throwaway v0.0.1-test) are marked as GitHub
# prereleases, which keeps them out of the /releases/latest endpoint — the one
# install.sh resolves when no POKKUM_VERSION is given. Without this a test tag
# becomes "Latest" and every `curl … | sh` installs it.
release:
  prerelease: auto

checksum:
  name_template: "checksums.txt"

signs:
  - id: cosign
    signature: "${artifact}.sig"
    # Key-based signing, not keyless: pokkum upgrade verifies against a
    # fixed embedded public key (DefaultReleasePublicKeyPEM in
    # cmd/pokkum/upgrade.go), which has no way to validate a Fulcio
    # short-lived cert chain or do a Rekor transparency-log lookup. The
    # corresponding private key must be a cosign-native key pair (generate
    # with `cosign generate-key-pair` — cosign's --key loader rejects plain
    # OpenSSL-generated PEM keys, both SEC1 and PKCS8, confirmed against a
    # real cosign v3.1.3 binary) set as the COSIGN_PRIVATE_KEY secret, with
    # its password as COSIGN_PASSWORD, in this repo's Actions settings (see
    # .github/workflows/release.yml). The public half must match
    # DefaultReleasePublicKeyPEM exactly, or every `pokkum upgrade` will
    # report verified=false against real releases.
    #
    # cmd is a wrapper, not `cosign` directly: cosign v3.x's `sign-blob` no
    # longer supports writing a bare signature via --output-signature — only
    # --bundle (a JSON envelope including a public Rekor transparency-log
    # entry). scripts/cosign-sign-blob.sh calls the real cosign CLI with
    # --bundle, then extracts just messageSignature.signature into the plain
    # file goreleaser (and Pokkum's existing Go verifier) expects, so no
    # verification code has to change to understand the bundle format.
    cmd: ./scripts/cosign-sign-blob.sh
    args:
      - "${artifact}"
      - "${signature}"
    artifacts: checksum

snapshot:

  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
