name: 'Pokkum Build & Publish'
description: 'Fast, reproducible, hardened container builds for SvelteKit and Bun applications'
author: 'Pokkum Authors'
branding:
  icon: 'package'
  color: 'orange'

inputs:
  version:
    description: 'Pokkum CLI version to install (e.g. v1.0.1, latest)'
    required: false
    default: 'v1.0.1'

  project-dir:
    description: 'Path to the SvelteKit project directory'
    required: false
    default: '.'

  repo:
    description: 'Destination container repository (e.g. ghcr.io/acme/app). Passed to the CLI via the POKKUM_DOCKER_REPO environment variable — pokkum build has no --repo flag.'
    required: false

  tags:
    description: >-
      NOT YET SUPPORTED by the installed pokkum CLI: there is no --tag/--tags
      flag and no .pokkum.yaml field for custom tags, so every published
      image is tagged "latest" regardless of this input. Setting it to
      anything other than "latest" emits a build warning. Kept for
      forward/backward compatibility; use the digest/ref outputs of this
      action for an immutable reference in the meantime.
    required: false
    default: 'latest'

  platforms:
    description: 'Comma-separated target platforms (e.g. linux/amd64,linux/arm64)'
    required: false
    default: 'linux/amd64'

  output:
    description: 'Output mode: push (default, publish to repo), local (load into the local Docker daemon), or tarball (export an OCI archive; see tarball-path)'
    required: false
    default: 'push'

  tarball-path:
    description: "Archive path to write when output is 'tarball'. Ignored otherwise."
    required: false
    default: 'image.tar'

  dry-run:
    description: 'Dry run mode (show what would be built/pushed without side effects)'
    required: false
    default: 'false'

  print-manifest:
    description: 'Print generated Kubernetes manifest after build'
    required: false
    default: 'false'

  log-level:
    description: 'Logging level: debug, info, warn, error'
    required: false
    default: 'info'

outputs:
  digest:
    description: 'The output image manifest digest (sha256:...)'
    value: ${{ steps.build.outputs.digest }}
  ref:
    description: 'The immutable image reference (repo@sha256:...)'
    value: ${{ steps.build.outputs.ref }}

runs:
  using: 'composite'
  steps:
    - name: Set up Bun Environment
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Pokkum CLI
      shell: bash
      run: |
        if command -v pokkum &> /dev/null; then
          echo "pokkum CLI already installed: $(pokkum version 2>/dev/null || true)"
          exit 0
        fi

        VERSION="${{ inputs.version }}"
        OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
        ARCH="${{ runner.arch }}"
        if [ "$ARCH" = "X64" ]; then ARCH="amd64"; fi
        if [ "$ARCH" = "ARM64" ]; then ARCH="arm64"; fi

        INSTALL_DIR="$HOME/.pokkum/bin"
        mkdir -p "$INSTALL_DIR"

        ASSET_URL="https://github.com/CreativeBeastDesign/pokkum/releases/download/${VERSION}/pokkum_${OS}_${ARCH}.tar.gz"
        echo "Attempting to download prebuilt binary from ${ASSET_URL}..."

        if curl -sSL -f "$ASSET_URL" | tar -xz -C "$INSTALL_DIR" pokkum 2>/dev/null; then
          echo "Prebuilt binary installed successfully."
        else
          echo "Prebuilt binary download failed or unreleased version requested. Falling back to 'go install'..."
          go install "github.com/CreativeBeastDesign/pokkum/cmd/pokkum@${VERSION}"
          GO_BIN=$(go env GOPATH)/bin
          cp "${GO_BIN}/pokkum" "$INSTALL_DIR/pokkum" || true
        fi

        echo "$INSTALL_DIR" >> $GITHUB_PATH
        chmod +x "$INSTALL_DIR/pokkum"

    - name: Execute Pokkum Build
      id: build
      shell: bash
      run: |
        ARGS=()

        # repo: pokkum build has no --repo flag. The destination repository
        # is resolved from the POKKUM_DOCKER_REPO environment variable (or
        # .pokkum.yaml's docker.repo) — never from a CLI argument.
        export POKKUM_DOCKER_REPO="${{ inputs.repo }}"

        # tags: pokkum build has no --tag/--tags flag and .pokkum.yaml has no
        # tags field either — every publish is tagged "latest" (the CLI's own
        # DefaultTag) regardless of what's requested here. Warn instead of
        # silently dropping a value the caller asked for.
        if [ -n "${{ inputs.tags }}" ] && [ "${{ inputs.tags }}" != "latest" ]; then
          echo "::warning::pokkum-action: the 'tags' input (\"${{ inputs.tags }}\") was set, but the installed pokkum CLI has no mechanism to apply custom image tags. The published image will be tagged 'latest' only. Use this action's digest/ref outputs for an immutable reference instead."
        fi

        if [ -n "${{ inputs.platforms }}" ]; then
          ARGS+=("--platform" "${{ inputs.platforms }}")
        fi

        # output: push/local/tarball is a build *mode*, controlled by the
        # --local / --tarball flags — NOT the global --output flag, which is
        # only the text/json serialization format for other subcommands and
        # is not read by `pokkum build` at all.
        case "${{ inputs.output }}" in
          local)
            ARGS+=("--local")
            ;;
          tarball)
            ARGS+=("--tarball" "${{ inputs.tarball-path }}")
            ;;
          push|"")
            : # default mode; no flag needed
            ;;
          *)
            echo "::error::pokkum-action: invalid 'output' value \"${{ inputs.output }}\" — must be push, local, or tarball."
            exit 1
            ;;
        esac

        if [ "${{ inputs.dry-run }}" = "true" ]; then
          ARGS+=("--dry-run")
        fi

        if [ "${{ inputs.print-manifest }}" = "true" ]; then
          ARGS+=("--print-manifest")
        fi

        if [ -n "${{ inputs.log-level }}" ]; then
          ARGS+=("--log-level" "${{ inputs.log-level }}")
        fi

        echo "Running: pokkum build ${ARGS[*]} ${{ inputs.project-dir }}"

        # --log-format json is fixed (not user-configurable): it's how this
        # step parses the final "published" log line for digest/ref below.
        # It is unrelated to the --output (text/json) global flag.
        BUILD_OUT=$(pokkum build "${ARGS[@]}" "${{ inputs.project-dir }}" --log-format json 2>&1)
        echo "$BUILD_OUT"

        # Parse digest and ref outputs
        DIGEST=$(echo "$BUILD_OUT" | grep -o '"digest":"[^"]*' | head -n 1 | cut -d'"' -f4 || true)
        REF=$(echo "$BUILD_OUT" | grep -o '"ref":"[^"]*' | head -n 1 | cut -d'"' -f4 || true)

        echo "digest=$DIGEST" >> $GITHUB_OUTPUT
        echo "ref=$REF" >> $GITHUB_OUTPUT
