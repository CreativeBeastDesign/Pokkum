    status: shipped
    kind: infra
    tier: foundation
    summary: "Fuzz targets now exercise DSSE PAE encoding, ignore-pattern matching, Cosign payloads, asset-overlay merge logic, Bun SHASUMS parsing, scanner version comparison, and the static file server — none of these existed before."
