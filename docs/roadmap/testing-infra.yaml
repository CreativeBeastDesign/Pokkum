  - id: verify-suite-scope-gaps
    title: "make verify's five steps don't cover supervisor/ or the integration/golden test suites"
    stage: backlog
    status: open
    kind: infra
    tier: polish
    summary: "supervisor/ (pokkum-init, pokkum-static) shares the root go.mod but needs its own explicit go build/go test, and tests/integration's golden-manifest and runtime-smoke suites also sit outside make verify's canonical five steps."
    problem: |
      `make verify`'s five steps run `go test ./internal/...` plus a `cmd/pokkum` build only.
      `supervisor/...` is a separate build target entirely, and a diff that only touches
      `supervisor/` can pass every one of the five steps while `go build ./supervisor/...` or
      `go test ./supervisor/...` are actually broken. Separately, `tests/integration/golden_test.go`
      (OCI manifest/config/index goldens) and the runtime-smoke suites are also outside `make
      verify`'s scope and must be run explicitly for any change touching layer compression, tar
      construction, OCI assembly, or a produced image's boot behavior. Both facts are currently
      documented only as a reminder in `CLAUDE.md` and Serena's `mem:state`, not enforced by
      tooling — nothing fails a CI run or a `make verify` invocation that skips them.
    options:
      - title: "Fold supervisor/ into a sixth make verify step"
        description: "Add go build ./supervisor/... && go test ./supervisor/... as a mandatory sixth step, always run rather than conditionally on the diff touching supervisor/."
        tradeoffs: "Simple and impossible to forget, but adds supervisor's build/test time to every make verify run even when nothing under supervisor/ changed."
      - title: "Path-based CI trigger"
        description: "Add a CI job that runs only when the diff touches supervisor/ or tests/integration/, keeping the fast local make verify loop unchanged."
        tradeoffs: "Keeps the common case fast, but a local make verify still can't be trusted alone for a supervisor-touching change — a contributor without CI access could still miss it."
    recommendation: "Fold supervisor/ into make verify unconditionally, since its build/test time is small relative to the rest of the suite and 'always run' is the only version of this that can't be silently skipped; keep tests/integration's heavier suites as an explicit, documented extra step given their real Docker/network cost."

  - id: cli-workflow-tests
    title: "Multi-command CLI workflow tests"
    stage: v1.1
    status: shipped
    kind: infra
    tier: foundation
    summary: "Run the real binary through command sequences in one project directory, covering whether commands work together rather than only in isolation."
    problem: |
      Every test in `tests/integration` drove Pokkum through its Go API. That is the right level
      for most things, but it left a whole class uncovered: whether the commands work *with each
      other*. `pokkum init` shipped writing an `sbom.attach` value `pokkum build` refused, so the
      first two commands a new user runs were incompatible, and nothing caught it — no test ever
      ran one command's output into the next. It was found by a maintainer typing the two
      commands, after six waves of hardening had passed over the codebase.

      Unit tests cannot close that gap by construction: they assert the pieces, and the failure
      lived in the seam between two individually-correct pieces.
    decision: |
      Shipped 2026-08-19. `tests/integration/cli_workflow_test.go` builds the CLI once per run
      and executes declared step sequences against one project directory, so each command sees
      what the previous one left behind. Five workflows: init→validate→build (the reported bug),
      init idempotence over a hand-edited config, a deliberately corrupted config failing with
      the offending field named, `--output=json` parsing at every step, and the local-profile
      round trip (profiles merge through different code than the base config).

      The load-bearing assertion is the *absence* list, not the exit code. This project has no
      registry configured, so `build` fails either way — what distinguishes "build rejected
      init's own output" from "build wants a repo" is which error appears, so each workflow
      names the config-rejection shapes that must not be present.

      Fast by default: nothing needs Docker, Bun, a registry or the network, because a build that
      stops at request validation still exercises the whole config load-and-validate path, which
      is where the bug lived. The five workflows run in about three seconds. Steps needing a real
      toolchain are gated on -short.
    impl:
      - tests/integration/cli_workflow_test.go
    related: ["init-generates-invalid-config"]

