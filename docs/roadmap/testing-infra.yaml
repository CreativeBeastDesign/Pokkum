  - id: runtime-boot-smoke-tests
    title: "Real Docker boot smoke tests"
    status: shipped
    kind: infra
    tier: foundation
    summary: "The first tests in this repo to actually boot a produced image and poll it, for both the default layered/Bun strategy and --runtime=node, instead of only proving the packaged bytes are right and stable."
    impl:
      - tests/integration/runtime_smoke_test.go
      - tests/integration/runtime_smoke_node_test.go
    limitations:
      - "Every existing layer-structure/determinism/golden-manifest test had proven the packaged bytes were correct and stable, never that the result actually runs — that gap is exactly what let every layered image ship without a working entrypoint for this codebase's entire prior history (see Lessons.md's 2026-08-18 entry on the missing /app/server/index.js)."
      - "Gated on -short/bun/docker/network, each skipping cleanly rather than failing when unavailable."
      - "--strategy=static has its own separate fixture-driven boot test rather than this harness — see [Real @sveltejs/adapter-static test fixture](item:static-strategy-real-fixture)."
    evidence:
      commits: ["fc53968", "e918c52"]

