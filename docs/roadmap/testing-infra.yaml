    evidence:
      commits: ["e6e4746"]

  - id: race-detector-and-coverage-floor
    title: "Race detector + enforced coverage floor"
    status: shipped
    kind: infra
    tier: foundation
    summary: "go test -race now runs in CI over the packages where concurrency actually lives, and coverage is measured and enforced at a 73% floor as a ratchet off the real baseline, not an aspirational number."
    impl:
      - scripts/check-coverage.sh
      - Makefile
    limitations:
      - "-race is deliberately scoped to registry/core/packager/supervisor rather than the full ./... tree, to keep the added CI cost (~6s) proportionate to where concurrency actually lives."
      - "Landed in the same change as fixing a structural CI blind spot: CI never installed Bun before this, so every genuinely-real-build e2e test silently skipped and CI's 'e2e' job was entirely mock-compiler. A separate e2e-real-build job now installs Bun, kept apart so the fast hermetic gate stays fast."
    evidence:
      commits: ["e6e4746"]

  - id: cli-docs-invariant-tests
    title: "CLI/docs drift as a mechanical test failure"
    status: shipped
    kind: infra
    tier: foundation
    summary: "Five new tests check Vocabulary.md and action.yml against the CLI's real flag/env-var surface in both directions, in the spirit of internal/architecture_test.go, and found three genuine drifts on their first run."
    impl:
      - cmd/pokkum/flags_docs_test.go
      - cmd/pokkum/envvar_docs_test.go
      - cmd/pokkum/actionyml_test.go
    limitations:
      - "Found and fixed on first run: POKKUM_LOG_LEVEL (read by both PID-1 binaries) was undocumented, --write-config on adopt was undocumented, and Vocabulary.md claimed a verify --rebuild flag that does not exist (the real behavior is rebuild-by-default with --no-rebuild to opt out)."
      - "The same commit closed six merged-but-unvalidated .pokkum.yaml config fields, including profiles.<name>.output, which nothing had validated before."
    evidence:
      commits: ["548c0e1"]

  - id: embedded-blob-freshness-guard
    title: "Embedded PID-1 binary freshness guard"
    status: shipped
    kind: infra
    tier: foundation
    summary: "make check-embedded-blobs rebuilds pokkum-init and pokkum-static fresh from source with the exact Makefile flags and byte-compares them against what is actually embedded, catching local staleness a from-scratch CI build structurally cannot hit."
    impl:
      - internal/adapters/staticserver/blob_freshness_test.go
      - Makefile
    limitations:
      - "Must run with -count=1: go test's result cache cannot see through an exec'd go build into another package's source, so a stale cached result would otherwise report clean."
      - "Deliberately not added to the PR-gate CI job — CI always rebuilds both blobs from the checked-out commit before any test runs, so this specific staleness is structurally impossible there. It exists for the local working-tree hazard, which is exactly where it was first found live (concurrent commits had moved HEAD past the last local rebuild)."
    evidence:
      commits: ["a86baa3"]

  - id: fixture-isolation
    title: "Real-build tests copy their fixture into t.TempDir() first"
    status: shipped
    kind: infra
    tier: foundation
    summary: "Every mutating real-build test now copies its checked-in fixture into a fresh t.TempDir() before building, closing an order-dependence that had already caused three separate incidents, proven at -count=3 -shuffle=on."
    impl:
      - tests/integration/harness_test.go
      - internal/adapters/bunexec/integration_test.go
    limitations:
      - "Stale-claim correction: overnight-findings.md's finding 11 recorded this as 'not fixed — deliberately,' calling it a broader test-hygiene change than belonged at the end of that queue. It was, in fact, done the same day. Serena's mem:state, as read at the start of this migration, still described it as 'known fragility, deliberately not fixed yet' — also stale. Commit 20ba1ec generalized the t.TempDir()-copy pattern tests/integration/runtime_smoke_test.go had already established to all five affected real-build tests, moved the shared helper into harness_test.go, and proved order-independence empirically rather than asserting it."
      - "Read-only tests were deliberately left untouched, but only after confirming — by reading the actual production code, not assuming — that nothing in their dependency chain (sbom.Generator, packager.Packager, mockCompiler's StrategyExe branch) ever calls os.WriteFile/os.MkdirAll against ProjectDir."
      - "bunexec cannot import the tests/integration helper (a separate package, and adapter-to-adapter imports are architecturally forbidden), so it carries a small, deliberate duplicate that — unlike the shared helper — does not skip .svelte-kit, since that test's precondition is a pre-prepared fixture."
    evidence:
      commits: ["ac5dc89", "20ba1ec"]
      findings: [11]

  - id: static-strategy-real-fixture
    title: "Real @sveltejs/adapter-static test fixture replaces a fictional mock"
    status: shipped
    kind: infra
    tier: foundation
    summary: "A genuine, scaffolded-and-built @sveltejs/adapter-static project replaced a synthetic mock that had been fabricating a flat prerendered/index.html, immediately exposing four bugs the mock's own wrong assumption had been hiding."
    impl:
      - testdata/fixtures/sveltekit-static
      - tests/integration/static_e2e_test.go
    limitations:
      - "This is the sharpest instance of a recurring lesson in this codebase: a mock encoding the same wrong assumption as the code it tests can never detect the mismatch. TestFixtureDrivenE2E_Static had passed throughout, because both the mock and the production code shared the same incorrect belief that prerendered output is a flat tree — see [--strategy=static](item:strategy-static) in build-packaging.yaml for the bugs this found (findings 2, 3, 4, 6, 7)."
    evidence:
      commits: ["0ef9dd0", "1c33509"]
      findings: [4, 6, 7]

  # ---------------------------------------------------------------------
  # Open
