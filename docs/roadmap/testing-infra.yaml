      - internal/adapters/ignoreutils/matcher_fuzz_test.go
      - internal/adapters/cosign/payload_fuzz_test.go
      - internal/adapters/assetoverlay/assetoverlay_fuzz_test.go
      - internal/adapters/bunruntime/shasums_fuzz_test.go
      - internal/adapters/scanner/version_fuzz_test.go
