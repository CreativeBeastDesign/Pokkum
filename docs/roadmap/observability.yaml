area: "Observability"
items:
  - id: otel-sdk-bootstrap
    title: "OpenTelemetry SDK bootstrap (--telemetry)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Starts a real OTel NodeSDK + OTLP trace exporter before the app runs, via a compile-entrypoint wrapper for `--strategy=exe` and a packaged `bun --preload` file for `--strategy=layered`."
    problem: |
      Two mechanisms depending on strategy, both wired through `pipeline.go` -> `bunexec.Compiler.Prepare`
      -> the packager: a compile-entrypoint wrapper (`PrepareVirtualTelemetryEntry`) for `exe`, and a
      packaged `bun --preload`'d bootstrap file (`PrepareLayeredTelemetryBootstrap`) for `layered`.
      Verified end-to-end for both strategies against a real OTLP export reaching a fake collector,
      not just unit-tested.
    flags: ["--telemetry", "--no-telemetry", "--otel-export", "--telemetry-env", "--trace-sample-rate", "--metrics-only"]
    impl:
      - internal/adapters/sveltekitutils/telemetry.go
      - internal/core/pipeline.go
    limitations:
      - "No automatic HTTP/framework instrumentation: `@opentelemetry/auto-instrumentations-node`'s module-patching approach does not take effect under Bun's runtime. Real spans require the documented `hooks.server.ts` snippet, never auto-injected."
      - "`--metrics-only` is non-functional: combining an OTLP metrics exporter with the SDK crashes once compiled via `bun build --compile` — a real Bun bundler bug, not a Pokkum bug. It warns at runtime rather than silently doing nothing."
      - "Rejected outright for `--runtime=node` — the layered bootstrap's `bun --preload` mechanism is Bun-specific with no Node equivalent yet."
    related: ["metrics-command-shape"]

  - id: otel-collector-sidecar
    title: "Kubernetes OTel Collector sidecar injection (--with-otel-sidecar)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Injects an OpenTelemetry Collector sidecar spec (4317 gRPC, 4318 HTTP, 8889 metrics) directly into generated Kubernetes workload manifests."
    flags: ["--with-otel-sidecar"]
    impl:
      - cmd/pokkum/build.go
      - internal/adapters/k8s/resolver.go

  - id: metrics-command-shape
    title: "Reconsider pokkum metrics' shape"
    stage: v1.2
    status: shipped
    kind: dx
    tier: foundation
    summary: "Decided by removal: pokkum metrics claimed to run a metrics server, never listened on anything, and is deleted, since it neither runs a server nor exposes anything the way its own text claims."
    problem: |
      `pokkum metrics` reads like a client-side scraper rather than a server the image exposes, and
      verifying it against the code shows the gap is more than an ergonomics complaint: `runMetrics`
      (`cmd/pokkum/metrics.go`) parses `--metrics-port`, prints "Metrics pipeline ready. Press Ctrl+C
      to stop.", and then returns — there is no `http.ListenAndServe`, `net.Listen`, or any blocking
      call anywhere in the command. It reports `Status: "active"` and `UptimeSeconds: 0` in its JSON
      output unconditionally. Nothing is actually listening on the port the command names. Separately,
      the supervisor-level `/metrics` endpoint this command's description implies (`pokkum-init`
      registers only `/healthz` and `/readyz`) does not exist either — neither Bun runtime metrics
      (event-loop lag, heap) nor cgroup limits are exported from PID 1. The app-side OTel metrics
      pipeline itself (see [OpenTelemetry SDK bootstrap](item:otel-sdk-bootstrap)) is real; this
      command's own claim about what it does is not.
    options:
      - title: "Fold into build flags, document the port contract, remove the standalone command"
        description: "Drop the pretense of a running server and document `--metrics-port`/the OTel metrics export contract as build-time flags instead, matching what the app-side pipeline actually does."
        tradeoffs: "Cheapest option and the one the roadmap's scope-discipline pass already leans toward, but removes a command name users may already reference in scripts."
      - title: "Implement a real supervisor-side /metrics listener"
        description: "Give `pokkum-init` an actual `/metrics` HTTP handler and make `pokkum metrics` a thin client against it, so the command's text stops overclaiming."
        tradeoffs: "Closes the gap honestly, but is real new supervisor surface (Bun runtime metrics, cgroup limits) for a command currently scoped as a CLI nicety, not a monitoring server."
    recommendation: "Option 1 (fold in and remove). Telemetry already works through the build path, so the command added no capability \u2014 only a promise. Removing a flag before publication is free; removing it after is a breaking change."
    decision: |
      Taken 2026-08-19: fold in and remove. `pokkum metrics` and its `--metrics-port` flag are
      deleted, along with the now-unused `ports.MetricsOutput`. Vocabulary.md's phantom section for
      the command is gone \u2014 it had been a duplicate "9" alongside `pokkum explain`, so removing it
      also repaired the section numbering. The 4317/4318/8889 contract is documented where those
      ports are actually opened: on the `--with-otel-sidecar` flag, with the point made explicit
      that they belong to the injected `otel/opentelemetry-collector-contrib` container and that no
      Pokkum binary ever binds them. Option 2 is kept as a separate backlog item rather than
      discarded \u2014 see [Supervisor-side /metrics endpoint](item:supervisor-metrics-endpoint).
    impl:
      - cmd/pokkum/main.go
      - internal/adapters/k8s/resolver.go
    related: ["otel-sdk-bootstrap", "supervisor-metrics-endpoint"]

  - id: supervisor-metrics-endpoint
    title: "Supervisor-side /metrics endpoint"
    stage: backlog
    status: open
    kind: feature
    tier: polish
    summary: "Give pokkum-init a real /metrics HTTP handler exporting Bun runtime and cgroup metrics, which is the capability the removed pokkum metrics command only claimed to provide."
    problem: |
      `pokkum-init` registers `/healthz` and `/readyz` only. Nothing exports Bun runtime metrics
      (event-loop lag, heap) or the container's cgroup limits from PID 1, so an operator wanting
      those has no Pokkum-provided source for them \u2014 the app-side OTel pipeline covers
      application spans, not the runtime the app sits on. This is the honest version of what
      [Reconsider pokkum metrics' shape](item:metrics-command-shape) was asked to decide; that item
      was closed by deleting the overclaiming command, which removed the false promise without
      adding the capability. Kept as a distinct item so the capability question stays visible
      instead of disappearing with the command that misrepresented it.
    impl:
      - supervisor/cmd/pokkum-init/main.go
    related: ["metrics-command-shape", "otel-collector-sidecar"]

  - id: app-readiness-endpoint
    title: "App-controlled readiness (/readyz follows the app's own endpoint)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "pokkum-init can poll an endpoint the app owns (src/routes/api/ready, auto-detected) so /readyz reflects whether the app can serve, not only whether its port is open."
    problem: |
      `/readyz` meant "the app port accepts a TCP connection", which is true the moment the server
      listens: before migrations finish, before caches are warm, while the database is
      unreachable. An app had no way to tell the load balancer "do not send me traffic yet".
      `/healthz` was the wrong place for it: a dependency outage that failed liveness would
      restart every pod at once, in a loop, and restarting fixes nothing.
    decision: |
      Taken 2026-10-25: the supervisor asks the app (pull); the app does not push state to the
      supervisor. A pushed "not ready" cannot come from an app that has hung, and a mutating
      supervisor endpoint would need its own access control. With `POKKUM_READY_PATH` set,
      pokkum-init's existing readiness loop sends one GET per tick (800ms limit, redirects not
      followed) and `/readyz` is 200 only on 2xx. Probe traffic still never reaches the app,
      because `/readyz` answers from the cached result. The build auto-detects
      `src/routes/api/ready/+server.(ts|js)` (route groups ignored, a literal `paths.base`
      prefixed), and `image.ready_path` / `--ready-path` override it (`off` disables it). With no
      route and nothing configured, no variable is written and the image is byte-identical to
      before. `/healthz` is unchanged and stays process-only. Verified end to end against a real
      image whose endpoint answered 503 while the app served pages.
    flags: ["--ready-path"]
    impl:
      - supervisor/cmd/pokkum-init/probe.go
      - supervisor/cmd/pokkum-init/config.go
      - internal/adapters/sveltekitutils/readyroute.go
      - cmd/pokkum/build.go
    limitations:
      - "A `paths.base` that is not a string literal (e.g. read from `process.env`) cannot be evaluated at build time. Auto-detection then steps aside with a warning, and `image.ready_path` must give the full path."
      - "Static images (pokkum-static) have no application to ask, so they never use a readiness path."
    related: ["supervisor-metrics-endpoint"]
