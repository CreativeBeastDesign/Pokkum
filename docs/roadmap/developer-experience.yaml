  - id: stable-go-library-api
    title: "Stable Go library API"
    stage: backlog
    status: open
    kind: dx
    tier: foundation
    summary: "Expose Pokkum's build pipeline as a stable, embeddable Go library API, for a future Skaffold/Tilt-style integration."

  - id: hooks-system
    title: "Pre/post-build shell hooks"
    stage: backlog
    status: open
    kind: dx
    tier: foundation
    summary: "Deferred: pre/post-build shell hooks would defuse plugin-system demand cheaply, but add new maintenance surface for something CI pipelines already provide natively."
    problem: |
      `pokkum hook pre-build`/`pokkum hook post-build` (database migrations, asset compilation, smoke
      tests against the new image) scores well on DX but is real, ongoing cross-platform shell-exec
      maintenance for a capability that is not differentiated — every CI pipeline already runs
      pre/post steps around a build natively. Deferred rather than built; revisit if repeatedly
      requested rather than build speculatively.

  - id: plugin-system
    title: "npm-distributed plugin system"
    status: wont-do
    kind: dx
    tier: non-goal
    summary: "Will not be built: an npm-based extension model would undercut the exact supply-chain hardening story Pokkum exists to provide."
    decision: |
      The DX case for a `pokkum-plugin-*` ecosystem (community plugins for custom adapters and
      preprocessors, an esbuild/Vite-style marketplace) is real, but an npm-based extension model
      directly undercuts Pokkum's own hardening story — this is a supply-chain-security tool that
      would be inviting the exact npm supply-chain risk its own `secretguard`, hermetic-build, and
      CVE-gate features exist to mitigate. Stated as a decision, not a silent omission.

  - id: init-generates-invalid-config
    title: "pokkum init wrote a config pokkum build refused"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "Every generated .pokkum.yaml carried an invalid sbom.attach value, so the first two commands a new user runs did not work together."
    problem: |
      `GenerateDefault` wrote `sbom.attach: attestation` into every generated `.pokkum.yaml`.
      `attestation` was never one of that mode's values (`referrer`, `tag`, `auto`) — a
      plausible word, since an SBOM genuinely is attached as an attestation, which is why it
      survived review. `pokkum build` then refused to start with `invalid sbom attach mode`.

      Both halves were individually correct and tested: `GenerateDefault` had tests asserting
      its fields, `ParseSBOMAttachMode` had tests rejecting bad input, and nothing exercised
      the join. Worse, `cmd/pokkum/config.go`'s `validateConfigFields` already checks
      `sbomAttach` — the binary shipped a validator that rejects exactly this, and `init`
      never ran it on its own output.

      Two further defects surfaced immediately once a regression test covered the whole matrix
      of choices `init` offers: the prompt offered `chainguard-static`, an unimplemented
      roadmap item rather than a preset, while omitting the real `distroless-node`; and the
      prompts accepted any typed value verbatim, so a typo reached disk and failed much later.

      Found by running the tool on a real project, not by any test or review pass.
    decision: |
      Shipped 2026-08-19. Generated enum values now come from the port constants
      (`ports.DefaultSBOMAttachMode`, `ports.SBOMFormatSPDXJSON`), making this class of typo a
      compile error. `init` validates what it is about to write through the same
      `validateConfigFields` that backs `pokkum config validate`, and refuses with an explicit
      "this is a bug in pokkum, not your project" — a generated config is Pokkum's own output,
      so an invalid value there is never the user's fault. A new `promptChoice` constrains each
      enum answer to a fixed set and re-asks rather than accepting, and the base-preset list is
      now exactly the presets that exist.
    flags: ["--sbom-attach", "--base"]
    impl:
      - internal/adapters/config/config.go
      - cmd/pokkum/init.go
      - cmd/pokkum/config.go
    related: ["chainguard-static-preset", "config-management"]

  - id: init-recommends-a-failing-command
    title: "pokkum init recommended a command it had guaranteed could not work"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "init always ended with \"you can now run pokkum build\", which fails immediately for the local-only setup its own first prompt invites."
    problem: |
      `pokkum init`'s first prompt offers the registry as "empty for local only". Accepting that
      leaves no destination repository, and `pokkum build` defaults to push mode, so it refused to
      start:

        validation failed: destination repository is required in push mode

      init nevertheless closed with the constant `You can now run \`pokkum build\``. It was
      recommending a command it had just guaranteed could not work, for the option it had just
      offered as reasonable.

      Reported from a real first run immediately after the generated-config fix, and the same
      class one level up: advice is output too, and output the next command rejects is a defect.
      `pokkum build --local` was the command that worked all along — it clears configuration
      entirely and reaches genuine preflight (a missing `@sveltejs/adapter-node`).
    decision: |
      Shipped 2026-08-19. The closing line is derived from the config init actually wrote, or
      loaded when one already exists, so re-running init on a configured project gives advice
      matching that project rather than the defaults. With no registry it recommends
      `pokkum build --local` and explains that a registry is what plain `pokkum build` needs; with
      one configured it recommends `pokkum build` as before. The recommendation is also exposed as
      `next_command` in the JSON envelope so scripted callers get the same answer as humans.

      Guarded by a workflow test that reads the recommendation out of init's own JSON output and
      runs it, rather than hardcoding a command — so it follows the advice wherever it goes. It
      asserts not that the command succeeds (impossible without a JS toolchain) but that it never
      fails for a configuration or usage reason.
    impl:
      - cmd/pokkum/init.go
      - tests/integration/cli_workflow_test.go
    related: ["init-generates-invalid-config", "cli-workflow-tests"]

  - id: injection-preconditions-undocumented
    title: "Zero-config adapter injection declined silently, with undocumented preconditions"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "Injection is advertised as automatic but engages only under two conditions, and when it declined it said nothing, so the failure read as the feature being broken."
    problem: |
      Zero-config adapter injection (Option B) is real, enabled by default, and works: given a
      project whose `package.json` build script is exactly `vite build`, `pokkum build` writes
      `.pokkum/vite.config.ts` and uses it, without touching user-authored files. Verified
      empirically.

      It engages only when two conditions hold, and neither was documented:

      1. The adapter **package** must be installed. Injection configures an adapter; it cannot
         install one. Preflight fails first if it is neither configured nor in `package.json`.
      2. `package.json`'s `build` script must be exactly `vite build`. Injection replaces the
         build invocation, so it declines when doing so would silently skip anything else the
         script does — env setup, codegen, a task runner. That guard is correct.

      What was wrong is that declining was **silent**. The operator got Option C's "fix it in
      vite.config.ts" with no hint that Pokkum would have done it for them under a condition they
      could meet, and no way to distinguish "Pokkum cannot do this" from "Pokkum would not do this
      here". Meanwhile `docs/Features.md`, `Vocabulary.md`'s `--inject` row and `pokkum adopt`'s
      own help all advertised injection with no preconditions at all — `adopt` went further and
      said "no on-disk edit is actually required", which for a project failing either condition
      is false.

      Found by running the tool on a real project, immediately after two other defects in the same
      three-command sequence.
    decision: |
      Shipped 2026-08-19. A declined injection now names the precondition that failed and quotes
      the offending build script, while still wrapping the adapter sentinel so `errors.Is`
      consumers are unaffected. The preflight error additionally explains that injection rewrites
      configuration but cannot install a package, which is the confusion that made a correct
      message read as a bug.

      Documentation corrected in all four places to state both preconditions rather than implying
      injection is unconditional. `adopt`'s help now separates the configuration swap (which
      injection does handle) from the package requirement (which it cannot).

      Two rounds of correction were needed here, worth recording: the first fix stated only the
      package precondition, and a second empirical run — adapter installed, `vite.config.ts`
      present — showed injection still declining, which is what surfaced the build-script guard.
      Reasoning from the code's comments alone produced a confident wrong answer twice; only
      running it with each precondition satisfied in turn established what actually holds.
    flags: ["--inject", "--no-inject", "--write-config"]
    impl:
      - internal/adapters/bunexec/compiler.go
      - cmd/pokkum/adopt.go
    related: ["init-recommends-a-failing-command", "adopt-codemod"]

  - id: console-log-rendering
    title: "Human-readable console output for build logs"
    stage: v1.1
    status: shipped
    kind: dx
    tier: polish
    summary: "Build progress rendered with level glyphs and aligned attribute blocks on a terminal, while piped and CI output stays byte-identical logfmt."
    problem: |
      Every build line was raw logfmt: a full RFC3339 timestamp with a timezone offset, then
      `level=`, then `msg=` in quotes, then six `key=value` pairs on one 200-column line. The
      timestamp alone consumed about a third of the width, pushing the message past where the eye
      lands, and a record like `build starting` — projectDir, repo, platforms, output, dryRun,
      printManifest — was a wall rather than something scannable.
    options:
      - title: "Add a colour library (fatih/color or similar)"
        description: "Use an established library for styling and terminal capability detection."
        tradeoffs: "Ergonomic, but a new module dependency in a project whose stated identity is zero-dependency, to emit escape sequences four bytes long."
      - title: "Hand-rolled slog handler with ANSI and glyphs"
        description: "A custom slog.Handler emitting level glyphs, a bold message and attributes either inline or as an aligned indented block."
        tradeoffs: "About 200 lines to own, including the slog.Handler contract (WithAttrs/WithGroup, concurrency) which is easy to get subtly wrong — but no new dependencies, and golang.org/x/term is already direct since pokkum init uses it to decide whether to prompt."
    recommendation: "Hand-rolled. The dependency cost is the wrong trade for escape sequences, and the handler contract is testable."
    decision: |
      Shipped 2026-08-19, hand-rolled, zero new dependencies.

      The split that makes it safe: the renderer is reached only when stderr is an interactive
      terminal. Anything piped, redirected or captured in CI keeps the original logfmt byte for
      byte, because build logs are parsed by other programs and prettier-but-unparseable would be a
      bad trade. `--log-format` gained `auto` (the new default, doing that detection), `console`
      (force the human view even when piped, for `2>&1 | less -R`) and kept `text` (force logfmt
      even on a terminal — what scripts should pin) and `json`.

      Severity is a **glyph** rather than a hue, so `NO_COLOR`, `TERM=dumb` and a colour-blind
      reader all still get a legible line; both keep the layout and drop only the escape sequences.
      Timestamps are omitted interactively — the widest, least useful column when a human is
      watching — and retained in logfmt for everything that needs them.

      Attributes go inline when they fit and become an aligned indented block when they do not,
      measured against the real terminal width (read once at construction, not per record) rather
      than a fixed budget: a fixed number gets one case or the other wrong, exploding a list of
      similar findings into five lines each on a wide terminal or wrapping everything on a narrow
      one. Widths are counted in runes, since these messages contain em dashes and typographic
      quotes.

      Tested for what a hand-written handler most easily breaks: attributes bound via `With()`
      being dropped, groups not prefixing keys, one derived handler's attributes leaking into a
      sibling's through a shared backing array, and interleaved writes — the build fans out over
      platforms and logs from several goroutines, so the concurrency test runs under `-race`.
    flags: ["--log-format"]
    impl:
      - cmd/pokkum/consolelog.go
      - cmd/pokkum/main.go
    related: ["secretguard-reports-locations", "json-output-envelope"]

