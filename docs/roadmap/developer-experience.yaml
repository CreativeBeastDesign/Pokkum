area: "Developer Experience"
items:
  - id: no-container-dev-mode
    title: "pokkum dev --no-container"
    status: shipped
    kind: feature
    tier: moat
    summary: "Runs the project's own dev server directly on the host, skipping image construction entirely, for the fastest possible local iteration loop."
    problem: |
      The default container-parity dev loop goes through full image construction and a Docker/Podman
      daemon on every change — table stakes, not a differentiator, and both external reviews
      independently flagged the dev loop as the weakest part of the day-to-day experience.
      `--no-container` closes the cheap half of that gap: it does not layer a second, Pokkum-owned
      watch/rebuild loop on top of what Vite/SvelteKit's own HMR already does better, it simply gets
      out of the way and runs `bun run dev` directly.
    flags: ["--no-container"]
    impl:
      - cmd/pokkum/dev.go
    limitations:
      - "No supervisor, no startup attestation, no health/readiness probes, no base image, and no non-root user — a single startup warning states this explicitly and the default remains full container-parity mode so nobody debugs a production discrepancy against a mode never meant to model it."
      - "`--debug`, `--platform`, `--bun-version`, and `--bun-variant` are rejected outright rather than silently ignored, since each describes a property of an image that is never built."
      - "`--port` and `--watch` warn (rather than reject) when explicitly set, since the dev server picks its own port and hot reload is inherent rather than opt-in."
    evidence:
      commits: ["18f056c"]

  - id: dev-hot-reload
    title: "pokkum dev (container-parity hot reload)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Builds the image, loads it into the local Docker/Podman daemon, and rebuilds on source changes so local iteration exercises the same runtime the production image ships."
    problem: |
      The container-mode watch/rebuild loop reused a single buffered result channel across container
      generations: when a rebuild killed the previous container, its goroutine's now-irrelevant
      "signal: killed" write landed in the same channel the next generation's select read from, so
      the loop reported a false "container exited with error" and returned — the flagship dev loop
      could not survive a single file save. Fixed by giving each generation its own channel, passed
      in as a parameter rather than captured, so a superseded generation's write lands in a channel
      nobody reads.
    flags: ["--debug", "--port", "--watch", "--env-file", "--platform", "--bun-binary", "--bun-variant", "--bun-version"]
    impl:
      - cmd/pokkum/dev.go
    evidence:
      commits: ["1f8e5bf"]
    related: ["no-container-dev-mode", "cluster-dev-loop"]

  - id: cluster-dev-loop
    title: "pokkum dev --cluster"
    stage: v1.1
    status: shipped
    kind: dx
    tier: moat
    summary: "Watch, rebuild, and sync app server and client output directly into a running pod via the Kubernetes API, without an image build or registry round-trip."
    problem: |
      `--no-container` (see [pokkum dev --no-container](item:no-container-dev-mode)) shipped the
      cheap local-process half of the dev-loop problem. This is the more ambitious, actual
      differentiator: the SvelteKit analog of hot-swapping a Go binary in a running pod. It would put
      Pokkum on Skaffold/Tilt's own turf, but with a narrower, SvelteKit-specific implementation —
      watch, rebuild, sync `/app/server` + `/app/client` into a running pod, restart the Bun process,
      no registry round-trip. Per the decision matrix, this scores highest on DX (10/10) of anything
      on the roadmap, with the cost concentrated in needing a Kubernetes client and pod exec/copy
      plumbing that a narrower reimplementation of what Skaffold/Tilt already do generically requires.
      Both external reviews independently flagged the dev loop as the weakest part of the day-to-day
      experience, and this is the option that actually answers that, as opposed to `--no-container`
      which only removes the container-build tax.
    decision: |
      Built on `kubectl` rather than on a linked Kubernetes client, matching the existing
      cluster-facing code in `cmd/pokkum` (`newKubectlClusterInspector`) and keeping the
      zero-dependency posture: shelling out inherits the developer's kubeconfig, current context,
      exec credential plugins and RBAC for free, which is exactly what a dev loop pointed at
      someone's own cluster should do.

      The hard constraint that shaped everything else is that a Pokkum image is distroless. It has
      no shell and no `tar`, so `kubectl cp` — which shells out to `tar` *inside* the container* —
      cannot work against it, and there is nothing in the image able to kill and re-exec the server
      process. Both halves are therefore provided by `pokkum-init`, the one executable already in
      every layered image: a hidden `pokkum-init __dev-sync` subcommand extracts a tar from stdin
      into an allowlist of `--root` directories, and SIGHUP is reinterpreted as "stop the
      application and start a fresh one" instead of being relayed to the child. This is the same
      shape Tilt's `live_update` needs a restart wrapper for; Pokkum already ships one.

      Both behaviours are gated on `POKKUM_DEV_MODE`, off by default and never set by the packager,
      because between them they let anyone who can already `kubectl exec` into the pod overwrite
      `/app` and restart the server. `pokkum dev --cluster` reads the target container's env and
      refuses up front when it is unset, rather than building and streaming a whole project to earn
      a rejection at the far end.

      Two integrity properties are deliberate rather than incidental. The extractor prints a JSON
      summary and the sending side refuses any result where the counts do not match what it sent,
      or where a requested restart did not happen — a tar that streamed perfectly into a container
      that wrote none of it is otherwise indistinguishable from a working sync. And containment is
      enforced twice: lexically, on whole path segments against the `--root` allowlist, and again
      through `os.Root`, which refuses to traverse a symlink out of the root — the case a lexical
      check cannot see, and the one that matters because the tree being written into is one a
      previous sync may already have modified.
    flags: ["--cluster", "--namespace", "--selector", "--container"]
    impl:
      - cmd/pokkum/dev_cluster.go
      - internal/ports/clusterdev.go
      - internal/adapters/clusterdev/syncer.go
      - internal/adapters/clusterdev/tar.go
      - supervisor/cmd/pokkum-init/devsync.go
      - supervisor/cmd/pokkum-init/supervisor.go
    limitations:
      - "Requires `POKKUM_DEV_MODE=1` on the target container. It is off by default, never set by the packager, and must never be set on a production workload: it makes the in-pod `__dev-sync` subcommand callable and turns SIGHUP into a process restart, both of which hand real power to anyone who can already exec into the pod."
      - "Layered images only. An `exe` or `static` image has no `/app/server`, and the extractor refuses to create a `--root` that does not exist rather than materialising a tree that would look synced and serve nothing."
      - "Deletions are not propagated: a file removed from the local build stays in the pod until the pod is replaced. Only `/app/server` and `/app/client` are synced — a change to production dependencies, prerendered pages, vendor or native trees still needs a real image build."
      - "Extraction restores the owner write bit on the `/app` directories it writes into (the packager ships them `0555`) and leaves synced entries at `0755`/`0644`, so a dev-synced pod is no longer byte-identical to its image. The container user must own the `/app` tree; if it does not, the sync fails rather than half-completing."
      - "If the target container sets `POKKUM_ATTESTATION_DIGEST`, the pod will fail its *next* start with exit 125, because startup attestation re-derives the digest of the very `/app` tree this loop rewrote. The running pod is unaffected — attestation runs once, at supervisor startup — but an eviction or reschedule turns into a crash loop. A `Warn` says so when the target has it set."
      - "A multi-container pod (e.g. with `--with-otel-sidecar`) requires `--container`. There is deliberately no first-container heuristic: it would be a coin flip between the application and the collector."
    related: ["no-container-dev-mode", "oci-layout-dev-output"]

  - id: oci-layout-dev-output
    title: "--to-oci-layout for daemonless cluster loading"
    status: shipped
    kind: dx
    tier: polish
    summary: "Writes a standards-conformant OCI image layout to a directory — no daemon, no registry — preserving every annotation and the full multi-platform index, ready for `ctr images import` / kind / k3d / minikube."
    problem: |
      Adjacent to [pokkum dev --cluster](item:cluster-dev-loop) but structurally simpler and cheaper
      to build — it doesn't touch the in-pod sync problem, it just gives daemonless environments a way
      to get a built image into a local cluster without a registry round-trip. Ordered after the
      cluster dev loop because it is a hermetic-CI nicety, not a faster inner loop, but it's cheap
      enough to pick up independently.

      It also carries the second half of
      [Tarball output silently drops every OCI annotation](item:tarball-output-drops-annotations),
      whose recommendation was to warn first and then fold real annotation support into this work
      rather than duplicating it. The two existing local output modes both go through the legacy
      docker-save format, which has neither an annotations field nor any representation of a manifest
      list, so `--tarball` silently discarded every `org.opencontainers.image.*` and `pokkum.dev/*`
      annotation and flattened a multi-platform build into one platform-suffixed tag per child. An
      OCI image layout has first-class support for both, which makes this the lossless local output.
    decision: |
      Implemented against go-containerregistry's own `pkg/v1/layout` rather than hand-rolled, so
      the on-disk result is whatever that library — and therefore crane, skopeo and containerd —
      already agree an OCI layout is.

      Four decisions worth recording. (1) `index.json` holds one descriptor per requested tag
      pointing at the payload's own top-level blob, which is the shape `crane pull --format=oci`
      produces; writing the payload index *as* `index.json` would have left nowhere to record the
      tag. (2) Each descriptor carries two name annotations, not one, because the consumers this
      mode exists to serve disagree: `org.opencontainers.image.ref.name` (bare tag) is what
      skopeo's `oci:` transport and podman match on, `io.containerd.image.name` (fully qualified)
      is what containerd's archive importer reads first — and therefore what `ctr images import`,
      `k3d image import` and `minikube image load` see. (3) A single-image descriptor gets its
      platform read off the image's own config, since `partial.Descriptor` never populates it and
      an index child is not there to carry it; an index descriptor deliberately does not, because
      claiming one platform for a multi-platform artefact would be wrong. (4) The layout is
      assembled in a staging directory and swapped into place, so an interrupted run leaves either
      the previous layout or nothing — never an `index.json` referencing blobs that were never
      written — and a re-run replaces rather than merges, so a repeated dev loop cannot accumulate
      orphaned blobs.

      The three destination flags (`--local`, `--tarball`, `--to-oci-layout`) are mutually
      exclusive, following the wording the pre-existing `--local`/`--tarball` check established.
      `--require-signed` still rejects this mode along with the other two: signatures live in a
      registry, keyed to a pushed digest, and a layout on disk has nothing to attach them to.
    flags: ["--to-oci-layout"]
    impl:
      - internal/adapters/registry/ocilayout.go
      - internal/adapters/registry/ocilayout_test.go
      - internal/ports/registry.go
      - internal/core/model.go
      - internal/core/pipeline.go
      - cmd/pokkum/build.go
    limitations:
      - "`docker load` does not accept an OCI image layout, so this mode does not replace `--tarball` — anyone piping into Docker still needs the docker-save format, which is exactly why the lossy mode was kept alongside rather than fixed in place."
      - "SBOM, signature and attestation attachment still happen only for a registry push: they are separate manifests keyed to a pushed digest, and the layout carries the image alone. A layout build reports itself as unsigned rather than silently claiming otherwise."
      - "`--asset-overlay` auto-discovery still requires a registry push. The layout preserves the `pokkum.dev/predecessor` annotation, but walking a lineage backwards means fetching predecessors, which a directory on disk cannot serve."
    related: ["cluster-dev-loop", "tarball-output-drops-annotations"]

  - id: base-flag-custom-reference
    title: "--base accepts a custom image reference"
    status: shipped
    kind: fix
    tier: polish
    summary: "`--base` now accepts a free-form custom image reference, closing a docs/CLI mismatch where the help text promised it and no code path accepted one."
    problem: |
      `--base`'s help text offered a custom image reference, but every value was routed through
      `ParseBaseImagePreset`, so `--base gcr.io/my/base:tag` was rejected outright — a documented
      capability the flag simply did not provide. The underlying port already supported it
      (`BaseImageCustom` exists and its `Ref` field was already documented as required); only the
      CLI could not reach it. A UX/docs mismatch, not a security issue — the preset path and the
      `custom` preset itself worked throughout.
    flags: ["--base"]
    impl:
      - internal/core/model.go
    limitations:
      - "Presets are tried first, and only a value containing `/`, `.`, `:`, or `@` is parsed as a reference — this ordering is load-bearing, since `name.ParseReference` would otherwise accept a typo'd preset (e.g. `distrolss`) as valid Docker Hub shorthand instead of surfacing a clear \"unknown preset\" error."
    evidence:
      commits: ["69914ac"]
      findings: [13]

  - id: layer-origin-tracing
    title: "pokkum explain / explain why / explain diff"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Reads a real OCI image and reports its actual per-layer digests, sizes, and file origins, and diffs two images layer-by-layer."
    problem: |
      All three commands originally returned hardcoded fabricated data — `explain` returned a literal
      layer list with invented digests and sizes, `why` hardcoded a layer index for whatever dependency
      was passed, and `diff` hardcoded a fixed "modified" layer, none of which ever touched a real
      image (no `remote.`, `Fetch`, or tar walk in the original implementation). Implemented for real
      by reusing the layer-diffing and per-layer file-record machinery `pokkum verify`'s L3 comparison
      and the packager already had, rather than deleting the commands.
    impl:
      - cmd/pokkum/explain.go
    evidence:
      findings: []

  - id: workspace-init-wizard
    title: "pokkum init"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Guided interactive setup for `.pokkum.yaml` and `.pokkumignore`, with a non-interactive `--defaults` mode."
    flags: ["--defaults"]
    impl:
      - cmd/pokkum/init.go

  - id: static-viability-analyzer
    title: "Static-viability analysis (does this project need a server?)"
    stage: v1.1
    status: shipped
    kind: feature
    tier: foundation
    summary: "Scans a project's routes for server-side code and reports what rules a static build out, feeding `pokkum init`'s strategy default."
    problem: |
      `pokkum init` offered `layered` / `static` as a free choice and validated nothing. Nothing
      anywhere in the codebase looked at `src/routes` at all: choosing `static` on a project with
      a `+server.ts` failed deep inside the SvelteKit build, with SvelteKit's message rather than
      Pokkum's, long after the choice was made. Picking correctly required the user to already
      know the answer, which is the opposite of what a setup step is for.
    decision: |
      Shipped as `sveltekitutils.AnalyzeStaticViability`, a DISQUALIFIER scan. It answers "does
      anything here rule static out?" soundly and does not attempt the converse, which is not
      decidable from source: a load function hitting a runtime-only API, or a dynamic route with
      no inbound links for the crawler, passes the scan and fails the build. The verdict wording
      and `pokkum init`'s output both say so explicitly.

      Blockers: `+server.*`, `+page.server.*` and `+layout.server.*` (each retired by an
      `export const prerender = true` in the same file), form actions (`export const actions`,
      unconditional — a POST handler cannot be prerendered, so a `prerender = true` alongside it
      does not silence the finding), `*.remote.ts|js` using `query()`/`form()`/`command()`, and
      an explicit `export const prerender = false` anywhere. A remote module using only
      `prerender()` is build-time data and is not a blocker. `hooks.server.*` is reported as a
      caveat, not a blocker: server hooks do run during prerendering, so calling them
      disqualifying would wrongly reject projects that build today.

      Three verdicts, not two. `unknown` (could not scan) is distinct from `viable` (scanned,
      found nothing) and carries the reason, so an unreadable or non-SvelteKit directory can
      never produce the reassuring answer — the fail-open shape logged three times on
      2026-08-21. `FilesScanned` is reported for the same reason at the other end: a walk that
      matched nothing must not read as a clean project.

      Matching is done on comment-stripped, string-blanked source via the scanner already in
      `project.go`, never a whole-file regex. Both halves of that have burned this repo before
      (2026-08-16 `fallback:` in a comment, 2026-08-17 `sveltekit(` in a string literal), and a
      commented-out `export const prerender = false` silently forcing `layered` would be the same
      bug a third time.
    impl:
      - internal/adapters/sveltekitutils/staticviability.go
      - internal/adapters/sveltekitutils/staticviability_test.go
      - cmd/pokkum/init_analysis.go
    limitations:
      - "A sound negative only. `viable` means nothing found rules static out, never that a static build will succeed."
      - "Dynamic routes are reported as caveats, not blockers: a route without an `entries()` export is prerendered only if the crawler reaches it, and whether it is linked cannot be determined from source. The caveat is suppressed when the project sets `prerender.handleUnseenRoutes` to `warn` or `ignore`."
      - "Advisory only. `pokkum build` does not yet refuse `strategy: static` on a project this scan calls blocked — see item static-strategy-preflight."
    related: ["workspace-init-wizard", "init-runtime-detection", "static-strategy-preflight"]

  - id: init-runtime-detection
    title: "pokkum init detects bun vs node, and the base image that carries it"
    stage: v1.1
    status: shipped
    kind: feature
    tier: foundation
    summary: "`runtime: bun|node` is inferred from the project's own toolchain, and drags the paired base preset along so the two cannot disagree."
    problem: |
      `runtime` is a real config field and a real `--runtime` flag, but `ports.InitConfigOptions`
      had no `Runtime` member at all, so `pokkum init` could not write it under any circumstances.
      A Node project got a Bun image by silence, and the operator had to discover the flag and
      hand-edit `.pokkum.yaml` afterwards.

      Worse, the field does not stand alone. core rejects `runtime: node` outside
      `strategy: layered`, and on any base preset that ships no Node binary — the runtime IS base
      image content for node. Those are three fields that must compose, and
      `pokkum config validate` checks fields, not their composition. A generator emitting them
      independently would produce a config that validates and then refuses to build: the exact
      2026-08-19 `init-generates-invalid-config` shape, one field wider.
    decision: |
      Shipped as `sveltekitutils.DetectAppRuntime`, reading three tiers of evidence in a fixed
      precedence: `packageManager` in package.json (explicit and singular), then lockfiles
      (`bun.lock`/`bun.lockb` vs `package-lock.json`/`pnpm-lock.yaml`/`yarn.lock`), then
      `engines`. Contradictory evidence inside a tier returns NO opinion with a `Conflict`
      reason rather than picking a side; the caller keeps its own default and says why.

      Explicitly a preference signal, not a compatibility verdict — nothing here proves a project
      cannot run under the other runtime, and nothing refuses a build over it.

      The composition is enforced in `config.GenerateDefault`, the one place that picks all three
      values: `runtime: node` upgrades the base to `distroless-node`, and is dropped rather than
      emitted next to a non-layered strategy. `pokkum init`'s prompt does not offer the runtime
      question at all when the strategy is `static`, since a static image ships no JavaScript
      runtime and every answer would be meaningless or invalid.

      Guarded by a test that walks EVERY combination of strategy, runtime, base preset and local
      profile the generator can emit and asserts each is accepted by both `config validate`'s
      per-field checks and core's cross-field `Validate()`. Reverting the composition clamp turns
      six of those combinations red.
    impl:
      - internal/adapters/sveltekitutils/runtimedetect.go
      - internal/adapters/config/config.go
      - internal/ports/config.go
      - cmd/pokkum/init.go
    related: ["static-viability-analyzer", "init-generates-invalid-config", "workspace-init-wizard"]

  - id: init-base-image-recommendations
    title: "pokkum init explains the base image presets instead of listing them"
    stage: v1.1
    status: shipped
    kind: dx
    tier: polish
    summary: "Each preset is shown with a one-line reason and the detected default marked, rather than as a bare three-way choice."
    decision: |
      The base-image prompt printed three preset names and nothing else, which asks the operator
      to already know the difference between `distroless` and `chainguard` — and gives no hint
      that `distroless-node` is required for `runtime: node` and pointless otherwise. Each preset
      now carries a one-line rationale, and the default derived from the runtime detection is
      marked so the recommended answer is visible without reading it off a separate line.

      The offered list is built from the `ports` preset constants rather than written out in the
      prompt, which is what stops the 2026-08-19 defect recurring: that prompt offered
      `chainguard-static`, an unimplemented roadmap item, because the list was hand-maintained.
    impl:
      - cmd/pokkum/init_analysis.go
      - cmd/pokkum/init.go
    related: ["init-runtime-detection", "init-generates-invalid-config"]

  - id: deploy-check
    title: "pokkum deploy --check"
    stage: v1.1
    status: shipped
    kind: dx
    tier: foundation
    summary: "Validates the deploy configuration through the same resolution a real deploy uses, and deploys nothing."
    problem: |
      Every `deploy:` answer was unverifiable until the moment it mattered. A wrong endpoint, an
      unset `POKKUM_DEPLOY_TOKEN` or a missing `application` surfaced as a failed deploy at the end
      of a build, and `pokkum config validate` could not help: it checks field shapes, not the
      cross-field resolution the deploy performs.
    decision: |
      Shipped as step 1 of [the deployment plan](item:init-deployment-section). It calls
      `core.ResolveDeployRequest` — the exact call `executeDeploy` makes — rather than
      re-implementing the rules. That is the whole design constraint: this repo has already shipped
      a validator that disagreed with its consumer (2026-09-01, `config validate` reporting a
      config valid that `pokkum deploy` refused), and a `--check` that could do the same would be
      worse than none, since its entire promise is that agreeing with it means the deploy resolves.
      `TestDeployCheck_AgreesWithTheResolutionItClaimsToPredict` asserts that biconditional
      directly over configs on both sides of every rule the resolver applies.

      Three outcomes per item, not two. `unverified` is distinct from `ok` and never fails the
      command: Pokkum will not claim to have confirmed something it did not test, and will not
      treat its own inability to check as the user's error.

      What is NOT verified, and why, is stated in the output rather than papered over. The
      application id is unconfirmed because every Dokploy endpoint whose contract this repo has
      verified against Dokploy's own source mutates — `application.deploy` queues a rollout,
      `application.saveDockerProvider` overwrites credentials — and a check must not deploy.
      Guessing at an unverified read-only endpoint to make the line say "ok" would be a fabricated
      confirmation, which is the shape of the 2026-08-21 `pokkum scan` incident.

      The endpoint probe is a bare TCP dial to host:port, never an HTTP request. That is what makes
      it safe for a SwiftWave webhook endpoint whose URL PATH is the secret, and it is why the
      output reports reachability only. No credential, token or URL is ever printed.
    flags: ["--check", "--offline"]
    impl:
      - cmd/pokkum/deploy_check.go
      - cmd/pokkum/deploy_check_test.go
      - cmd/pokkum/deploy.go
    limitations:
      - "Cannot confirm the credential is accepted or the application exists; both need a read-only endpoint with a verified contract, and neither platform offers one Pokkum has verified."
      - "The endpoint probe proves the host accepts a connection, not that the panel is running at that path."
    related: ["init-deployment-section", "paas-deploy-targets"]

  - id: init-deployment-section
    title: "A deployment section in pokkum init, and what pokkum deploy would need to earn it"
    stage: v1.2
    status: awaiting-decision
    kind: feature
    tier: polish
    summary: "Whether init should configure `deploy:` at all. Step 1 of the recommendation (`deploy --check`) has shipped; the remaining question is `pokkum deploy init`."
    problem: |
      `pokkum init` writes every other section of `.pokkum.yaml` and never touches `deploy:`, so the
      one step that gets an image in front of users is the one left to hand-editing against
      Vocabulary.md.

      `deploy:` is not shaped like the fields init already writes. It needs secrets (`token_env`
      names a credential; a webhook `endpoint` contains its secret in the URL), it needs facts only
      the platform has (`application` is a platform-side id), and its answers cannot be validated
      offline.

      **`application` is what decides this.** It cannot be typed from memory and cannot be checked
      without calling the platform, so any prompt in `pokkum init` — which runs before the user has
      a reason to have set `POKKUM_DEPLOY_TOKEN` — structurally cannot obtain it. Every option that
      writes a `deploy:` block without it writes a block that does not work.
    options:
      - title: "A. Prompt in init for the non-secret half"
        description: "Ask target/method/endpoint; never prompt for the token; leave `application` empty with a comment."
        tradeoffs: "Smallest diff, but writes a block that is incomplete by construction — the user's next `pokkum deploy` fails on the missing `application`, which is the 2026-08-19 'init recommended a command it had guaranteed could not work' shape in a new place."
      - title: "B. A dedicated `pokkum deploy init`"
        description: "Runs after the credential exists: reads the token, lists the platform's applications, lets the user pick one, writes a complete block verified by --check."
        tradeoffs: "The only option that can get `application` right. Costs a new subcommand and a list-applications call per target; SwiftWave's webhook method has no equivalent and would stay manual."
      - title: "C. Diagnostics only"
        description: "Leave configuration to the file; spend the effort on `pokkum deploy --check`."
        tradeoffs: "Zero risk, useful in CI regardless of how the config was authored — but leaves first-time setup unaddressed."
    recommendation: |
      B, on top of C. **C has now shipped** as [pokkum deploy --check](item:deploy-check), which
      also built the resolution-reuse machinery B needs.

      What remains is `pokkum deploy init`: the same resolution, plus a list-applications call, plus
      an interactive picker, writing the block only once `--check` passes against it. `pokkum init`
      gains one closing line pointing at it and writes no `deploy:` key itself.

      Worth reassessing before building. `--check` may have closed enough of the gap on its own,
      and the honest test is whether anyone still gets `application` wrong now that a single
      command tells them their config resolves.
    limitations:
      - "A `pokkum deploy init` picker would be Dokploy-only; SwiftWave's webhook method has no application-listing equivalent."
    related: ["deploy-check", "workspace-init-wizard", "paas-deploy-targets"]

  - id: static-strategy-preflight
    title: "pokkum build preflight for strategy: static"
    stage: v1.1
    status: shipped
    kind: hardening
    tier: foundation
    summary: "`pokkum build --strategy=static` refuses before it starts when the project has code SvelteKit cannot prerender, listing every offending file."
    problem: |
      [Static-viability analysis](item:static-viability-analyzer) shipped as advice only, reached
      from `pokkum init`. A project that adds a `+server.ts` with a POST handler a month after
      init still discovered the incompatibility from SvelteKit's own error, minutes into a build,
      with no mention of Pokkum or the strategy setting that caused it.
    decision: |
      Shipped the recommended option: refuse by default, with `--allow-server-code-in-static`
      (and `build.allow_server_code_in_static`) as the escape hatch. `ports.StaticViabilityAnalyzer`
      is injected at the composition root, wrapping `sveltekitutils` in a concrete
      `internal/adapters/staticviability` adapter, since `internal/core` must not import an
      adapter — the shape `ports.EnvBakeDetector` and `ports.RouteFilter` already use.

      **Building this found that the classifier it depends on was wrong**, which is the part worth
      remembering. Run over the repo's own committed fixtures, it called
      `testdata/fixtures/sveltekit-basic` blocked — a fixture `tests/integration/static_e2e_test.go`
      builds with `StrategyStatic`. Reading `@sveltejs/kit`'s source rather than trusting the
      classification showed two false positives (every `+server.*`, and every server `load`), both
      fixed before the gate landed on top. A hard gate over an over-aggressive classifier would
      have been Lessons.md's 2026-08-17 entry a second time, as a build failure rather than advice.

      Three limits, each deliberate:

      - `StrategyStatic` only; every other strategy ships a server.
      - Refuses on a `blocked` verdict ONLY. An `unknown` verdict — unreadable project, no routes
        directory, a layout the scan does not understand — is the absence of evidence and never
        fails a build. This is exactly what 2026-08-17 got wrong.
      - Overridable, because the scan is a heuristic over source text and nobody should wait for a
        Pokkum release to ship around a bug in it.

      The nil-analyzer skip in core is a fail-open that exists for the ~16 test callers
      constructing `core.Deps` directly. `cmd/pokkum`'s
      `TestCompositionRootWiresTheStaticViabilityGate` asserts the real composition root always
      supplies one, because nothing in `internal/core` can see its own composition root — deleting
      that one line would otherwise disable the gate for every real build with the whole suite
      still green.
    flags: ["--allow-server-code-in-static"]
    impl:
      - internal/ports/staticviability.go
      - internal/adapters/staticviability/staticviability.go
      - internal/core/pipeline.go
      - internal/core/staticgate_test.go
      - cmd/pokkum/build.go
      - cmd/pokkum/staticgate_wiring_test.go
    limitations:
      - "Source-text heuristic, not a SvelteKit build. It cannot see a handler assembled dynamically, re-exported from another module, or generated at build time."
      - "Does not implement SvelteKit's root `+server.js` non-HTML-response rule (prerender.js:539), which depends on the response value rather than on the file's shape."
      - "Dynamic route segments are still not reported; adapter-static cannot crawl an unlinked `[slug]`, and detecting that needs link analysis rather than a per-file scan."
    related: ["static-viability-analyzer", "workspace-init-wizard"]

