  - id: plugin-system
    title: "npm-distributed plugin system"
    status: wont-do
    kind: dx
    tier: non-goal
    summary: "Will not be built: an npm-based extension model would undercut the exact supply-chain hardening story Pokkum exists to provide."
    decision: |
      The DX case for a `pokkum-plugin-*` ecosystem (community plugins for custom adapters and
      preprocessors, an esbuild/Vite-style marketplace) is real, but an npm-based extension model
      directly undercuts Pokkum's own hardening story — this is a supply-chain-security tool that
      would be inviting the exact npm supply-chain risk its own `secretguard`, hermetic-build, and
      CVE-gate features exist to mitigate. Stated as a decision, not a silent omission.

  - id: init-generates-invalid-config
    title: "pokkum init wrote a config pokkum build refused"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "Every generated .pokkum.yaml carried an invalid sbom.attach value, so the first two commands a new user runs did not work together."
    problem: |
      `GenerateDefault` wrote `sbom.attach: attestation` into every generated `.pokkum.yaml`.
      `attestation` was never one of that mode's values (`referrer`, `tag`, `auto`) — a
      plausible word, since an SBOM genuinely is attached as an attestation, which is why it
      survived review. `pokkum build` then refused to start with `invalid sbom attach mode`.

      Both halves were individually correct and tested: `GenerateDefault` had tests asserting
      its fields, `ParseSBOMAttachMode` had tests rejecting bad input, and nothing exercised
      the join. Worse, `cmd/pokkum/config.go`'s `validateConfigFields` already checks
      `sbomAttach` — the binary shipped a validator that rejects exactly this, and `init`
      never ran it on its own output.

      Two further defects surfaced immediately once a regression test covered the whole matrix
      of choices `init` offers: the prompt offered `chainguard-static`, an unimplemented
      roadmap item rather than a preset, while omitting the real `distroless-node`; and the
      prompts accepted any typed value verbatim, so a typo reached disk and failed much later.

      Found by running the tool on a real project, not by any test or review pass.
    decision: |
      Shipped 2026-08-19. Generated enum values now come from the port constants
      (`ports.DefaultSBOMAttachMode`, `ports.SBOMFormatSPDXJSON`), making this class of typo a
      compile error. `init` validates what it is about to write through the same
      `validateConfigFields` that backs `pokkum config validate`, and refuses with an explicit
      "this is a bug in pokkum, not your project" — a generated config is Pokkum's own output,
      so an invalid value there is never the user's fault. A new `promptChoice` constrains each
      enum answer to a fixed set and re-asks rather than accepting, and the base-preset list is
      now exactly the presets that exist.
    flags: ["--sbom-attach", "--base"]
    impl:
      - internal/adapters/config/config.go
      - cmd/pokkum/init.go
      - cmd/pokkum/config.go
    related: ["chainguard-static-preset", "config-management"]

  - id: init-recommends-a-failing-command
    title: "pokkum init recommended a command it had guaranteed could not work"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "init always ended with \"you can now run pokkum build\", which fails immediately for the local-only setup its own first prompt invites."
    problem: |
      `pokkum init`'s first prompt offers the registry as "empty for local only". Accepting that
      leaves no destination repository, and `pokkum build` defaults to push mode, so it refused to
      start:

        validation failed: destination repository is required in push mode

      init nevertheless closed with the constant `You can now run \`pokkum build\``. It was
      recommending a command it had just guaranteed could not work, for the option it had just
      offered as reasonable.

      Reported from a real first run immediately after the generated-config fix, and the same
      class one level up: advice is output too, and output the next command rejects is a defect.
      `pokkum build --local` was the command that worked all along — it clears configuration
      entirely and reaches genuine preflight (a missing `@sveltejs/adapter-node`).
    decision: |
      Shipped 2026-08-19. The closing line is derived from the config init actually wrote, or
      loaded when one already exists, so re-running init on a configured project gives advice
      matching that project rather than the defaults. With no registry it recommends
      `pokkum build --local` and explains that a registry is what plain `pokkum build` needs; with
      one configured it recommends `pokkum build` as before. The recommendation is also exposed as
      `next_command` in the JSON envelope so scripted callers get the same answer as humans.

      Guarded by a workflow test that reads the recommendation out of init's own JSON output and
      runs it, rather than hardcoding a command — so it follows the advice wherever it goes. It
      asserts not that the command succeeds (impossible without a JS toolchain) but that it never
      fails for a configuration or usage reason.
    impl:
      - cmd/pokkum/init.go
      - tests/integration/cli_workflow_test.go
    related: ["init-generates-invalid-config", "cli-workflow-tests"]

  - id: injection-preconditions-undocumented
    title: "Zero-config adapter injection declined silently, with undocumented preconditions"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "Injection is advertised as automatic but engages only under two conditions, and when it declined it said nothing, so the failure read as the feature being broken."
    problem: |
      Zero-config adapter injection (Option B) is real, enabled by default, and works: given a
      project whose `package.json` build script is exactly `vite build`, `pokkum build` writes
      `.pokkum/vite.config.ts` and uses it, without touching user-authored files. Verified
      empirically.

      It engages only when two conditions hold, and neither was documented:

      1. The adapter **package** must be installed. Injection configures an adapter; it cannot
         install one. Preflight fails first if it is neither configured nor in `package.json`.
      2. `package.json`'s `build` script must be exactly `vite build`. Injection replaces the
         build invocation, so it declines when doing so would silently skip anything else the
         script does — env setup, codegen, a task runner. That guard is correct.

      What was wrong is that declining was **silent**. The operator got Option C's "fix it in
      vite.config.ts" with no hint that Pokkum would have done it for them under a condition they
      could meet, and no way to distinguish "Pokkum cannot do this" from "Pokkum would not do this
      here". Meanwhile `docs/Features.md`, `Vocabulary.md`'s `--inject` row and `pokkum adopt`'s
      own help all advertised injection with no preconditions at all — `adopt` went further and
      said "no on-disk edit is actually required", which for a project failing either condition
      is false.

      Found by running the tool on a real project, immediately after two other defects in the same
      three-command sequence.
    decision: |
      Shipped 2026-08-19. A declined injection now names the precondition that failed and quotes
      the offending build script, while still wrapping the adapter sentinel so `errors.Is`
      consumers are unaffected. The preflight error additionally explains that injection rewrites
      configuration but cannot install a package, which is the confusion that made a correct
      message read as a bug.

      Documentation corrected in all four places to state both preconditions rather than implying
      injection is unconditional. `adopt`'s help now separates the configuration swap (which
      injection does handle) from the package requirement (which it cannot).

      Two rounds of correction were needed here, worth recording: the first fix stated only the
      package precondition, and a second empirical run — adapter installed, `vite.config.ts`
      present — showed injection still declining, which is what surfaced the build-script guard.
      Reasoning from the code's comments alone produced a confident wrong answer twice; only
      running it with each precondition satisfied in turn established what actually holds.
    flags: ["--inject", "--no-inject", "--write-config"]
    impl:
      - internal/adapters/bunexec/compiler.go
      - cmd/pokkum/adopt.go
    related: ["init-recommends-a-failing-command", "adopt-codemod"]

  - id: console-log-rendering
    title: "Human-readable console output for build logs"
    stage: v1.1
    status: shipped
    kind: dx
    tier: polish
    summary: "Build progress rendered with level glyphs and aligned attribute blocks on a terminal, while piped and CI output stays byte-identical logfmt."
    problem: |
      Every build line was raw logfmt: a full RFC3339 timestamp with a timezone offset, then
      `level=`, then `msg=` in quotes, then six `key=value` pairs on one 200-column line. The
      timestamp alone consumed about a third of the width, pushing the message past where the eye
      lands, and a record like `build starting` — projectDir, repo, platforms, output, dryRun,
      printManifest — was a wall rather than something scannable.
    options:
      - title: "Add a colour library (fatih/color or similar)"
        description: "Use an established library for styling and terminal capability detection."
        tradeoffs: "Ergonomic, but a new module dependency in a project whose stated identity is zero-dependency, to emit escape sequences four bytes long."
      - title: "Hand-rolled slog handler with ANSI and glyphs"
        description: "A custom slog.Handler emitting level glyphs, a bold message and attributes either inline or as an aligned indented block."
        tradeoffs: "About 200 lines to own, including the slog.Handler contract (WithAttrs/WithGroup, concurrency) which is easy to get subtly wrong — but no new dependencies, and golang.org/x/term is already direct since pokkum init uses it to decide whether to prompt."
    recommendation: "Hand-rolled. The dependency cost is the wrong trade for escape sequences, and the handler contract is testable."
    decision: |
      Shipped 2026-08-19, hand-rolled, zero new dependencies.

      The split that makes it safe: the renderer is reached only when stderr is an interactive
      terminal. Anything piped, redirected or captured in CI keeps the original logfmt byte for
      byte, because build logs are parsed by other programs and prettier-but-unparseable would be a
      bad trade. `--log-format` gained `auto` (the new default, doing that detection), `console`
      (force the human view even when piped, for `2>&1 | less -R`) and kept `text` (force logfmt
      even on a terminal — what scripts should pin) and `json`.

      Severity is a **glyph** rather than a hue, so `NO_COLOR`, `TERM=dumb` and a colour-blind
      reader all still get a legible line; both keep the layout and drop only the escape sequences.
      Timestamps are omitted interactively — the widest, least useful column when a human is
      watching — and retained in logfmt for everything that needs them.

      Attributes go inline when they fit and become an aligned indented block when they do not,
      measured against the real terminal width (read once at construction, not per record) rather
      than a fixed budget: a fixed number gets one case or the other wrong, exploding a list of
      similar findings into five lines each on a wide terminal or wrapping everything on a narrow
      one. Widths are counted in runes, since these messages contain em dashes and typographic
      quotes.

      Tested for what a hand-written handler most easily breaks: attributes bound via `With()`
      being dropped, groups not prefixing keys, one derived handler's attributes leaking into a
      sibling's through a shared backing array, and interleaved writes — the build fans out over
      platforms and logs from several goroutines, so the concurrency test runs under `-race`.
    flags: ["--log-format"]
    impl:
      - cmd/pokkum/consolelog.go
      - cmd/pokkum/main.go
    related: ["secretguard-reports-locations", "json-output-envelope"]

  - id: injection-discarded-svelte-config
    title: "Adapter injection silently discarded the project's whole SvelteKit config"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "Rewriting a bare sveltekit() to inject an adapter makes SvelteKit ignore svelte.config.js entirely, so aliases, csp, prerender settings and kit.experimental flags were all lost."
    problem: |
      Reported as a build failure that named the missing flag while the project already had it:

        [vite-plugin-sveltekit-guard] Could not load virtual:env/dynamic/private:
        To enable remote functions, add kit.experimental.remoteFunctions

      SvelteKit calls `load_svelte_config()` only when the `sveltekit()` plugin receives **no**
      argument — verified in `@sveltejs/kit`'s `src/exports/vite/index.js`, which also prints
      "svelte.config.js is ignored when options are passed via your Vite config" in the other branch.
      Zero-config adapter injection rewrote a bare `sveltekit()` into
      `sveltekit({ adapter: adapter() })`, which supplies an argument — so the project's entire
      `svelte.config.js` was discarded to inject one option. Aliases, csp, prerender settings and
      every `kit.experimental` flag went with it.

      The failure is worse than a lost setting: `remoteFunctions` being absent makes
      `virtual:env/dynamic/private` unresolvable, so the build fails outright, pointing at a config
      the user has already written correctly.
    decision: |
      Shipped 2026-08-19. When the plugin call is bare and the project has a svelte config, the
      injected `.pokkum/vite.config.ts` now imports that file and merges it, overriding only the
      adapter.

      The conversion is the substance, because the two shapes differ. `svelte.config.js` nests
      SvelteKit's own options under `kit`, while the Vite-config form is flat: `split_config()`
      destructures `extensions`/`compilerOptions`/`vitePlugin`/`preprocess`, routes every other
      recognised key into `kit`, splits `experimental` between SvelteKit and vite-plugin-svelte, and
      passes anything unrecognised to the latter. A literal `kit` key is not recognised, so spreading
      the file unflattened would hand `kit` to vite-plugin-svelte as an unknown option and still lose
      its contents. The generated config therefore spreads the non-kit remainder, then the flattened
      kit options, then the adapter last so it always wins.

      Untouched in the other two cases: a project with no svelte config keeps the plain injected
      form, and a project already passing options has itself opted out of `svelte.config.js`, so
      importing it would change that project's semantics rather than preserve them.

      Verified empirically rather than by inspection, which mattered here: unit tests assert the
      generated source contains the right spreads, and that is a different claim from "SvelteKit
      honours it" — a config that looks right and is shaped wrong passes them. A real bun build with
      `kit.appDir` set to a probe value now asserts the custom directory appears in the output and
      the default `_app` does not; reverting the merge makes it fail with `_app`.
    flags: ["--inject", "--no-inject"]
    impl:
      - internal/adapters/sveltekitutils/injector.go
      - internal/adapters/bunexec/compiler.go
      - tests/integration/svelte_config_merge_test.go
    limitations:
      - "A project defining both `kit.experimental` and a top-level `experimental` for vite-plugin-svelte would see the kit one win after flattening. Unusual, and preferable to dropping the config entirely."
    related: ["injection-preconditions-undocumented", "adopt-codemod"]


  # ---------------------------------------------------------------------
  # Agent-facing surface: using Pokkum from another project, not working on it
  # ---------------------------------------------------------------------

  - id: agent-guide-command
    title: "pokkum guide — the operating manual, shipped inside the binary"
    stage: v1.2
    status: open
    kind: dx
    tier: foundation
    summary: "A task-shaped guide the binary prints itself, so an agent driving Pokkum in someone else's SvelteKit project reads instructions that cannot be a different version from the binary it is driving."
    problem: |
      Everything Pokkum knows how to say is written for one of two audiences, and neither is
      "an agent working in a project that is not this repo". `AGENTS.md`, `CLAUDE.md` and
      `DSH.md` instruct agents working ON Pokkum. `Vocabulary.md` is an exhaustive flag
      reference — organised by flag rather than by decision, and large enough that pasting it
      into a context window is itself the cost. `--help` is thorough on flags and silent on the
      packaging model.

      The gap is not invocation. An agent with a shell can already run `pokkum build`. What it
      gets wrong is everything upstream of that:

      - `runtime`, `strategy` and `base` compose, and it picks them as three independent values.
      - It assumes a Dockerfile's `COPY .` semantics, and is surprised that only the adapter's
        `build/` output enters the image.
      - It designs a runtime write path under `/app`, which ships mode `0555` in every Pokkum
        image with no opt-out — a fact stated once, in a code comment
        (`internal/adapters/packager/layer.go`). See item
        [read-only /app](item:readonly-app-invariant-undocumented).
      - It reaches for `--no-verify-base`, `--allow-incomplete` or a relaxed `--fail-on` to make
        a failing command exit 0. A human reads those as "I am accepting risk"; an agent reads
        them as "the command passes now".
      - It hand-rolls `docker cp` + `docker exec` to answer a question `pokkum explain why`
        already answers, because nothing told it that command exists.

      And the docs it can find are frequently the wrong version. A Homebrew-installed 1.0.6
      ships a README that does not mention `pokkum deploy` at all, while a newer binary earlier
      on the same PATH carries the whole Dokploy/SwiftWave surface. An agent reading this
      repository's docs for a binary it did not install is reading fiction. That version-skew
      is the specific argument for putting the guide *in the binary* rather than in a file.
    recommendation: |
      `pokkum guide` writes the manual to stdout. Generated from the same flag/env registry
      `scripts/gen-docs` already uses, and covered by the same parity guard that
      `cmd/pokkum/flags_docs_test.go` and `envvar_docs_test.go` apply — so a new flag cannot
      ship with the guide silently stale.

      Task-shaped, not reference-shaped. Intended contents:

      - **What Pokkum is, in operational terms only.** SvelteKit project in, OCI image out; what
        does and does not enter the image. Not the reproducibility or supply-chain story — that
        is why someone chooses Pokkum, not what an agent needs to drive it.
      - **The invariants that shape application code before Pokkum ever runs.** `/app` is
        read-only; only adapter output ships; writes go to the OS temp directory, never a
        project-relative path. This is the greenfield half, and no tool call can deliver it
        retroactively — by the time a build fails, the app is already written the wrong way.
      - **Defaults, and how to change them.** The ten or so fields an agent actually sets, each
        with its default, its alternatives, and the precedence chain
        (flag > env > profile > top-level > default). Deliberately NOT the exhaustive field
        reference — that belongs in [the JSON Schema](item:pokkum-yaml-json-schema), which an
        agent can validate against rather than merely read, and which cannot drift from the
        parser. The guide links to it and stops.
      - **The composition rule stated once, loudly**: `runtime: node` requires
        `strategy: layered` and a Node-carrying base. `strategy: static` ships no JavaScript
        runtime, so `runtime` is meaningless beside it.
      - **One recipe per deployment target** — Kubernetes (`resolve`/`apply`), Dokploy,
        SwiftWave, and plain registry-pull ("vanilla") — each ending at a verification command
        rather than at the deploy call. The SwiftWave limitation must be stated in the recipe,
        not in a footnote: it cannot be repointed at a new image reference, so the application
        must be pinned to a mutable tag, and `update_image` is rejected for that target. An
        agent that learns this from a rejected API call has already burned a cycle.
      - **The shape of "my app needs another binary" (Typst, pandoc, ffmpeg, ImageMagick).**
        Today the honest answer is that Pokkum builds SvelteKit images and nothing else, and the
        working pattern is a separately built image plus a hand-written manifest — `pokkum
        resolve`/`apply` patch image references by container name, so a sidecar in the operator's
        own manifest survives untouched while the app container's ref is updated. Negative
        knowledge like this is the highest-value content in the guide: agents lose the most time
        on things a tool *almost* does. Revisit when [extra project paths](item:extra-project-paths)
        lands.
      - **Verification recipes.** `pokkum explain why <image> <path>` answers "did my file make
        it in" without starting a container. And when a container is started: exercise it as the
        real runtime UID (`docker run -u 65532`), never `docker exec`, which defaults to root and
        bypasses the `0555` bits via `DAC_OVERRIDE` — a root-shell success proves nothing about
        the process that will actually run.
      - **Escape hatches and when they are lies.** `--no-verify-base`, `--allow-incomplete`,
        `--reveal-secrets`, and loosening `--fail-on`: what each actually turns off, and the
        rule that none of them is a response to a failure whose cause is not yet understood.
      - **Failure taxonomy**: error text → what it means → the next command. Pairs with
        [the exit-code table](item:exit-code-reference).

      Two pointers make it discoverable rather than merely present: one line in the root
      command's long help so it appears in `pokkum --help`, and a README section giving users a
      copy-pasteable snippet to anchor in their own `CLAUDE.md`/`AGENTS.md` — the artifact a
      user actually needs is the snippet, not prose describing what to write.

      Serving the same text as an MCP resource is what makes [pokkum mcp](item:mcp-server) a
      thin layer rather than a second body of knowledge to keep in sync.
    impl:
      - cmd/pokkum/main.go
      - scripts/gen-docs
      - README.md
    related: ["mcp-server", "pokkum-yaml-json-schema", "exit-code-reference", "readonly-app-invariant-undocumented", "paas-deploy-targets"]

  - id: mcp-server
    title: "pokkum mcp — Model Context Protocol server as a second driving adapter"
    stage: backlog
    status: awaiting-decision
    kind: feature
    tier: polish
    summary: "Expose analysis, planning and build as MCP tools plus the guide as an MCP resource, for agents without a shell — deliberately not a one-tool-per-command wrapper."
    problem: |
      An agent in Claude Code, Cursor or a similar harness already has a shell, and for those
      [pokkum guide](item:agent-guide-command) closes most of the gap on its own: the failures
      are knowledge failures, not invocation failures. An MCP server that shells out to
      `pokkum build` for such an agent is a slower `Bash` with a schema in front of it.

      Two things it would genuinely add:

      - **Structure the CLI does not emit.** Chiefly a side-effect-free analysis result — the
        detection [init already runs](item:static-viability-analyzer) and
        [the runtime detection](item:init-runtime-detection), returned as data with per-finding
        `file:line` evidence, without writing `.pokkum.yaml`. There is no `--dry-run` path to
        that today; the analysis only exists as a side effect of a command that writes files.
      - **Reach for agents with no shell** (hosted sandboxes, CI-side assistants). For those MCP
        is not a convenience, it is the only transport.
    options:
      - title: "Do nothing beyond `pokkum guide`"
        description: "Ship the guide, point agents at the CLI, and treat MCP as unnecessary indirection over a tool that is already a good CLI."
        tradeoffs: "Cheapest and possibly correct. Leaves shell-less agents unserved, and leaves the analysis reachable only as a side effect of a writing command."
      - title: "Analysis-only server"
        description: "`pokkum mcp` exposing one read-only `analyze` tool plus the guide and config schema as MCP resources. No build, no deploy, no writes."
        tradeoffs: "Small, safely pre-approvable (no side effects), and delivers the part Bash genuinely cannot. Does not help a shell-less agent actually build."
      - title: "Full intent-level server"
        description: "`analyze`, `plan` (resolved config with provenance, and what a build would produce), `build` (structured result, typed errors carrying a remediation field), `diagnose`."
        tradeoffs: "Serves shell-less agents end to end. Costs a second surface to keep in step with the CLI, and is blocked on json-output-envelope, exit-code-reference and config-view-provenance."
      - title: "One MCP tool per CLI command"
        description: "Mechanical 1:1 mapping of the cobra command tree."
        tradeoffs: "Rejected in drafting. It is a worse shell: same text output, same untyped errors, plus a schema layer and a round trip."
    recommendation: |
      Sequence it behind the prerequisites rather than deciding it now. Ship
      [pokkum guide](item:agent-guide-command) first; it is independently justified and is most
      of the value. Then close the four items that are already open on their own merits and
      happen to be exactly this server's foundation —
      [json-output-envelope](item:json-output-envelope) for `build`/`dev`,
      [exit-code-reference](item:exit-code-reference),
      [pokkum-yaml-json-schema](item:pokkum-yaml-json-schema) and
      [config-view-provenance](item:config-view-provenance). Revisit the server only once a
      shell-less consumer actually exists; building it speculatively repeats the reasoning
      [hooks-system](item:hooks-system) was deferred on.

      If built, two constraints are already settled by this codebase's own shape. It belongs
      **in this binary** as `pokkum mcp` over stdio — not a separate npm package — because the
      zero-dependency Go posture is the product, and an out-of-band package reintroduces exactly
      the version skew that motivates putting the guide in the binary. And architecturally MCP is
      a *driving* adapter over the same core, precisely as the cobra CLI is: it must not become a
      second path into the pipeline with its own semantics, and
      `internal/architecture_test.go`'s boundary rules apply to it unchanged.
    related: ["agent-guide-command", "json-output-envelope", "exit-code-reference", "pokkum-yaml-json-schema", "config-view-provenance", "stable-go-library-api", "hooks-system"]

  - id: readonly-app-invariant-undocumented
    title: "The read-only /app invariant is stated only in a code comment"
    stage: v1.2
    status: open
    kind: dx
    tier: polish
    summary: "Every Pokkum image ships `/app` at mode 0555 with no opt-out, and the only place that says so is a comment in the packager."
    problem: |
      `internal/adapters/packager/layer.go` sets `fileMode = 0o555` and `dirMode = 0o555`
      unconditionally. This is deliberate and correct — nothing in the image writes to the
      application tree — but it is a permanent architectural fact that shapes how an application
      must be written, and it appears in no `--help` text, no README, and no config reference.

      It is discovered as a production 500: an app that shells out to a native tool, or writes a
      cache or a temp file to a project-relative path, builds green and fails at runtime. Found
      exactly that way in a real session (2026-09, a SvelteKit app invoking Typst).

      A second, related trap in the same session: the operator verified the tool worked with
      `docker exec`, which defaults to root and bypasses the `0555` bits via `DAC_OVERRIDE`. The
      "success" said nothing about the non-root UID the app actually runs as.
    recommendation: |
      State it where someone hits it before writing the code, not after: a line in
      [pokkum guide](item:agent-guide-command)'s invariants section, a note in `pokkum build
      --help`, and an entry in `Vocabulary.md`'s runtime section. Pair it with the rule that
      follows from it — runtime writes target the OS temp directory, never a project-relative
      path — and with the verification note that a container must be exercised as its real UID
      (`docker run -u 65532`), not through `docker exec`.
    impl:
      - internal/adapters/packager/layer.go
      - cmd/pokkum/build.go
      - Vocabulary.md
    related: ["agent-guide-command", "extra-project-paths"]

  - id: doctor-effective-adapter-check
    title: "pokkum doctor does not check the effective SvelteKit adapter"
    stage: v1.2
    status: open
    kind: fix
    tier: polish
    summary: "`checkSvelteKitWorkspace` confirms `@sveltejs/kit` is a dependency and stops there — an `adapter-auto` project passes doctor cleanly and fails at build."
    problem: |
      `bunexec` already refuses a build whose `svelte.config.js` does not reference the adapter
      the strategy requires, and the message is a good one: it names `adapter-auto` explicitly,
      says a fresh `sv create` project ships it, and gives the exact `bun add -D` and import to
      write (`internal/adapters/bunexec/compiler.go`, added 2026-08-16).

      `pokkum doctor` knows none of this. `checkSvelteKitWorkspace` (`cmd/pokkum/doctor.go`)
      reads `package.json`, finds `@sveltejs/kit`, and reports "valid SvelteKit project
      detected". So the command whose entire purpose is "tell me what is wrong before I build"
      passes the single most common starting state that cannot build.

      That inverts doctor's contract. The preflight is the safety net; doctor is supposed to be
      the early warning, and here the net catches what the warning missed.
    recommendation: |
      Extend `checkSvelteKitWorkspace` — or add a sibling check — to resolve the effective
      adapter the same way the build preflight does, and report the same remediation text.
      Reuse the preflight's logic rather than restating it, so the two cannot drift into
      disagreeing about what counts as configured.

      A post-build assertion that the adapter actually produced its entrypoint is a *different*
      guard covering a different failure (adapter correctly configured, build silently emitted
      nothing) and is worth considering alongside, but it does not substitute for this one.
    impl:
      - cmd/pokkum/doctor.go
      - internal/adapters/bunexec/compiler.go
    related: ["doctor-preflight", "adopt-codemod", "agent-guide-command"]

  - id: init-prints-resolved-base-refs
    title: "pokkum init names the presets but not what they resolve to"
    stage: backlog
    status: open
    kind: dx
    tier: polish
    summary: "The base-image prompt explains each preset in prose; discovering that `distroless` means `gcr.io/distroless/cc-debian12:nonroot` still requires a separate `pokkum base update`."
    problem: |
      [init-base-image-recommendations](item:init-base-image-recommendations) gave each preset a
      one-line rationale, which fixed the "three bare names" problem. It did not print the
      reference. Anyone who needs the concrete image — building a compatible custom base is the
      obvious case, since the extra binary must match the preset's libc — has to run `pokkum base
      update` to find out.

      The values are already constants (`DistrolessBaseRef`, `ChainguardBaseRef` and the
      Node-carrying equivalent in `internal/ports/baseimage.go`), so this is a formatting change,
      not a lookup.
    recommendation: |
      Append the resolved reference to each preset line in the prompt and to `init --output json`.
      Cheap, and it removes a whole detour for the custom-base case.
    impl:
      - internal/ports/baseimage.go
      - cmd/pokkum/init.go
    related: ["init-base-image-recommendations", "base-flag-custom-reference", "agent-guide-command"]

  - id: dokploy-ambiguous-response-poll
    title: "Dokploy: disambiguate an unrecognised 2xx by polling, instead of failing outright"
    stage: backlog
    status: open
    kind: dx
    tier: polish
    summary: "An HTTP 200 with an empty body is reported as a failed deploy even when the rollout in fact started; a follow-up `application.one` read could tell the two apart without weakening fail-closed."
    problem: |
      `dokployReportsSuccess` (`internal/adapters/deploy/dokploy.go`) accepts `true` and
      `{"result":{"data":true}}` and rejects everything else, including an empty body. The
      reasoning in its doc comment is correct and should not be softened: a 200 carrying a body
      this code cannot identify must not be read as a confirmed mutation, because a reverse proxy
      can produce one.

      The cost is a false negative. Observed twice in one real session (2026-09): Dokploy
      answered 200 with an empty body, `pokkum deploy` reported failure and exited non-zero, and
      the rollout had in fact succeeded both times. The image was already pushed, so the operator
      is left with a non-zero exit that says nothing about the actual state.
    recommendation: |
      Keep the strict classifier as the fast path. On a response that is 2xx but unrecognised —
      and only then — poll `application.one` and decide from the application's observed state.
      Report failure if the poll does not positively confirm a started rollout, so the fail-closed
      contract is preserved: the change converts "unknown" from an assumed failure into a
      question that gets asked, rather than into an assumed success.

      Applies to the unrecognised-2xx case only. A non-2xx status stays a failure with no poll.
    impl:
      - internal/adapters/deploy/dokploy.go
    related: ["paas-deploy-targets", "deploy-check"]
