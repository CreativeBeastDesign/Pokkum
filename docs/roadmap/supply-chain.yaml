      findings: [8]

  - id: pubkey-env-var-divergence
    title: "POKKUM_*_PUBKEY meant two different things"
    stage: v1.1
    status: shipped
    kind: hardening
    tier: foundation
    summary: "The same public-key environment variable was resolved as a file path in one place and as literal PEM in another, so its meaning depended on which code path read it."
    problem: |
      `cmd/pokkum/build.go` resolved `POKKUM_CACHE_PUBKEY` as "try it as a path, and if
      `os.ReadFile` fails treat the string itself as PEM", while every adapter reading the same
      variable — `remotecacheutils`, `provenance`, `baseimage` — did a bare
      `[]byte(os.Getenv(...))` and so accepted literal PEM only. A path therefore worked for
      `pokkum build` and would have been handed to a Cosign verifier verbatim by any other
      construction of those adapters.

      Latent rather than exploitable, because `build.go` populates the request field before the
      adapter fallback is reached — but it is checklist row 41's shape (one input read in
      several places, error handling drifting between them) and the same class as the
      `--sigstore-trusted-root` fail-open fixed alongside it.

      The old shape carried a second, user-visible defect: "try ReadFile, fall back to literal
      on any error" silently turned a mistyped filename into nonsense key bytes, which surfaced
      later as "signature verification failed" — a message that sends the reader hunting for a
      tampered artifact when the real problem is a typo.
    decision: |
      Shipped 2026-08-19. A new shared `keymaterialutils` helper resolves a key setting to PEM
      bytes and is used at all six read sites. It classifies by *content* rather than by whether
      a file happens to exist: anything containing a PEM preamble is literal key material, and
      anything else is a path that must be readable — so a bad path now fails as a bad path,
      wrapping `fs.ErrNotExist` and naming the variable at fault. A readable file with no PEM
      marker is rejected here rather than left to produce an opaque verifier error.

      A set-but-unresolvable candidate fails the chain instead of falling through to the next
      variable: continuing would verify against a different key than the operator named, which
      is the substitution they set the value to prevent.

      Enforced, not just documented: `internal/architecture_test.go`'s
      `TestPublicKeyEnvVarsGoThroughTheSharedResolver` bans the
      `[]byte(os.Getenv("POKKUM_*_PUBKEY"))` shape across every first-party source root, since a
      comment would not have stopped the next bare conversion. The pattern is self-checked
      against a known-bad string so a regex that stopped matching cannot make the test pass by
      vacuity.
    flags: ["--cache-verify-key", "POKKUM_CACHE_PUBKEY", "POKKUM_SIGNING_PUBKEY", "POKKUM_BASE_IMAGE_PUBKEY"]
    impl:
      - internal/adapters/keymaterialutils/keymaterialutils.go
      - cmd/pokkum/build.go
      - internal/adapters/remotecacheutils/remotecacheutils.go
      - internal/adapters/provenance/resolver.go
      - internal/adapters/baseimage/resolver.go
    related: ["remote-cache-verify-key-inheritance", "trusted-root-bytes"]

  - id: secretguard-reports-locations
    title: "Secret-guard findings reported a count with no locations"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "A failing build said how many secrets it found and nothing about where, so the finding could not be acted on."
    problem: |
      `runSecretScan`'s failure was `detected %d hardcoded secret(s) in %s` and nothing more. An
      operator was told their build contained four secrets and given no file, no line, no rule —
      the one thing needed to do anything about it.

      The data was already there and discarded: `ports.SecretMatch` carries `FilePath`,
      `LineNumber`, `RuleName` and `SecretSnippet`. The adjacent skipped-files branch already
      listed paths, so this was an internal inconsistency as much as a gap: an incomplete scan told
      you which files it could not read, while a successful scan that found secrets would not tell
      you which files they were in.

      Reported by a maintainer running a real build and asking where the secrets were.
    decision: |
      Shipped 2026-08-19. Each finding is logged as its own structured line — file, line, rule,
      stage — before the error is returned, and the error points at them.

      **Values are deliberately redacted.** `SecretSnippet` is the matched substring, i.e. the
      secret; echoing it to make the report useful would copy the value into terminal scrollback,
      CI logs and anything scraping build output, which is a poor trade for a tool whose purpose is
      keeping secrets out of places they do not belong. `file:line` plus the rule name is enough to
      act on, and the rule name describes the shape matched without revealing the value. The field
      is emitted as `value=redacted` rather than omitted, so someone wondering why can see it was a
      decision.

      Structured per-finding lines rather than a multi-line error string: slog quotes an error
      value, so embedded newlines reach the terminal as a literal `\n` and the list would read
      worse than the single line it replaced. This was caught by looking at real output rather than
      at the code.

      Listing is capped at 10 with the withheld count reported — a minified bundle is one logical
      line and every rule reports every match on it, so hundreds of findings are possible, and
      silently truncating would understate the problem. The error names
      `--allow-secret-pattern=<regex>` as the escape hatch for a false positive.
    flags: ["--allow-secret-pattern"]
    impl:
      - internal/core/pipeline.go
    related: ["secret-inlining-guard", "exe-secret-scan-gap"]

