  - id: base-image-cve-gate
    title: "Base image CVE build gate"
    status: shipped
    kind: feature
    tier: foundation
    summary: "`pokkum build` actively queries OSV.dev against the locked base digest and can break the build on discovered CVEs by severity threshold."
    flags: ["--fail-on-cve", "POKKUM_FAIL_ON_CVE", "--allow-incomplete"]
    impl:
      - internal/adapters/scanner/adapter.go
      - internal/adapters/baseimage/resolver.go
    limitations:
      - "Fails closed on an incomplete vulnerability database lookup by default (`--allow-incomplete` opts out) rather than silently reporting a clean scan."

  - id: openvex-exemptions
    title: "OpenVEX exemptions for the CVE gate"
    status: shipped
    kind: feature
    tier: foundation
    summary: "`.pokkum.yaml`'s vex_exemptions lets a specific CVE bypass the --fail-on-cve threshold, but only with a real OpenVEX justification code, a mandatory expiry, and a mandatory owner."
    flags: ["--vex-output"]
    impl:
      - internal/core/model.go
      - internal/adapters/vexutils/document.go
    limitations:
      - "An unjustified or already-expired exemption entry is rejected outright at config-parse time, not silently honored — this was flagged externally as a gap (both reviewers named missing VEX support as a top-tier concern) before this shipped."
      - "Diff mode (\"N new vulnerabilities since last build\") from the original CVE-scanning concept remains unbuilt; this item covers exemption consumption only, not vulnerability-diffing."

  - id: toolchain-cve-awareness
    title: "Toolchain (Bun) CVE awareness"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Queries OSV.dev for advisories against the exact embedded Bun version recorded in SLSA provenance, without pulling or scanning any image."
    impl:
      - internal/adapters/scanner/adapter.go
    limitations:
      - "Node-core CVEs remain unqueryable: distroless ships Node outside dpkg, invisible to both the OS-package scanner and the zero-dependency toolchain scanner, which has no Node-core ecosystem entry. Tracked as an open decision — see [Node-core CVE lookup](item:node-cve-lookup)."

  - id: node-cve-lookup
    title: "Node-core CVE lookup for --runtime=node"
    stage: backlog
    status: open
    kind: feature
    tier: foundation
    summary: "Decide whether to add an OSV Node-core ecosystem query path, or document the gap and leave base-image CVE posture to the operator."
    problem: |
      `--runtime=node` targets the `distroless-node` preset, which ships Node outside `dpkg` —
      invisible to both `scannerutils`'s OS-package scanner and the zero-dependency toolchain
      scanner (no Node-core ecosystem entry exists). This is the mirror gap to
      [Toolchain (Bun) CVE awareness](item:toolchain-cve-awareness), which does have a query
      path for Bun.
    options:
      - title: "Add an OSV Node-core ecosystem query path"
        description: "Query OSV.dev's Node-core advisories keyed on the distroless-node preset's pinned Node version."
        tradeoffs: "New ecosystem-specific query logic to maintain; Node-core version isn't always trivially extractable from a distroless image layer."
      - title: "Accept and document the gap"
        description: "State plainly that the base image's own CVE posture is the operator's responsibility for Node-core issues, same as any other opaque base-image content."
        tradeoffs: "No new code, but leaves a real blind spot for anyone relying on `--fail-on-cve` as a complete gate."
    recommendation: ""
    related: ["toolchain-cve-awareness"]

  - id: secret-inlining-guard
    title: "Secret-inlining guard (secretguard)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Regex-based build-time scan over both pre-build source and packaged build output, catching secrets baked in by build-time dependencies as well as the project's own source."
    flags: ["--allow-secret-pattern"]
    impl:
      - internal/adapters/secretguard/guard.go
      - internal/core/pipeline.go
    limitations:
      - "Five fixed regex patterns only (private key headers, AWS access keys, GitHub PATs, Google API keys, generic password/secret/token assignments) — not Shannon-entropy analysis. An entropy-based scan for arbitrary high-randomness strings was the original design language but was never built."
      - "See [--strategy=exe secret-scanning gap](item:exe-secret-scan-gap) for the one strategy this does not cover."
      - "A file too large or unreadable to scan fails the build (ErrSecretScanIncomplete) rather than silently reporting a clean pass."

  - id: chainguard-static-preset
    title: "Dedicated chainguard-static base image preset"
    stage: backlog
    status: open
    kind: hardening
    tier: polish
    summary: "Give --strategy=static its own base-image preset so it stops sharing a pokkum.lock slot with an explicit chainguard glibc-dynamic --base build."
    problem: |
      `--strategy=static`'s default base reuses the `BaseImageChainguard` preset — correct for
      signature identity (fixed from an earlier `BaseImageDistroless` misassignment that broke
      verification on every default `--static` build) — but this leaves a narrow `pokkum.lock`
      collision: an explicit `--base cgr.dev/chainguard/glibc-dynamic` build and a `--static`
      build in the same project share one lock slot, the same class of problem
      [the custom-base lock-slot decision](item:custom-base-lock-slot) addresses for custom refs.
    options:
      - title: "Add a dedicated BaseImageChainguardStatic preset"
        description: "Own default ref, own lock key — eliminates the collision entirely, mirroring how distroless-node got its own preset."
        tradeoffs: "One new CLI-visible preset name, plus a self-healing orphaned-lockfile-entry migration note for existing --static users."
    recommendation: "Add a dedicated BaseImageChainguardStatic preset — small, well-precedented change."
    decision: |
      Deferred 2026-08-19, deliberately left in `backlog` rather than promoted to a numbered
      stage: unscheduled is the honest status, and v1.1/v1.2/v2.0 would each imply a commitment
      that has not been made.

      What changed is that this stopped being a user-visible defect. `pokkum init`'s prompt used
      to offer `chainguard-static` as base-image option 3, so anyone picking it got a
      `.pokkum.yaml` that `pokkum build` refused — the preset was advertised before it existed.
      That prompt now lists only the presets that are real (`distroless`, `chainguard`,
      `distroless-node`), so the gap is no longer reachable by accident; see
      [pokkum init wrote a config pokkum build refused](item:init-generates-invalid-config).

      What remains is the original narrow issue only: an explicit
      `--base cgr.dev/chainguard/glibc-dynamic` build and a `--strategy=static` build in the
      same project still share one `pokkum.lock` slot. That is a stable-pin annoyance rather
      than a correctness hole — the identity guard shipped with the per-ref lock work means
      neither build can be served the other's image content.
    related: ["custom-base-lock-slot", "init-generates-invalid-config"]

  - id: verify-base-on-cache-hit
    title: "Verify base image on cache hit"
    stage: backlog
    status: open
    kind: hardening
    tier: polish
    summary: "Opt-in flag to re-verify the base image's signature even on a confirmed remote-cache hit, for audit environments that need a uniform verified-base guarantee."
    problem: |
      A confirmed remote-cache hit deliberately skips base-image signature verification —
      nothing is built from the base image on a hit, and the composite cache key already binds
      the base image's pinned digest, so a hit can only match the exact base the verifier would
      have checked. This is disclosed via an explicit audit log line, but it leaves one narrow
      case unclosed: a base whose pinned digest still matches (so cache hits keep firing) but
      whose signature was later revoked, rekeyed, or withdrawn upstream — only re-running
      verification would notice that.
    options:
      - title: "Add --verify-base-on-cache-hit"
        description: "When set and a cache hit is confirmed, run VerifyBaseImage (the base check, not the cache-output check) before accepting the hit."
        tradeoffs: "Structurally independent of --cache-verify (which authenticates the cache-hit output image, not the base) — the two must not be coupled. One extra Cosign/keyless verify per cache hit; opt-in so the fast path stays fast by default."
    recommendation: ""
    flags: ["--verify-base-on-cache-hit"]

  - id: remote-cache-verify-key-inheritance
    title: "Remote-cache verify key should inherit the signing key"
    stage: backlog
    status: shipped
    kind: hardening
    tier: foundation
    summary: "A build signed via --signing-key alone doesn't automatically make its own remote-cache entries verifiable, since the cache-verify key chain never reads the signing public key."
    problem: |
      The cache-verify key chain (`--cache-verify-key`/`POKKUM_CACHE_PUBKEY`/`POKKUM_SIGNING_PUBKEY`/
      `POKKUM_BASE_IMAGE_PUBKEY`) never reads `req.Signing.PublicKeyPEM` — `internal/core/pipeline.go`'s
      `RemoteCache.Check` call doesn't populate it. The practical outcome today is fail-safe (falls
      through to a full rebuild) rather than fail-fast with a clear story, but it means two keys
      need configuring for full cache-verification acceleration when one might reasonably be
      expected to suffice.
    options:
      - title: "Auto-populate from the signing key"
        description: "When no POKKUM_CACHE_PUBKEY/POKKUM_SIGNING_PUBKEY is explicitly set, fall back to the signing key configured via --signing-key."
        tradeoffs: "Convenient default, but conflates two keys that may legitimately want to differ (signing vs. cache-verification trust)."
      - title: "Leave separate, document the burden"
        description: "Keep the two key chains independent and clearly document that full cache-verification acceleration needs its own key configured."
        tradeoffs: "No implicit trust-chain surprises, but a real ergonomic gap for the common case where one key would suffice."
    recommendation: ""
    decision: |
      Option A, shipped 2026-08-19. The derived key is offered as a dedicated
      last-resort chain entry (`RemoteCacheVerifyOptions.SigningPublicKeyPEM`), not by
      writing `PublicKeyPEM` from core — that field is the *first* link, and the three
      `POKKUM_*_PUBKEY` links are resolved afterwards inside `remotecacheutils`, so
      populating it from core would have pre-empted three explicit sources and forked the
      precedence chain into two copies free to drift. Precedence therefore stays in exactly
      one place, and every explicit source still wins.

      Why this narrows rather than widens trust, verified against the code and not assumed:
      the static-key arm accepts a candidate only when its signature verifies against the
      single key handed to it, and keyless-vs-static mode selection keys on
      `KeylessIdentity` alone, so no key field can flip the mode. Falling back to the
      operator's own signing public key therefore means "accept only cache entries I signed
      myself", against a status quo of no key at all and every candidate refused. A test
      proves an entry signed by a different key still fails closed.

      Logged once per check rather than silently: an implicitly derived trust anchor nobody
      is told about is the shape checklist rows 38/41 warn about.
    impl:
      - internal/ports/cache.go
      - internal/core/pipeline.go
      - internal/adapters/remotecacheutils/remotecacheutils.go

  - id: composition-root-verifier-injection
    title: "Composition-root refactor for verifier injection"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "cmd/pokkum now injects verifiers at every construction site instead of adapters building their own defaults, closing an empty-by-construction adapter-to-adapter import allowlist."
    impl:
