    title: "Base image lockfile (pokkum.lock) and audit (pokkum base check)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "pokkum.lock pins base image digests across multi-platform indexes and tracks scan metadata; pokkum base check audits that state without touching the network."
    flags: ["pokkum base check", "pokkum base update"]
    impl:
      - internal/adapters/lockfileutils/lockfile.go
      - cmd/pokkum/base.go
    limitations:
      - "Every custom `--base` reference currently shares one lockfile slot rather than getting its own — see [Per-ref pokkum.lock slot for custom --base images](item:custom-base-lock-slot)."
    related: ["custom-base-lock-slot", "base-image-cve-gate"]

  - id: base-image-escrow-mirroring
    title: "Base image escrow / mirroring"
    status: shipped
    kind: feature
    tier: foundation
    summary: "`--mirror-registry` mirrors upstream base images and signatures to a project-controlled registry, with pulled bytes verified against pokkum.lock's pinned digest."
    flags: ["--mirror-registry"]
