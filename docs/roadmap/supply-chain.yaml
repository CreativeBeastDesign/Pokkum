area: "Supply Chain & Attestation"
items:
  - id: image-signing
    title: "Image signing with Cosign/DSSE"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Builds are signed via Cosign static-key or DSSE, with a fetch-back-and-reverify step before the build is allowed to report `Signed: true`."
    flags: ["--sign", "--signing-key", "POKKUM_SIGNING_KEY", "--require-signed"]
    impl:
      - internal/adapters/cosign/signer.go
      - internal/core/pipeline.go
    limitations:
      - "The placeholder trust-anchor fallback was removed; an unconfigured key now hard-fails instead of silently no-op signing (a breaking change for anyone who relied on the old default)."
      - "Static-key signing only — there is no keyless (Fulcio/OIDC) signing path. Keyless Sigstore exists only on the verification side (base images, `pokkum verify`)."
    evidence:
      commits: ["2f03609"]
      findings: [14]

  - id: kms-signing
    title: "KMS-backed signing"
    stage: v1.2
    status: open
    kind: feature
    tier: foundation
    summary: "Sign builds using a cloud KMS key instead of a local static key file."
    problem: |
      Static-key signing (see [Image signing with Cosign/DSSE](item:image-signing)) requires
      operators to manage a private key file directly, which is a poor fit for teams already
      using AWS KMS, GCP KMS, or HashiCorp Vault for key custody.
    options:
      - title: "Pluggable KMS signer interface"
        description: "Add a ports.KMSSigner interface with AWS/GCP/Vault adapters, following the existing ports.CosignSigner shape."
        tradeoffs: "More adapters to maintain long-term; each cloud SDK adds dependency weight the zero-dependency invariant has to account for."
      - title: "Delegate to cosign's built-in KMS support"
        description: "Shell out to `cosign sign --key awskms://...` for the KMS case instead of implementing our own client."
        tradeoffs: "Much less code to write, but couples pokkum to the cosign CLI being installed on PATH — directly contradicts the zero-dependency invariant."
    recommendation: "Pluggable KMS signer interface, using each cloud's lightweight signing API directly rather than shelling out, to stay dependency-free."
    flags: ["--signing-key"]
    related: ["image-signing"]

  - id: ci-oidc-identity
    title: "CI OIDC identity for provenance"
    stage: v1.2
    status: open
    kind: feature
    tier: foundation
    summary: "Bind SLSA provenance to an issuer-attested CI OIDC identity instead of a self-asserted one from a developer laptop."
    problem: |
      Provenance generated by the CLI on a developer laptop is SLSA L1/L2 in substance regardless
      of what the attestation claims, since nothing external attests to the build environment.
      First-class GitHub Actions / GitLab / Buildkite OIDC would make the certificate identity
      issuer-attested rather than self-asserted, and state the build environment explicitly in
      the attestation. This is what actually separates a real SLSA L3 claim from an asserted one.
    options:
      - title: "Read the platform's OIDC token directly"
        description: "Detect GitHub Actions/GitLab CI/Buildkite env vars, fetch the platform's own OIDC token, and fold the resulting identity into the SLSA statement's builder.id."
        tradeoffs: "No new external dependency, but three platform-specific code paths to maintain and keep current as each platform's token format evolves."
      - title: "Delegate to Sigstore's existing Fulcio/OIDC flow"
        description: "Reuse the same Fulcio certificate-issuance flow already vendored for keyless base-image verification, pointed at signing instead."
        tradeoffs: "Less new code, but ties CI-identity binding to Sigstore's keyless *signing* path landing first (see [KMS-backed signing](item:kms-signing) is a separate axis, not a prerequisite)."
    recommendation: ""
    related: ["image-signing"]

  - id: sigstore-tuf-refresh
    title: "Sigstore TUF trust-root refresh"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "The embedded Sigstore trust root is regenerated from a TUF-verified fetch and can refresh live; a nightly CI job now catches it silently rotting again."
    flags: ["--sigstore-tuf-refresh", "--sigstore-trusted-root", "--hermetic"]
    impl:
      - internal/adapters/sigstore/tufrefresh.go
      - internal/adapters/sigstore/trustedroot.go
      - internal/adapters/sigstore/trustedroot_freshness.go
    limitations:
      - "The embedded snapshot was not merely stale when found — it was already actively rejecting valid signatures on the `log2025-1` Rekor shard (live since 2025-09-23) as forgeries, indistinguishable from a real attack from the verifier's own error text."
      - "`--sigstore-tuf-refresh`'s `Offline` mode is bound to `--hermetic` on `pokkum build`; `pokkum verify` has no hermetic concept, so it always allows the refresh attempt and falls back to the embedded snapshot with a warning on failure."
      - "An explicit `--sigstore-trusted-root` always wins and skips the refresh branch entirely; `pokkum base update`/`base check` never set `VerifySignature`, so the flag is deliberately absent there."
    evidence:
      commits: ["9188d56", "eeaa83a", "a86baa3"]
      findings: [10]

  - id: embedded-pid1-attestation-coverage
    title: "Embedded PID-1 binaries brought under CI attestation"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "pokkum-init and pokkum-static are now built by CI/releases and freshness-checked, closing the gap where every image's PID 1 was a developer-laptop binary outside the attested pipeline."
    impl:
      - internal/adapters/staticserver/blob_freshness_test.go
      - Makefile
    limitations:
      - "The two embedded blobs are gitignored build artifacts (only `.gitkeep` is tracked), so `make check-embedded-blobs` guards local working-tree staleness specifically — CI itself is structurally safe since it always rebuilds both blobs from the checked-out commit before any test runs."
      - "This closes the gap described in the finding, not a hypothetical: for a supply-chain tool, the one component that had been running as PID 1 in every produced image, outside the CLI's own SLSA-attested build, was the sharpest edge found during that run."
    evidence:
      commits: ["5693980", "a86baa3", "81a6fb6"]
      findings: [6]

  - id: multi-arch-attestation-subject
    title: "Multi-arch signature/attestation subject (dual-publish)"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Signatures and attestations attach to both the image index and every per-platform manifest digest, so any verifier agrees regardless of which digest it targets."
    impl:
      - internal/core/pipeline.go
      - internal/adapters/cosign/signer.go
    limitations:
      - "Interop with `cosign verify-attestation` in tag-fallback mode required a follow-up fix (see [cosign verify-attestation interop fix](item:cosign-attestation-interop)) — dual-publish alone did not guarantee third-party tool agreement."
    evidence:
      commits: ["2f03609"]

  - id: cosign-attestation-interop
    title: "cosign verify-attestation interop fix"
    status: shipped
    kind: fix
    tier: foundation
    summary: "Fixed a missing annotation key that made real cosign v3 reject Pokkum's own valid DSSE attestations in tag-fallback mode."
    impl:
      - internal/adapters/cosign/signer.go
    limitations:
      - "The bug was an interop assumption about cosign's own wire format encoded in a code comment and never checked against cosign's actual source — the attestation layer now writes `dev.cosignproject.cosign/signature: \"\"` to match cosign's convention exactly."
    evidence:
      commits: ["e918c52"]
      findings: [14]

  - id: native-addon-provenance
    title: "Native addon (.node binary) provenance"
    stage: backlog
    status: open
    kind: feature
    tier: foundation
    summary: "Hash and record prebuilt native addon binaries in provenance instead of leaving them outside the SBOM/SLSA story entirely."
    problem: |
      Packages like `sharp` and `better-sqlite3` ship prebuilt `.node` binaries fetched outside
      the npm tarball integrity model; Syft will not meaningfully catalog them, and Pokkum's own
      `nativeinspect`/`striputils` adapters currently strip their symbols for size but do not hash
      or attest them. Verified against the code: neither package computes a digest or records
      anything into provenance — this is the one class of build artifact the existing SBOM/SLSA
      story genuinely cannot see, not partially covered.
    options:
      - title: "Hash at strip time, fold into SLSA resolvedDependencies"
        description: "Compute a SHA-256 for each discovered .node/.so during the existing nativeinspect walk and add it as a ResourceDescriptor, flagging any addon whose bytes aren't covered by a lockfile tarball."
        tradeoffs: "Small, additive change reusing an existing file walk; doesn't address why the addon bypassed the integrity model in the first place."
    recommendation: ""
    impl:
      - internal/adapters/nativeinspect/closured.go
      - internal/adapters/striputils/striputils.go

  - id: lifecycle-script-provenance
    title: "Lifecycle-script execution provenance"
    stage: backlog
    status: open
    kind: feature
    tier: foundation
    summary: "Record which packages actually ran install-time lifecycle scripts during the build as a provenance field."
    problem: |
      Bun blocks `postinstall` for untrusted dependencies and requires `trustedDependencies`, but
      Pokkum does not currently emit which packages ran lifecycle scripts during a given build.
      Verified against the code: `trustedDependencies`/`postinstall` only appear as an example in
      a hermetic-sandbox doc comment (`internal/adapters/bunexec/hermetic_linux.go`), not as
      anything recorded into the SLSA statement. This would be a cheap provenance field nobody
      else publishes, answering "what build-time code actually ran" directly.
    options:
      - title: "Parse Bun's lifecycle-script log into a resolvedDependencies annotation"
        description: "Capture which packages Bun actually ran scripts for during install and add them as named entries in the SLSA statement."
        tradeoffs: "Depends on Bun's install output being stable enough to parse reliably across versions."
    recommendation: ""
    impl:
      - internal/adapters/bunexec/hermetic_linux.go

  - id: build-environment-capture
    title: "Build-environment capture (Go + SvelteKit versions)"
    stage: v1.1
    status: open
    kind: feature
    tier: foundation
    summary: "Round out toolchain provenance by also recording the SvelteKit version used, alongside Go and Bun which are already captured."
    problem: |
      Verified against the code, this item is half-done, not fully open as the original roadmap
      framing implied: the Go toolchain version IS already recorded end-to-end
      (`runtime.Version()` flows through `ports.SLSAToolchain.GoVersion` into a
      `pkg:generic/go@<version>` resolvedDependency in `internal/adapters/slsa/generator.go`).
      What is genuinely missing is the resolved `@sveltejs/kit` version: it is tracked as
      `ports.PreflightResult.SvelteKitVersion` and surfaces in build logs
      (`internal/core/pipeline.go`), but `ports.SLSAToolchain` has no field for it and the SLSA
      generator never emits it as a resolvedDependency, unlike Bun and Go.
    options:
      - title: "Add SvelteKitVersion to SLSAToolchain"
        description: "Thread the already-resolved PreflightResult.SvelteKitVersion into ports.SLSAToolchain and emit it as a pkg:npm/@sveltejs/kit@<version> resolvedDependency, mirroring the existing Go/Bun entries."
        tradeoffs: "Small, mechanical addition — the value is already resolved elsewhere, this is purely wiring."
    recommendation: "Add SvelteKitVersion to SLSAToolchain — the value already exists, this closes a real but narrow gap."
    impl:
      - internal/adapters/slsa/generator.go
      - internal/core/pipeline.go
      - internal/ports/supplychain.go

  - id: placeholder-pubkey-fallback-removed
    title: "Remove shared placeholder trust-anchor fallback"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "Deleted the single hardcoded placeholder public key that silently backstopped signing, base-image, and remote-cache verification when no key was configured."
    impl:
      - internal/adapters/cosign/signer.go
      - internal/adapters/baseimage/resolver.go
    limitations:
      - "Breaking change: static-key verification now requires an explicitly configured key rather than silently trusting an undocumented shared fallback that nobody's private key ever matched."
      - "The fallback removal exposed two latent fail-opens in `internal/adapters/provenance/resolver.go` (a nil-tolerant signer check and a bare `false` for a nil DSSE signer) — both now refuse via `ErrVerifierNotInjected` instead of silently skipping verification."
    evidence:
      commits: ["a149b28"]
      findings: [8]

  - id: exe-secret-scan-gap
    title: "`--strategy=exe` secret-scanning gap"
    stage: backlog
    status: shipped
    kind: hardening
    tier: foundation
    summary: "The compiled exe strategy's single binary output has no post-build secret scan, unlike layered/static/asset-overlay."
    problem: |
      `secretguard`'s post-build scan (`internal/core/pipeline.go`'s `runSecretScan`, added
      2026-08-18) covers `layered`/`static`/asset-overlay output directories, but a compiled
      `--strategy=exe` binary is opaque to text scanning — only its pre-compile input tree is
      covered. This is a documented, verified gap, not an implied-covered one.
    options:
      - title: "Scan the compiled binary directly"
        description: "Extend secretguard to look for the same fixed patterns inside a binary's readable string sections."
        tradeoffs: "Harder — binaries aren't line-oriented text, and compiled string constants may be transformed or split by the compiler, risking both false negatives and noisy false positives."
      - title: "Scan exe's pre-compile intermediate output more thoroughly"
        description: "Treat exe the same as layered/static by scanning its bundled JS output before `bun build --compile` runs, closing the gap at the same stage the other strategies are covered."
        tradeoffs: "Cheaper and reuses the existing text-scan path, but a secret injected by the compile step itself (rather than present in JS source) would still be missed."
    recommendation: ""
    decision: |
      Option B in spirit, shipped 2026-08-19 — but implementing it corrected this item's own
      premise. `postBuildScanDirs` already returned `[outputDir]` for `StrategyExe`, so exe's
      pre-compile tree was never the uncovered surface.

      The genuinely unscanned surface was the compile entrypoint's own directory when it sits
      outside `prep.OutputDir`. With `--telemetry`, `PrepareVirtualTelemetryEntry` rewrites
      `EntrypointPath` to `<projectDir>/.pokkum/telemetry-entry.ts` and generates
      `.pokkum/otel-bootstrap.ts`, both bundled into the binary by `bun build --compile`.
      Neither was scanned at either stage: they are written by `Prepare`, so they do not exist
      at the pre-build scan, and `secretguard.ScanDirectory` hard-skips `.pokkum` and
      `.svelte-kit` subdirectories — though only when `rel != "."`, which is why handing them
      in as a scan *root* works. `postBuildScanDirs` now takes the entrypoint path and returns
      both trees, deduped, with an unresolvable path resolving to "scan it".

      Scanning the compiled binary's string sections was rejected: not line-oriented,
      size-unbounded, and compiled constants can be transformed or split, risking both false
      negatives and the noisy false positives that get a scanner switched off entirely.
    limitations:
      - "exe is **not** at parity with layered/static: a secret injected by the `bun build --compile` step itself — a `bunfig.toml` preload plugin, a `with { type: \"macro\" }` import — is present in neither scanned tree."
      - "Covered by unit-level tests through real `core.Build` with the real secretguard adapter, but not yet by a real `bun build --compile` run; that empirical test class has caught nearly every severe bug in Lessons.md and remains the highest-value follow-up here."
    related: ["secret-inlining-guard"]
    impl:
      - internal/adapters/secretguard/guard.go
      - internal/core/pipeline.go

  - id: expect-source-verified
    title: "`--expect-source` requires verified provenance"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "`--expect-source` now refuses to compare against unsigned source annotations unless the caller opts into the explicitly-marked-unverified escape hatch."
    flags: ["--expect-source", "--allow-unverified-source"]
    impl:
      - internal/adapters/provenance/resolver.go
      - internal/adapters/slsa/generator.go
    limitations:
      - "Breaking change: CI using `--expect-source` on unsigned images now fails until it signs or passes `--allow-unverified-source`."
    evidence:
      commits: ["91dc3cd"]
      findings: [1]

  - id: custom-base-lock-slot
    title: "Per-ref pokkum.lock slot for custom --base images"
    stage: v1.1
    status: shipped
    kind: hardening
    tier: foundation
    summary: "Give every custom --base reference its own pokkum.lock slot instead of sharing one, since two custom bases in a project still evict each other today."
    problem: |
      Every custom `--base` reference locks under the single literal key `"custom"`
      (`lockKey = string(req.Preset)` in `internal/adapters/baseimage/resolver.go`). The
      dangerous half of this — silently returning a *different* base image's content than the
      one requested — was already fixed narrowly in `69914ac`: a `"custom"`-keyed entry is now
      only trusted when its recorded `Ref`/`Digest` match the current request. What remains is
      that two custom bases in one project still share that one slot, so neither gets a stable
      pin across builds; the second custom ref's resolve always evicts the first's lockfile
      entry rather than getting its own.
    options:
      - title: "Give each custom ref its own slot"
        description: "Key custom entries as `\"custom:\" + sha256(ref)[:12]`, mirroring why `distroless-node` became its own preset (`f5229c3`) for exactly this reason."
        tradeoffs: "Needs a `pokkum.lock` migration story for existing lockfiles with a bare `\"custom\"` entry, which is why it wasn't rushed into the CLI-reachability fix."
      - title: "Keep the current narrow guard indefinitely"
        description: "Leave the ref/digest match check as the permanent mitigation; accept that multiple custom bases in one project never get independent stable pins."
        tradeoffs: "Zero migration risk, but the underlying correctness gap (two custom bases can't coexist with cached pins) stays open indefinitely."
    recommendation: ""
    decision: |
      Option A, shipped 2026-08-19. Custom entries key as `custom:<sha256(normalized ref)[:12]>`;
      the fixed presets keep their historical keys untouched. The `Ref`/`Digest` identity guard
      from `69914ac` is kept on top of the new keying rather than deleted as redundant — a
      truncated hash can collide, and `pokkum.lock` is a hand-editable plain file.

      Migration, which was the hard part: lookup tries the per-ref key first and falls back to a
      legacy bare `"custom"` entry only when its recorded ref matches the request; writes always
      use the new key. The legacy entry is copied verbatim and deleted only when it was the entry
      just consumed for this ref, so nothing is lost and no duplicate is stranded to diverge on
      the next `--update-base`; a legacy entry belonging to a different ref is never touched,
      since it is still that ref's only pin. The copy is written early rather than through the
      normal write path, or an escrow-mirror resolve would record the mirror's pinned ref as the
      upstream pin and a legacy entry that resolves cleanly would never migrate at all.

      Widening the key was a caller-chain change that compiled silently: `RecordScanResult(preset)`
      could no longer name a custom entry and would have returned nil having recorded nothing, and
      `pokkum base check` parsed each slot name as a preset, so every `custom:<hash>` slot would
      have vanished from its output. Both fixed.

      Behaviour change: the first build after upgrading rewrites `pokkum.lock` once to migrate a
      bare `"custom"` entry, so the lockfile hash recorded in SLSA `resolvedDependencies` changes
      that once. No image bytes depend on it.
    flags: ["--base"]
    impl:
      - internal/adapters/baseimage/resolver.go
      - internal/adapters/lockfileutils/lockfile.go
      - cmd/pokkum/base.go
    evidence:
      commits: ["69914ac"]
      findings: [16]

  - id: trusted-root-bytes
    title: "TrustedRootPath should take bytes, not a file path"
    stage: v1.1
    status: shipped
    kind: hardening
    tier: foundation
    summary: "Change the base-image trusted-root field from a file path to bytes so all three Sigstore trust-root consumers take the same shape."
    problem: |
      `--sigstore-tuf-refresh` (`eeaa83a`) feeds two trusted-root consumers with bytes
      (`sigstore.Verifier`'s `trustedRootJSON` and the TUF refresh option), but a third,
      `ports.BaseImageRequest.TrustedRootPath` (`internal/ports/baseimage.go` ~line 332), takes a
      file *path* instead, read via `os.ReadFile` in `internal/adapters/baseimage/resolver.go`
      (~line 931). It was found and deliberately left alone while wiring the refresh flag —
      called out in that commit message as "a bigger call than belongs in this change."
    options:
      - title: "Bridge with an internal temp-file write"
        description: "When bytes arrive from elsewhere (e.g. a live TUF refresh), write them to a temp file and hand baseimage its expected path."
        tradeoffs: "Extra indirection, and raises a real question of where that temp file should live relative to the hermetic sandbox — exactly the complication that made this a deliberate non-decision at the time."
      - title: "Change TrustedRootPath to bytes"
        description: "Change `ports.BaseImageRequest.TrustedRootPath` to a byte slice and have the CLI/caller read the file itself, matching the other two consumers."
        tradeoffs: "One field-shape change plus updating its single caller; makes all three trust-root consumers structurally consistent going forward."
    recommendation: ""
    decision: |
      Option B, shipped 2026-08-19. `TrustedRootPath string` became `TrustedRootJSON []byte`; the
      single `os.ReadFile` moved to the composition root in `cmd/pokkum/build.go`, so no adapter
      touches the filesystem for this and both consumers provably verify against the same bytes.
      `core.ErrBaseSignatureInvalid` is still wrapped, so existing `errors.Is` checks match.

      Implementing it exposed a pre-existing fail-open on the same lines: the flag was read a
      *second* time for `req.CacheVerify.TrustedRootJSON` as `if data, err := os.ReadFile(...);
      err == nil`, so an unreadable or mistyped path silently left the field empty — which every
      consumer reads as "use the embedded public-good root". An operator running a private
      Sigstore deployment had cache signatures checked against the public-good root with no
      warning, no log, and exit 0. `pokkum verify` already had the correct shape, with a comment
      explaining why. The single shared read fixes it.

      Behaviour change, deliberate: an unreadable `--sigstore-trusted-root` now fails the build up
      front rather than only when keyless base verification happens to run, so `--no-verify-base`
      no longer tolerates it.
    impl:
      - internal/ports/baseimage.go
      - internal/adapters/baseimage/resolver.go
      - cmd/pokkum/build.go

  - id: base-image-signature-verification
    title: "Base image signature verification"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Stock base presets are verified via keyless Sigstore by default; custom bases via static-key Cosign, completing the chain of custody Pokkum already applies to its own outputs."
    flags: ["--base-verify-mode", "--base-verify-key"]
    impl:
      - internal/adapters/baseimage/resolver.go
      - internal/adapters/sigstore/verifier.go
    limitations:
      - "Keyless verification requires the operator to supply `--keyless-identity`/`--keyless-issuer` explicitly and refuses outright before any network I/O if keyless material is present with no configured identity — it does not trust anything derived from the certificate under verification (a prior version did, and that path was dead code)."
    evidence:
      commits: ["efc1743"]

