area: "Build & Packaging"
items:
  # ---------------------------------------------------------------------
  # Shipped — core compilation & packaging (Feature-list.md "Core
  # Compilation & Container Packaging")
  # ---------------------------------------------------------------------

  - id: vendor-production-dependencies
    title: "Ship production dependencies so images are self-contained"
    status: shipped
    kind: fix
    tier: foundation
    summary: "Layered images shipped the server bundle without its dependencies; Bun's runtime auto-install silently fetched them from npm inside the running container."
    problem: |
      Vite externalises dependencies during the SSR build, so adapter-node output keeps bare
      imports and expects a node_modules tree beside it — its documented deployment model is
      "ship build/ AND production node_modules". Pokkum shipped only the first half.

      On Bun the gap was masked rather than visible: the runtime auto-install fetched missing
      packages from the public npm registry into the running container, so the app appeared to
      work while executing code that is in neither the image, the SBOM, the signature nor the
      provenance. Under `pokkum resolve`'s own `readOnlyRootFilesystem` the write failed and
      the pod crash-looped after reporting a successful rollout; and because the default
      NetworkPolicy permits TCP 443, the fetch succeeds in-cluster until an operator tightens
      egress, at which point a working deployment breaks with no change to the image. On Node,
      which has no auto-install, any route touching an externalised dependency simply 500s.
    decision: |
      Shipped 2026-08-21, found by an adversarial field test against a real application.

      `Prepare` installs the project's production dependencies into a staging tree under
      `.pokkum/` (never touching the user's own tree) and the packager mounts it at
      **/app/node_modules**. The path is load-bearing: Node and Bun resolve a bare import by
      walking upward from the importing file, so `/app/server/index.js` finds
      `/app/node_modules` and never `/app/vendor` — which is where the pre-existing vendor
      layer pointed, and which is why populating that layer would not have worked. That layer
      turned out to be dead wiring: the pipeline pointed it at `<output>/vendor` and nothing
      ever created the directory.

      A missing lockfile warns rather than refusing. Making it an error was the first cut and
      was over-reach: it turned a reproducibility preference into a gate on building at all
      and refused every project without a lockfile, including three of the repo's own
      fixtures. With a lockfile the install uses `--frozen-lockfile`, so versions are exactly
      what is pinned; hermetic builds add `--offline` and fail with a warm-the-cache hint
      rather than silently shipping an image without its dependencies.

      The image entrypoint now also passes Bun's `--no-install`, so a remaining gap fails
      loudly at startup instead of being papered over by a network fetch. Verified in both
      directions: an `await import("valibot")` in an empty project resolves by downloading the
      package at runtime, and the same import under `--no-install` fails with "Cannot find
      package".
    limitations:
      - "Build-time detection of a dependency that will be missing at runtime is **not** solved — see [Detect dependencies that will be missing at runtime](item:unresolved-import-guard). A static-analysis attempt was reverted for failing correctly-configured builds."
      - "`--runtime=node` images benefit automatically (they previously had no dependency store at all), but that combination has not been re-tested end to end against a real application since the fix."
    impl:
      - internal/adapters/bunexec/vendor_install.go
      - internal/adapters/packager/packager.go
      - internal/ports/packager.go

  - id: unresolved-import-guard
    title: "Detect dependencies that will be missing at runtime"
    status: open
    kind: hardening
    tier: polish
    summary: "A build-time check that every externalised bare import resolves inside the image — attempted with static analysis, which proved unsound; needs the bundler's own externals list."
    problem: |
      [Ship production dependencies so images are self-contained](item:vendor-production-dependencies)
      fixes the images built today. Nothing yet catches the next time something falls out of
      the tree, and the failure it would cause is invisible until a request arrives in
      production: the container starts, both probes pass, and the first route touching the
      missing package 500s.

      A static-analysis version was written and **reverted**, because it failed real,
      correctly-configured builds. Recording why, so it is not attempted the same way twice:

      - **Type-only imports survive as text.** The adapter-node fixture's built server
        contains `from 'types'` eleven times — a type import erased at runtime, naming a
        package that does not exist. A regex over the bundle cannot tell it from a real one.
      - **adapter-node bundles most dependencies.** The fixture declares zero production
        dependencies, its built output still contains bare imports for `svelte`,
        `@sveltejs/kit`, `polka`, `sirv` and `cookie`, and its image boots and serves traffic
        (`TestRuntimeSmoke_LayeredStrategy_BootsAndServes`). The remaining specifiers are
        artifacts of bundling, not runtime requirements.

      So "appears as a bare import in the output" does not imply "must resolve at runtime",
      and a guard that fails a working build is worse than the bug it guards.
    options:
      - title: "Read the bundler's own externals list"
        description: "Vite/Rollup knows exactly which modules it externalised. Capture that during the build (a metafile, or an explicit ssr.external configuration Pokkum sets) and check only those specifiers against the staged tree."
        tradeoffs: "Exact rather than heuristic, and cheap at build time — but requires reaching into the build's own output format, which differs across Vite versions and is not a stable contract."
      - title: "Verify empirically at build time"
        description: "After building, start the produced server with Bun's --no-install in the staged environment and confirm it reaches a listening state."
        tradeoffs: "Authoritative — it is what actually happens in production — but slow, needs a free port, and turns every build into a partial smoke test."
      - title: "Rely on the runtime check already in place"
        description: "The image entrypoint passes --no-install, so a missing dependency now fails loudly at startup instead of being silently fetched from npm."
        tradeoffs: "Zero cost and already shipped, but the failure surfaces at deploy time rather than build time — better than production, worse than CI."
    recommendation: |
      First option. The bundler is the only component that actually knows which specifiers it
      externalised, and every heuristic that does not consult it will keep mistaking type
      imports and bundled-away packages for real dependencies.

      Until then the third option is genuinely load-bearing rather than a placeholder: with
      `--no-install` in the entrypoint, a gap fails at container start with "Cannot find
      package", which is loud, immediate and honest — the property that was missing when Bun
      silently downloaded the difference from npm.
    related: ["route-exclusion-filter"]

  - id: route-exclusion-filter
    title: "Exclude routes from the production build"
    status: open
    kind: feature
    tier: moat
    summary: "Dev-only routes are bundle entry points, so tree-shaking cannot remove them; a build-time filter would keep them out of the image entirely."
    problem: |
      A project with dev-only routes — `/dev/style-guide`, a component gallery, a fixtures
      browser — ships them to production. They are `+page.svelte` files, which makes them
      bundle **entry points**, and no amount of tree-shaking removes an entry point:
      reachability is its definition. Everything they import ships with them, and a style
      guide typically imports the entire component library on purpose, so it can be one of
      the largest things in the image.

      SvelteKit offers no way to exclude them. Checked against kit 2.70.2's
      `src/core/config/options.js`: there is `moduleExtensions` and `files.*`, and nothing
      that drops routes. The community answer is a runtime guard — a `+layout.server.ts`
      that throws 404 unless `dev` — which controls *access* while leaving the code, its
      imports, and its dependencies in the image and in the SBOM.

      Note what is NOT a problem, since it is the common worry: colocated test files are
      already safe. SvelteKit's routes walker skips any file not starting with `+`
      (`create_manifest_data/index.js:237`), so `foo.test.ts` beside a `+page.svelte` is
      invisible to the router. It only ships if route code imports it.
    options:
      - title: "Stage a filtered routes tree and point kit.files.routes at it"
        description: "Mirror src/routes into .pokkum/routes as symlinks, omitting excluded paths, and set kit.files.routes to the mirror. Uses a supported config option (options.js:158) and mutates nothing the user wrote — the same shape as the existing vite-config injection."
        tradeoffs: "Relies on symlink resolution behaving: relative imports escaping the routes tree (`../../lib/x`) resolve from the link's real path under Vite's default realpath handling, which must be proven before trusting it. Excluding a parent whose children inherit its +layout must be rejected rather than silently breaking, and links to excluded routes become dead — worth a build-time warning."
      - title: "A Vite plugin that resolves excluded route modules to empty"
        description: "Intercept resolution and return an empty module for matching route files."
        tradeoffs: "Cheaper to write, but wrong in a subtle way: SvelteKit's manifest is generated independently of Vite resolution, so the routes still exist and would render blank rather than be absent. Trades a size win for a confusing runtime surface."
      - title: "Document the runtime guard and ship nothing"
        description: "Point users at the `+layout.server.ts` 404 guard."
        tradeoffs: "Zero cost and correct for access control, but leaves the code, its imports and its SBOM entries in the image — which is the part Pokkum exists to remove."
    recommendation: |
      First option, but measure before building it. Build a real project twice, once with the
      dev routes present and once with the directory removed, and compare image size and SBOM
      package counts. If a style guide really does drag in the whole component library the
      delta justifies the feature on size alone; if it is small, the honest answer is that the
      runtime guard covers most of the value and this belongs lower down.

      Whatever the size result, the attack-surface and SBOM-noise arguments stand on their own:
      a dev route that reaches privileged endpoints is worth not shipping at all, rather than
      shipping behind a guard that one refactor can remove.

      Config shape should name route paths rather than file globs (`exclude_routes: ["/dev/**"]`),
      since that is how the user thinks about them, and the guard test should assert the produced
      manifest lacks those routes rather than asserting on the filter's own bookkeeping.
    related: ["exe-secret-scan-gap"]

  - id: multi-arch-oci-compilation
    title: "Zero-dependency multi-arch OCI compilation"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Compiles a SvelteKit project straight into a multi-arch (linux/amd64, linux/arm64) OCI image with no Docker daemon or buildkit, using the project's configured adapter — or injecting one virtually into .pokkum/vite.config.ts when its two preconditions hold."
    flags: ["--strategy", "--platform"]
    impl:
      - internal/core/pipeline.go
      - internal/adapters/bunexec/compiler.go
      - internal/adapters/packager/packager.go
    limitations:
      - "Zero-config injection writes a transformed vite config one directory deeper (.pokkum/<viteConfigName>); __dirname/import.meta.url-derived paths and Vite's root/envDir/publicDir/build.outDir are corrected for this, but any new relative-path construct added to a future SvelteKit/Vite release needs the same audit before it can be assumed safe."
    evidence:
      commits: ["5693980"]

  - id: strategy-static
    title: "--strategy=static"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Compiles a pure static SvelteKit site onto chainguard/static with an embedded pokkum-static Go file server as PID 1 — genuinely functional only since 2026-08-19, after six independent bugs were found by its first real boot test."
    flags: ["--strategy=static", "--static"]
    impl:
      - internal/adapters/staticserver
      - supervisor/cmd/pokkum-static/main.go
      - supervisor/cmd/pokkum-static/server.go
      - internal/adapters/bunexec/compiler.go
      - testdata/fixtures/sveltekit-static
    limitations:
      - "Had never worked in any prior release before 2026-08-19: both HTTP servers bound no Addr and silently fell back to port 80 (finding 2, fixed 8306d37); Preflight rejected every real adapter-static project because it hard-coded a bun/node adapter check (finding 3); real prerendered output nests under pages/dependencies/data while the code assumed a flat tree (finding 4); there was no <path>.html fallback so every non-root prerendered route 404'd (finding 7); and the embedded pokkum-static blob was gitignored and absent from every CI job and released binary until 5693980 (finding 6). All fixed in 1c33509/5693980, proven against a real @sveltejs/adapter-static fixture rather than the synthetic mock that had been encoding the same wrong flat-tree assumption."
      - "Conditional GET (If-None-Match -> 304) was missing until 61fd873 (finding 12) — every request re-downloaded the full body even when the client already held the current copy."
      - "Its own Cache-Control contract (immutable /_app/immutable, no-cache version.json/prerendered HTML) is genuinely tested here (server_test.go, integration_test.go) — see [Cache-Control contract, tested](item:cache-control-contract) for why the layered/exe strategies don't have the equivalent."
    evidence:
      commits: ["8306d37", "1c33509", "5693980", "61fd873"]
      findings: [2, 3, 4, 6, 7, 12]

  - id: runtime-node
    title: "--runtime=node, the second runtime dimension"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Targets a distroless-node base and execs adapter-node output directly under /nodejs/bin/node with no Bun layer at all, proven by a real Docker boot and, since e918c52, an automated smoke test."
    flags: ["--runtime=bun", "--runtime=node"]
    impl:
      - internal/core/model.go
      - internal/core/pipeline.go
      - internal/core/runtime_node_test.go
      - tests/integration/runtime_smoke_node_test.go
    limitations:
      - "--telemetry is rejected outright for node, not silently ignored: the layered strategy's OTel bootstrap is a bun --preload mechanism with no Node equivalent."
      - "Node-core CVEs are unqueryable: distroless-node ships Node outside dpkg, invisible to the OS-package scanner, and the zero-dependency scanner has no Node-core ecosystem entry to query against OSV.dev."
      - "pokkum dev, pokkum resolve/apply, and standalone pokkum scan have zero runtime awareness — verified: no RuntimeNode reference anywhere in cmd/pokkum/dev.go, k8s.go, or scan.go."
      - "Correction to the source docs: Roadmap.md and Feature-list.md both still read, at the time of this migration, as if no automated boot smoke test existed for this runtime. That is stale — TestRuntimeSmoke_NodeRuntime_BootsAndServes (tests/integration/runtime_smoke_node_test.go) shipped in e918c52 and also asserts the *absence* of a Bun layer two independent ways, so it is real coverage, not a manual one-off."
    evidence:
      commits: ["f5229c3", "e918c52"]

  - id: rolling-deploy-asset-overlay
    title: "Rolling-deploy asset overlay (--asset-overlay)"
    status: shipped
    kind: feature
    tier: moat
    summary: "Merges the last N generations' immutable /_app/immutable client assets into a separate overlay layer, registry-side, so a browser holding a prior generation's HTML never hits a 404 mid-rollout."
    flags: ["--asset-overlay", "--asset-overlay-from"]
    impl:
      - internal/ports/assetoverlay.go
      - internal/adapters/assetoverlay
      - internal/core/pipeline.go
      - internal/adapters/packager/packager.go
      - tests/integration/asset_overlay_e2e_test.go
    limitations:
      - "pokkum verify's rebuild-and-compare path does not reproduce this layer — see [pokkum verify doesn't reproduce the asset-overlay layer](item:asset-overlay-verify-gap)."
      - "Lineage discovery is registry-side via a pokkum.dev/predecessor manifest annotation, deliberately independent of Kubernetes' pokkum.dev/image-history — a build-time flag cannot depend on cluster state without coupling build to Kubernetes. The annotation is only stamped when --asset-overlay is actually in use, so auto-discovery can only find a chain that opted in from the start of a rollout sequence."
      - "Requires --output=push for auto-discovery (there is no current tag to inspect for --local/--tarball); --asset-overlay-from's explicit refs work regardless of output mode."
    evidence:
      commits: ["f9c2f1d"]

  - id: bun-layer-diffid-stability
    title: "Bun/supervisor layer diffID stability, pinned twice"
    status: shipped
    kind: fix
    tier: foundation
    summary: "Immutable-binary layers (Bun, pokkum-init, pokkum-static) now use a fixed epoch and disable Go's VCS stamping, so their ~90MB digest stops churning on every commit for content that never actually changed."
    impl:
      - internal/adapters/packager/packager.go
      - Makefile
    limitations:
      - "This was a real bug, not a missing assertion: writing the stability test found the diffID derived its tar timestamp from SOURCE_DATE_EPOCH, which changes every commit, actively inverting what was supposed to be the single biggest fleet-wide size lever (fixed 1675d4c)."
      - "The fix was itself silently undermined until 81a6fb6: Go's default -buildvcs stamping made the pokkum-init/pokkum-static binaries' own content change every commit regardless of the tar-timestamp pin, so the two layers containing them kept churning anyway — the same failure class (build metadata leaking into a content-addressed artifact) as the first bug, a second independent source of it in the identical layers. Closed with -buildvcs=false on both embedded-binary build targets; the main CLI build deliberately keeps VCS stamping since it wants version reporting."
    evidence:
      commits: ["1675d4c", "81a6fb6"]
      findings: [17]

  - id: layered-runtime-hardening
    title: "Layered-strategy runtime hardening (stub launcher + startup attestation)"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "Two composable mitigations for stock Bun's full CLI attack surface in a layered image: a non-foldable compiled entrypoint launcher, and a supervisor-verified startup digest over the /app tree."
    flags: ["--stub-launcher", "POKKUM_STUB_LAUNCHER", "POKKUM_ATTESTATION_DIGEST"]
    impl:
      - internal/adapters/bunexec/compiler.go
      - internal/adapters/packager/packager.go
    limitations:
      - "Startup attestation only exists for --strategy=layered; --strategy=exe and --strategy=static don't attest."
      - "The attested root set lives in two places that cannot share a value: ports.AttestationRoots and pokkum-init's hand-copied attestRoots (the supervisor must not import ports). Adding /app/node_modules to the packager's manifest without updating the mirror made every layered image exit 125 at startup, with the full test suite green — the build hashed 11762 files while the runtime could find 509. Both lists now carry node_modules, and TestAttestationRoots_MatchSupervisorMirror parses the supervisor's declaration with go/ast and fails on any divergence; TestAttestation_StampedDigestMatchesImageFilesystem re-derives the digest by replaying a real built image's layers rather than from the packager's own directory table, which had the same omission and so agreed with the bug."
    evidence:
      commits: ["fb23335"]

  - id: bun-release-integrity
    title: "Bun release checksum verification"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "Every downloaded Bun release archive is checksum-verified before extraction — pinned digests for common versions, Bun's own GPG-signed SHASUMS256.txt.asc for anything else — failing closed rather than silently installing an unverifiable download."
    impl:
      - internal/adapters/bunruntime/resolver.go
    limitations:
      - "PB-2's first-contact gap is a stated, permanent limitation, not an open TODO: the very first resolve of a genuinely new, unlisted (version, target) on a fresh cache has no independent trust anchor beyond the GPG-signed manifest itself — GitHub's Releases API shares the same trust root as the download host and exposes no per-asset digests, so it adds no real signal. Re-running scripts/pin-bun-checksums periodically narrows this; nothing closes it fully."
    evidence:
      commits: ["0e8ae5e", "4d8ba1b"]

  - id: registry-push-and-cache
    title: "Registry push throughput, tagging, and composite remote-cache"
    status: shipped
    kind: feature
    tier: foundation
    summary: "Parallel HTTP/2 layer uploads, cross-repo blob mounting, idempotent pushes, repeatable --tag support, and a composite input hash that skips a full rebuild in sub-100ms on a verified registry cache hit."
    flags: ["--tag", "--push-concurrency", "--cache-verify", "--compression"]
    impl:
      - internal/adapters/registry/push.go
      - internal/adapters/registry/mount.go
      - internal/adapters/layercacheutils/layercacheutils.go
    limitations:
      - "Before b350ecb there was no way to tag an image at all — every build published latest unconditionally. Tags apply registry-side after the image is hashed, so the tag set never affects the digest."
      - "A remote-cache hit skips VerifyBaseImage/native inspection by design (the base digest is already bound into the cache key), but the cache-verify key chain never reads req.Signing.PublicKeyPEM, so a build signed via --signing-key alone doesn't automatically make its own cache entries independently verifiable — falls through to a full rebuild rather than failing fast with a clear story (tracked in Serena mem:open_decisions, not this file's scope)."
    evidence:
      commits: ["b350ecb"]

  - id: hermetic-build-mode
    title: "Hermetic build mode (--hermetic)"
    status: shipped
    kind: hardening
    tier: foundation
    summary: "Enforces real Linux network-namespace isolation for the build subprocess (no IP egress regardless of what a compromised dependency's build-time code tries), falling back to advisory-only isolation elsewhere."
    flags: ["--hermetic", "--hermetic-mount-isolation"]
    impl:
      - internal/core/pipeline.go
    limitations:
      - "Requires cached base image resolution, pre-populated node_modules/, and a pre-cached Bun binary — fails closed rather than downloading, so a cold cache cannot hermetic-build."
      - "--hermetic-mount-isolation's docker.sock mask has an honest residual gap: the sandboxed process retains CAP_SYS_ADMIN in its own namespace (the capability that created the mask), so a sufficiently sophisticated dependency aware of the mechanism could in principle umount() it. Closing this needs capset(2) to drop the capability before the final exec — not attempted."
    evidence:
      commits: ["28582b3", "00f791d"]

  # ---------------------------------------------------------------------
  # Open — Tier 3 (Registry & Runtime Ergonomics) and Tier 5 (Monorepo &
  # Config Drift)
  # ---------------------------------------------------------------------

  - id: asset-overlay-verify-gap
    title: "pokkum verify doesn't reproduce the asset-overlay layer"
    stage: v1.1
    status: shipped
    kind: fix
    tier: foundation
    summary: "Verifying an image built with --asset-overlay reports a false-positive digest mismatch, because verify's rebuild path has no way to re-resolve the same predecessor chain."
    problem: |
      [Rolling-deploy asset overlay](item:rolling-deploy-asset-overlay) shipped with a known,
      deliberately-not-closed gap: `pokkum verify`'s default rebuild-and-compare path has no
      `--asset-overlay`/`--asset-overlay-from` flags of its own, so it cannot reproduce the merged
      overlay layer when rebuilding for comparison. An image legitimately built with
      `--asset-overlay` therefore fails verification with an overlay-layer digest mismatch, even
      though nothing is wrong with it.
    options:
      - title: "Accept the same --asset-overlay-from refs verify's caller already knows"
        description: "Add --asset-overlay/--asset-overlay-from to pokkum verify, mirroring the build-side flags exactly."
        tradeoffs: "Simple and consistent, but only works if the caller still knows (or can reconstruct) the exact generation chain the original build resolved."
      - title: "Read the chain back off the image's own annotation"
        description: "Stamp the resolved predecessor digests onto a pokkum.dev/asset-overlay-sources annotation at build time, and have verify read it back automatically before rebuilding."
        tradeoffs: "No extra flags for the caller, self-describing — but adds another annotation to keep in sync with the actual overlay layer contents."
    recommendation: "Read the chain back off a pokkum.dev/asset-overlay-sources annotation, since it needs no caller-side bookkeeping and keeps verify's rebuild path self-contained."
    decision: |
      Option B, shipped 2026-08-19. The annotation already existed on every per-platform manifest
      of the pushed image, so only the read side was missing. `comparator.CompareImages` now reads
      it, reconstructs the merged overlay from the named predecessors through the real
      `assetoverlay` resolver, rebuilds the layer using the remote config's own `Created`
      timestamp, and only splices it into the comparison once the reconstructed DiffID equals the
      image's actual overlay-layer DiffID.

      That equality check is what makes this safe rather than merely permissive: a tampered
      annotation and a tampered layer are indistinguishable from outside, so any mismatch is
      treated as tampering. Absent annotation, malformed entry, missing reconstruction support,
      an unreachable predecessor, or an annotation with no matching overlay layer in the image's
      own history are all hard errors. Stripping the annotation buys an attacker nothing: the
      overlay layer is still there, the plain rebuild still lacks it, and the ordinary comparison
      reports L3 — proven by test, not by argument.

      A new `ports.LayerBuilder` port keeps this out of an adapter-to-adapter import.
    flags: ["--asset-overlay", "--asset-overlay-from"]
    impl:
      - internal/adapters/comparator/comparator.go
      - internal/adapters/packager/layerbuilder.go
      - internal/ports/packager.go
      - cmd/pokkum/verify.go
    limitations:
      - "Images whose only output is a local tarball carry no annotations at all, so this path cannot help them — see [Tarball output silently drops every OCI annotation](item:tarball-output-drops-annotations)."
    related: ["rolling-deploy-asset-overlay", "tarball-output-drops-annotations"]

  - id: tarball-output-drops-annotations
    title: "Tarball output silently drops every OCI annotation"
    status: shipped
    kind: fix
    tier: foundation
    summary: "pokkum build --output=tarball writes the legacy docker-save format, which has no annotations field, so every annotation Pokkum stamps is lost without warning."
    problem: |
      `internal/adapters/registry/tarball.go`'s `Write` uses go-containerregistry's
      `tarball.MultiWriteToFile`, the legacy `docker save` format. Its manifest entry carries only
      `Config`, `RepoTags`, `Layers` and `LayerSources` — there is no annotations field in the
      format at all, confirmed by reading the writer's own struct in
      go-containerregistry v0.21.9.

      Every annotation Pokkum stamps is therefore silently discarded for tarball output:
      `pokkum.dev/predecessor`, `pokkum.dev/asset-overlay-sources`, `pokkum.dev/vex-exemptions`,
      `pokkum.dev/env-baked` and the `org.opencontainers.image.*` set. Registry push is
      unaffected. Nothing warns.

      Found while implementing [pokkum verify doesn't reproduce the asset-overlay layer](item:asset-overlay-verify-gap),
      whose fix depends on reading one of those annotations back — so for an `--asset-overlay`
      image whose only output was a tarball, that fix cannot engage and the old false positive
      remains for that output mode specifically.
    options:
      - title: "Write an OCI layout instead"
        description: "Emit an OCI image layout, which has first-class annotation support, either replacing the docker-save tarball or as a second output mode."
        tradeoffs: "Correct and future-proof, and overlaps with the already-planned --to-oci-layout work — but docker load does not accept an OCI layout, so replacing the current format outright would break anyone piping into Docker."
      - title: "Warn when annotations would be dropped"
        description: "Keep the format and emit a loud warning listing the annotations being discarded whenever tarball output is used on an image that has any."
        tradeoffs: "Cheap and honest, but leaves the data genuinely lost — it converts a silent failure into a visible one rather than fixing it."
    recommendation: "Do both, in order: warn now, since a silent loss of provenance metadata is the actual defect, then fold real annotation support into the --to-oci-layout work rather than duplicating it."
    decision: |
      Warn half shipped 2026-08-19 (cd5c7f0). `Write` in tarball.go now calls a shared
      `warnDroppedAnnotations` helper (registry.go) after a successful write, naming every
      manifest annotation key actually being discarded, sorted, deterministic across runs. It
      is a deliberate no-op when the image carries no annotations at all, so an ordinary build
      stays silent. A `pokkum.dev/*` key gets its own clause calling out that other Pokkum
      commands (e.g. `pokkum verify` reading `pokkum.dev/asset-overlay-sources`) cannot work
      against this output, distinct from the purely descriptive `org.opencontainers.image.*`
      set. `--local` shares the same fix: `daemon.Write` (daemon.go) calls `tarball.Write`
      internally, so it hits the identical annotations-less docker-save format and now warns
      too — beyond this item's original scope but the same root cause, so it was folded in
      rather than filed separately.

      Second half shipped as
      [--to-oci-layout for daemonless cluster loading](item:oci-layout-dev-output), per the
      recommendation above rather than duplicated here. `--to-oci-layout <dir>` writes a
      standards-conformant OCI image layout, which has first-class annotation support: every
      `org.opencontainers.image.*` and `pokkum.dev/*` key survives on both the per-platform
      manifests and the index, and the multi-platform index itself is written faithfully instead
      of being flattened into one platform-suffixed tag per child. The layout writer therefore
      does NOT call `warnDroppedAnnotations` — there is nothing to warn about, and
      `TestOCILayout_AnnotationsSurvive_TarballLosesThem` asserts the warning's absence rather
      than leaving that to a comment. That same test runs one annotated payload through both
      writers in one place, so "annotations are preserved" is asserted against the loss it fixes
      rather than in isolation.

      `--tarball` itself is deliberately unchanged and still lossy. The format cannot carry
      annotations at all, and replacing it with a layout would break everyone piping into
      `docker load`, which does not accept one — so the two modes now coexist: the docker-save
      format for Docker compatibility, warning honestly about what it drops, and the OCI layout
      for anything that needs the metadata to survive. `--local` is in the same position for the
      same reason (the daemon's classic image store has no annotations either) and keeps its
      warning.
    impl:
      - internal/adapters/registry/tarball.go
      - internal/adapters/registry/daemon.go
      - internal/adapters/registry/registry.go
      - internal/adapters/registry/ocilayout.go
      - internal/adapters/registry/tarball_test.go
      - internal/adapters/registry/daemon_test.go
      - internal/adapters/registry/ocilayout_test.go
    limitations:
      - "The `--tarball` and `--local` outputs remain annotation-free by design; the fix is a lossless alternative mode plus an honest warning on the lossy ones, not a change to the docker-save format, which has no annotations field to write into."
      - "`pokkum verify`'s rebuild-and-compare path for an `--asset-overlay` image can now engage against an OCI layout, since `pokkum.dev/asset-overlay-sources` survives there — but an image whose only output was `--tarball` still cannot be verified that way."
    evidence:
      commits: ["cd5c7f0"]
    related: ["asset-overlay-verify-gap", "oci-layout-dev-output"]

