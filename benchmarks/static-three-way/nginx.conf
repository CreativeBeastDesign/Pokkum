server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SvelteKit prerendered route resolution & caching
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Immutable assets
    location /_app/immutable/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }
}
