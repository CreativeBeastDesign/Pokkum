version: "2"

# Migrated from the v1 schema with `golangci-lint migrate` (v2.12.2). The five
# linters v1 listed explicitly — errcheck, govet, staticcheck, ineffassign,
# unused — are enabled by DEFAULT in v2 and so no longer appear under `enable`;
# `golangci-lint linters` confirms all eight from the v1 config are still active.
# In v2 staticcheck also absorbed gosimple and stylecheck, which is why new SA/S/
# ST/QF checks appear that v1 never ran.

issues:
  # No silent caps. The defaults (max-issues-per-linter: 50, max-same-issues: 3)
  # hid 42 of 57 findings during this migration, and which 3 of a kind you saw
  # varied between runs with analysis order — a lint report that silently
  # truncates is indistinguishable from a clean one. See mem:self_review_checklist
  # row 47.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      # Three checks new in this gosec generation, all excluded after reading the
      # flagged sites rather than on principle:
      #   G703 (path traversal, taint analysis) — 16 sites. gosec has no
      #     interprocedural view, so it cannot see the containment these paths
      #     already pass through: pokkum-static resolves every candidate via
      #     resolveInRoot (EvalSymlinks + filepath.Rel containment, and its doc
      #     comment states no candidate gets a weaker check), and the build-time
      #     sites operate on the user's own project directory.
      #   G702 (command injection, taint analysis) — 1 site: pokkum-init's PID-1
      #     os.StartProcess runs the operator-configured command. That IS the
      #     feature.
      #   G122 (filepath.Walk callback symlink TOCTOU) — 5 sites. Unlike the
      #     other two this is a legitimate hardening suggestion (os.Root), not a
      #     false positive, but it is a real refactor across three packages and is
      #     tracked as its own roadmap item rather than rushed in beside a linter
      #     upgrade.
      excludes:
        - G703
        - G702
        - G122
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Opinionated style checks from the stylecheck/quickfix sets staticcheck
      # absorbed in v2. Excluded by text so staticcheck's default check set is
      # otherwise untouched — do NOT express this as `settings.staticcheck.checks:
      # [all, -QF1001]`, because `all` switches ON checks the default set leaves
      # off and quietly widens the linter instead of narrowing it.
      #   QF1001 (apply De Morgan's law) — 7 sites, all in byte-scanning loops
      #     where `!(c == '*' && next == '/')` reads as "not at a comment
      #     terminator"; the equivalent De Morgan form is harder to read exactly
      #     where it matters.
      #   QF1011 (omit inferrable type) — 1 site, `var handler http.Handler =
      #     registry.New(...)`, where the explicit interface type is deliberate:
      #     dropping it changes the variable's static type to the concrete one.
      #     ST1023 is the same concern under an older check ID; both are listed so
      #     the exclusion holds whichever one this version emits.
      - linters: [staticcheck]
        text: QF1001
      - linters: [staticcheck]
        text: (QF1011|ST1023)
      - linters: [gosec]
        path: internal/adapters/bunexec/.*
        text: G204
      - linters: [gosec]
        path: internal/adapters/(supervisor|packager)/.*
        text: G204
      - linters: [gosec]
        text: G306
      - linters: [gosec, revive, staticcheck]
        path: _test\.go$
      - linters: [revive]
        path: cmd/pokkum/.*
        text: unused-parameter
      - linters: [revive]
        path: internal/adapters/nativeinspect/.*
        text: unused-parameter
    paths:
      - testdata
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
